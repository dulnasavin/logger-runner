name: "Crypto Logger | Ordered receipt writer"
run-name: "Crypto Logger | Writer | ${{ inputs.receipt_path }}"

on:
  workflow_dispatch:
    inputs:
      receipt_path:
        description: "Receipt path; leave blank to reconcile up to 50 pending receipts"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-five-minute-writer
  cancel-in-progress: false
  queue: max

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
      DATA_BRANCH: runtime-data
      RECEIPT_REL: ${{ inputs.receipt_path }}
    steps:
      - name: Validate protected invocation and receipt path
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if test -n "$RECEIPT_REL"; then
            [[ "$RECEIPT_REL" =~ ^inbox/[0-9]{4}/(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-2][0-9][0-5][0-9]-(main|main2|main3)-[0-9]{1,20}\.json$ ]]
          fi

      - name: Checkout public release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select pinned private source
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability logger
          --github-output "$GITHUB_OUTPUT"

      - name: Checkout immutable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          path: private_source
          sparse-checkout: |
            Crypto Logger-Private Repo
          persist-credentials: false

      - name: Checkout runtime data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
          path: private_data
          sparse-checkout: |
            /csv_state.json
            /provider_incident_state.json
            /five_minute/partition_manifest.json
            /five_minute/provider_events/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Apply receipt and publish one fast-forward commit
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/private_source/Crypto Logger-Private Repo/five_minute_store.py"
          test -s "$SCRIPT"
          ASKPASS="${RUNNER_TEMP}/five-minute-writer-askpass"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          cd private_data
          test "$(git branch --show-current)" = "$DATA_BRANCH"
          git config user.name github-actions
          git config user.email actions@github.com
          if [[ -n "$RECEIPT_REL" ]]; then
            day="${RECEIPT_REL#inbox/}"
            day="${day%/*}"
            git sparse-checkout add --no-cone "/five_minute/inbox/$day/" "/five_minute/ledger/$day/"
          else
            git sparse-checkout add --no-cone /five_minute/inbox/ /five_minute/ledger/
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DATA_BRANCH"
            git reset --hard FETCH_HEAD
            test -s five_minute/partition_manifest.json || {
              echo "::error::Verified legacy migration is required before writer activation"
              exit 1
            }
            paths=()
            if test -n "$RECEIPT_REL"; then
              test -s "five_minute/$RECEIPT_REL"
              paths+=("five_minute/$RECEIPT_REL")
            else
              pending_json="$(python "$SCRIPT" pending --root five_minute)"
              mapfile -t pending < <(jq -r '.[:50][]' <<< "$pending_json")
              for relative in "${pending[@]}"; do
                paths+=("five_minute/$relative")
              done
              if test "${#paths[@]}" -eq 0; then
                echo "No pending receipts"
                exit 0
              fi
            fi
            args=()
            for file in "${paths[@]}"; do args+=(--receipt "$file"); done
            python "$SCRIPT" apply --root five_minute --state csv_state.json "${args[@]}"
            git add -- five_minute provider_incident_state.json
            changed="$(git diff --cached --name-only)"
            if test -z "$changed"; then
              echo "Receipt already applied and committed"
              exit 0
            fi
            if printf '%s\n' "$changed" | grep -Ev '^(five_minute/|provider_incident_state[.]json$)'; then
              echo "::error::Unexpected writer path"
              exit 1
            fi
            git commit -m "Apply five-minute receipt ${RECEIPT_REL}"
            if git push origin "HEAD:$DATA_BRANCH"; then
              local_sha="$(git rev-parse HEAD)"
              git fetch origin "$DATA_BRANCH"
              git merge-base --is-ancestor "$local_sha" FETCH_HEAD
              echo "Verified runtime-data commit: $local_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Concurrent update; replaying against latest runtime-data"
            sleep 2
          done
          echo "::error::Writer could not publish after five safe retries"
          exit 1


      - name: Record pending provider event in the private repository and verify acknowledgement
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PROVIDER_ISSUE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          cd private_data
          export GIT_ASKPASS="$RUNNER_TEMP/provider-ack-askpass"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          umask 077
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *Password*) printf '%s\n' "$PRIVATE_DATA_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          git fetch origin "$DATA_BRANCH"
          git reset --hard FETCH_HEAD
          id="$(jq -r '.pending_notification.event_id // empty' provider_incident_state.json)"
          if [[ -z "$id" ]]; then exit 0; fi
          [[ "$id" =~ ^[0-9a-f]{32}$ ]]
          event="five_minute/provider_events/$id.json"
          if [[ ! -f "$event" ]]; then
            echo "::warning::Pending event predates the receipt writer; check existing delivery records"
            exit 0
          fi
          title="Price logger provider event $id"
          matches="$(gh api --paginate "repos/$PRIVATE_REPOSITORY/issues?state=all&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number")"
          if [[ -z "$matches" ]]; then
            summary="$(jq -r '[.event_type,.severity,.notification_reason] | join(" / ")' "$event")"
            matches="$(gh api --method POST "repos/$PRIVATE_REPOSITORY/issues" \
              -f title="$title" -f body="$summary. Evidence is recorded in the private runtime receipt journal." --jq .number)"
          fi
          [[ "$matches" =~ ^[0-9]+$ ]]
          actual="$(gh api "repos/$PRIVATE_REPOSITORY/issues/$matches" --jq .title)"
          [[ "$actual" == "$title" ]]
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DATA_BRANCH"
            git reset --hard FETCH_HEAD
            ack="five_minute/provider_events/$id.ack.json"
            if [[ -f "$ack" ]]; then jq -e --arg id "$id" --argjson n "$matches" '.event_id==$id and .private_issue==$n' "$ack"; exit 0; fi
            jq -nc --arg id "$id" --argjson n "$matches" '{event_id:$id,private_issue:$n}' > "$ack"
            if [[ "$(jq -r '.pending_notification.event_id // empty' provider_incident_state.json)" == "$id" ]]; then
              python "$GITHUB_WORKSPACE/private_source/Crypto Logger-Private Repo/provider_consensus.py" \
                acknowledge-delivery --state-file provider_incident_state.json --event-file "$event"
            fi
            git add -- "$ack" provider_incident_state.json
            git commit -qm "Record confirmed private provider issue $matches"
            commit="$(git rev-parse HEAD)"
            git push origin "HEAD:$DATA_BRANCH" || true
            git fetch origin "$DATA_BRANCH"
            if git merge-base --is-ancestor "$commit" FETCH_HEAD; then exit 0; fi
          done
          exit 1
