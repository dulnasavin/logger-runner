name: Binance History | 100 Markets
run-name: Binance History | ${{ github.event_name == 'schedule' && 'scheduled download' || inputs.mode }} | batch ${{ github.run_number }}

on:
  schedule:
    # Every five hours until 5 Oct 2026 at 12:00 a.m. New Zealand time.
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or download/resume verified one-minute archives
        type: choice
        options: [plan, download]
        default: plan
        required: true
      max_files:
        description: Maximum new file uploads (raw archives and daily-CSV bundles) in this batch (1 to 10000)
        type: string
        default: '10000'
        required: true

permissions:
  contents: read

concurrency:
  group: binance-history-100
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  HISTORY_CODE_SHA: 67ed68824d23024cbde62e6243ed529f62be8532
  HISTORY_SCHEDULE_END_UTC: '2026-10-04T12:00:00Z'

jobs:
  history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Enforce scheduled end date
        id: schedule_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || \
             (( $(date -u +%s) < $(date -u -d "$HISTORY_SCHEDULE_END_UTC" +%s) )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled downloads ended at $HISTORY_SCHEDULE_END_UTC."
          fi

      - name: Checkout pinned private history code
        id: private_code
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.HISTORY_CODE_SHA }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: |
            binance_history
            Crypto Logger-Private Repo/vpn_auth_recovery
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Plan or resume private dataset releases
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
          HISTORY_MODE: ${{ github.event_name == 'schedule' && 'download' || inputs.mode }}
          HISTORY_MAX_FILES: ${{ github.event_name == 'schedule' && '5000' || inputs.max_files }}
          HISTORY_MAX_MINUTES: '340'
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/run.py

      - name: Send history batch email
        if: always() && steps.schedule_gate.outputs.run == 'true' && steps.private_code.outcome == 'success'
        timeout-minutes: 1
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
        run: timeout --kill-after=5s 45s python private_source/binance_history/notify.py

      - name: Remove private source and temporary report
        if: always() && steps.schedule_gate.outputs.run == 'true'
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
        run: |
          rm -rf private_source
          rm -f "$HISTORY_REPORT_PATH"
