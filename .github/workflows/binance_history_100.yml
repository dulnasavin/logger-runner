name: Binance History | 100 Markets
run-name: Binance History | ${{ inputs.mode }} | batch ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or download/resume verified one-minute archives
        type: choice
        options: [plan, download]
        default: plan
        required: true
      max_files:
        description: Maximum new file uploads (raw archives and daily-CSV bundles) in this batch (1 to 1000)
        type: string
        default: '200'
        required: true

permissions:
  contents: read

concurrency:
  group: binance-history-100
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  HISTORY_CODE_SHA: 8042d6066d15fcce133232a0363df59c9b4e5e58

jobs:
  history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout pinned private history code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.HISTORY_CODE_SHA }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Plan or resume private dataset releases
        env:
          HISTORY_MODE: ${{ inputs.mode }}
          HISTORY_MAX_FILES: ${{ inputs.max_files }}
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/run.py
