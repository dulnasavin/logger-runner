name: Binance History | 100 Markets
run-name: Binance History | ${{ inputs.mode || 'download' }} | batch ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: Binance only while Kraken collection is paused
        type: choice
        options: [binance]
        default: binance
        required: true
      mode:
        description: Plan only, or download/resume verified one-minute archives
        type: choice
        options: [plan, download]
        default: download
        required: true
      max_files:
        description: Maximum new private file uploads in this batch (1 to 10000)
        type: string
        default: '10000'
        required: true

permissions:
  contents: read

concurrency:
  group: binance-history-100
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  HISTORY_CODE_SHA: c41447ef4173be287bdf7cce9ecf5859779945cf

jobs:
  history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout pinned private history code
        id: private_code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.HISTORY_CODE_SHA }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: |
            binance_history
            Crypto Logger-Private Repo/vpn_auth_recovery
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Plan or resume private dataset releases
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
          HISTORY_EXCHANGE: ${{ inputs.exchange || 'binance' }}
          HISTORY_MODE: ${{ inputs.mode || 'download' }}
          HISTORY_MAX_FILES: ${{ inputs.max_files || '10000' }}
          HISTORY_MAX_MINUTES: '340'
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          if [[ "$HISTORY_EXCHANGE" != 'binance' ]]; then
            echo 'Kraken history is paused; Binance is the only permitted exchange.' >&2
            exit 2
          fi
          python private_source/binance_history/run.py

      - name: Send history batch email
        if: always() && steps.private_code.outcome == 'success'
        timeout-minutes: 1
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
        run: timeout --kill-after=5s 45s python private_source/binance_history/notify.py

      - name: Remove private source and temporary report
        if: always()
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/history-status.json
        run: |
          rm -rf private_source
          rm -f "$HISTORY_REPORT_PATH"
