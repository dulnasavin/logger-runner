name: "Neon Audit | Weekly"
run-name: "Neon Audit | ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_WEEKLY_AUDIT after testing on an isolated Neon branch"
        required: true
        type: string
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data
  PRIVATE_CODE_SHA: ${{ vars.PRIVATE_CODE_SHA }}

concurrency:
  group: crypto-runtime-data
  cancel-in-progress: false

jobs:
  neon-audit:
    name: Audit Neon against private runtime data
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'RUN_WEEKLY_AUDIT') ||
      (github.event_name == 'schedule' &&
       vars.ENABLE_NEON_WEEKLY_AUDIT == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN" || { echo "No effective private code-read token is configured"; exit 1; }
          test -n "$PRIVATE_DATA_TOKEN" || { echo "No effective private data token is configured"; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL is missing"; exit 1; }

      - name: Checkout private runtime data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 0
          persist-credentials: false

      - name: Read exact private source handoff
        id: manifest
        run: |
          set -euo pipefail
          test -s private_data/runtime_manifest.json
          SOURCE_SHA="$(jq -r '.source_code_sha // empty' private_data/runtime_manifest.json)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "runtime_manifest.json has no valid source SHA"
            exit 1
          }
          test "$SOURCE_SHA" = "${PRIVATE_CODE_SHA,,}" || {
            echo "runtime manifest source is not the approved PRIVATE_CODE_SHA"
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C private_data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.manifest.outputs.source_sha }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble exact audit workspace
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.manifest.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          for state_file in price_log.csv csv_state.json; do
            test -s "private_data/$state_file"
            cp -- "private_data/$state_file" "private_source/$state_file"
          done
          test -s "private_source/Crypto Logger-Private Repo/requirements.lock"
          test -s "private_source/Crypto Logger-Private Repo/csv_integrity.py"
          test -s "private_source/Neon Weekly Audit/neon_audit.py"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: private_source/Crypto Logger-Private Repo/requirements.lock

      - name: Install and validate locked audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r "private_source/Crypto Logger-Private Repo/requirements.lock"
          python -m pip check
          python -m py_compile \
            "private_source/Crypto Logger-Private Repo/csv_integrity.py" \
            "private_source/Neon Weekly Audit/neon_audit.py"

      - name: Run generation-aware controlled reconciliation
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd private_source
          python "Neon Weekly Audit/neon_audit.py" | tee "${RUNNER_TEMP}/neon-audit-summary.txt"

      - name: Commit only CSV rows restored from Neon
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          cp -- private_source/price_log.csv private_data/price_log.csv
          cd private_data
          if git diff --quiet -- price_log.csv; then
            echo "No Neon-only rows needed CSV restoration"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- price_log.csv
          git commit -m "Restore audited CSV rows from Neon"
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          git fetch origin "$PRIVATE_DATA_BRANCH"
          git rebase "origin/$PRIVATE_DATA_BRANCH" || {
            git rebase --abort || true
            echo "Runtime data changed during audit; no overwrite attempted"
            exit 1
          }
          git push origin "HEAD:$PRIVATE_DATA_BRANCH"
          rm -f "$ASKPASS"

      - name: Add sanitized workflow summary
        if: always()
        env:
          SOURCE_SHA: ${{ steps.manifest.outputs.source_sha || 'unavailable' }}
          DATA_SHA: ${{ steps.manifest.outputs.data_sha || 'unavailable' }}
        run: |
          {
            echo "## Neon Weekly Audit"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Starting data commit: \`$DATA_SHA\`"
            echo "- Same-key conflicts are never auto-overwritten."
            echo "- Neon deletes require an exact CSV-state tombstone created by controlled maintenance."
            if test -s "${RUNNER_TEMP}/neon-audit-summary.txt"; then
              echo "### Sanitized counters"
              grep -E '^(Dataset generation|Missing in Neon before repair|Inserted into Neon|Missing in CSV before repair|Restored into CSV from Neon|Intentional deletion tombstones|Deleted from Neon|Conflicts|Status):' \
                "${RUNNER_TEMP}/neon-audit-summary.txt" || true
            fi
            echo "- Private row contents and raw audit logs were not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup private checkouts
        if: always()
        run: |
          rm -rf private_data private_source
          rm -f "${RUNNER_TEMP}/crypto-git-askpass"
