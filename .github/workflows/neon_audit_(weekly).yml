name: "Neon Audit | Weekly"
run-name: "Neon Audit | ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: neon-database-operations
  cancel-in-progress: false

jobs:
  neon-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || { echo "PRIVATE_REPO_TOKEN is missing"; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL is missing"; exit 1; }

      - name: Clone private logger
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone \
            "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git" \
            private_logger

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: private_logger/Crypto Logger-Private Repo/requirements.txt

      - name: Install and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check psycopg2-binary
          test -f "private_logger/price_log.csv"
          test -f "private_logger/csv_state.json"
          test -f "private_logger/Crypto Logger-Private Repo/csv_integrity.py"
          test -f "private_logger/Neon Sync/db_schema.sql"
          test -f "private_logger/Neon Weekly Audit/neon_audit.py"
          python -m py_compile \
            "private_logger/Crypto Logger-Private Repo/csv_integrity.py" \
            "private_logger/Neon Weekly Audit/neon_audit.py"

      - name: Apply idempotent Neon schema migration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg2

          sql = Path("private_logger/Neon Sync/db_schema.sql").read_text(encoding="utf-8")
          with psycopg2.connect(os.environ["NEON_DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(sql)
          print("Neon schema is current")
          PY

      - name: Run bidirectional, non-destructive audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd private_logger
          python "Neon Weekly Audit/neon_audit.py" | tee "$RUNNER_TEMP/neon-audit.log"

      - name: Commit CSV rows restored from Neon
        run: |
          set -euo pipefail
          cd private_logger
          if git diff --quiet -- price_log.csv; then
            echo "No Neon-only rows needed CSV restoration"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- price_log.csv
          git commit -m "Restore missing CSV rows from Neon audit"
          git pull --rebase origin main || {
            git rebase --abort || true
            echo "Private main changed during the audit; no overwrite was attempted. Re-run the audit."
            exit 1
          }
          git push origin HEAD:main

      - name: Upload sanitized audit diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neon-audit-sanitized-${{ github.run_id }}
          path: ${{ runner.temp }}/neon-audit.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Add workflow summary
        if: always()
        run: |
          {
            echo "## Neon Weekly Audit"
            echo "- Reconciliation is generation-aware and non-destructive."
            echo "- Neon-only rows may be restored to CSV."
            echo "- Same-key conflicts are reported and never auto-overwritten."
            echo "- Private row contents were not printed or uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private_logger"
