name: Purge Binance History | One Time

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-history-100
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned private cleanup code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: cf1fc87e6136b0ffadc298bddb1766ddd3a52e7f
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false

      - name: Remove current Binance history releases
        env:
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python -m py_compile private_source/binance_history/purge_20261006.py
          python private_source/binance_history/purge_20261006.py

      - name: Remove private source
        if: always()
        run: rm -rf private_source
