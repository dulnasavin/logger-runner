name: One-time history ref cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup_history_refs_20261006.yml]

permissions:
  contents: write

concurrency:
  group: binance-history-100
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned private cleanup code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: b9f2cab38c372c6b7976511d0bcf41f7e8a6093e
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          fetch-depth: 1
          persist-credentials: false
      - name: Remove scoped tags and completed branches
        env:
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PUBLIC_REPOSITORY_TOKEN: ${{ github.token }}
        run: python private_source/binance_history/cleanup_refs_20261006.py
      - name: Remove private source
        if: always()
        run: rm -rf private_source
