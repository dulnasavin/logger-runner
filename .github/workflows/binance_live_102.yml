name: Binance Live | 102 Markets
run-name: Binance Live | manual batch ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Optional one-market check; blank processes all 102
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: market-data-binance-102
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  HISTORY_CODE_SHA: ac63b225137d5a94992c30a60a003df64368e05a

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout public workflow support
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout pinned private collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.HISTORY_CODE_SHA }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: |
            binance_history
            Crypto Logger-Private Repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify history and live regression tests
        run: python -m unittest discover -s private_source/binance_history -p 'test_*.py' -q

      - name: Bootstrap managed VPN1 with VPN2 standby
        uses: ./.github/actions/market-live-network
        with:
          vpn1_config: ${{ secrets.VPNBOOK_CONFIG }}
          vpn1_username: ${{ secrets.VPNBOOK_USERNAME }}
          vpn1_password: ${{ secrets.VPNBOOK_PASSWORD }}
          vpn2_config: ${{ secrets.VPN2_CONFIG }}
          vpn2_username: ${{ secrets.VPN2_USERNAME }}
          vpn2_password: ${{ secrets.VPN2_PASSWORD }}
          secret_update_token: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}

      - name: Check verified history gate and collect closed minutes
        env:
          HISTORY_LIVE_PRODUCTION: 'YES'
          PYTHONPATH: ${{ github.workspace }}/private_source/Crypto Logger-Private Repo
          HISTORY_LIVE_PAIR: ${{ inputs.pair || '' }}
          HISTORY_LIVE_MAX_MINUTES: '55'
          HISTORY_LIVE_COVERAGE_PATH: ${{ runner.temp }}/binance-live-coverage.json
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/live.py

      - name: Retain per-market attempt outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binance-live-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/binance-live-coverage.json
          if-no-files-found: warn
          retention-days: 90

      - name: Stop managed network and clear runtime credentials
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/network-manager" ] && [ -d private_source ]; then
            python "private_source/Crypto Logger-Private Repo/s2_network_manager.py" reset || \
              echo '::warning::S2 reset failed; runner teardown must stop the tunnel'
          fi
          rm -rf "${RUNNER_TEMP}/vpn-runtime"

      - name: Remove private source
        if: always()
        run: rm -rf private_source


