name: Crypto Logger 100 | Staging Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-100-staging-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private staging source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: 559845bdb9bb33373eb79b8bc866165133878b98
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_staging
          sparse-checkout: |
            binance_history
            Crypto Logger-Private Repo
            Neon Sync
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Test 100-market logger and staging downloader
        run: |
          python -m unittest discover -s 'private_staging/Crypto Logger-Private Repo/tests' -p 'test_ohlc_100.py' -q
          python -m unittest discover -s private_staging/binance_history -p 'test_history.py' -q
          python -m unittest discover -s private_staging/binance_history -p 'test_daily_bundle.py' -q
          python -m unittest discover -s private_staging/binance_history -p 'test_reporting.py' -q
          python -m unittest discover -s 'private_staging/Neon Sync' -p 'test_sync_to_neon.py' -q
        env:
          PYTHONPATH: private_staging/Crypto Logger-Private Repo:private_staging/binance_history

      - name: Report staged Coinbase coverage
        run: |
          python - 'private_staging/Crypto Logger-Private Repo' <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from market_catalog import COINBASE_MAP, COINBASE_UNVERIFIED
          assert 'RUNE' not in COINBASE_MAP
          assert len(COINBASE_MAP) == 10 and len(COINBASE_UNVERIFIED) == 89
          print('Coinbase USD products mapped: 10/100; RUNE explicitly not listed; 89 require review')
          PY

      - name: Plan staging history without any storage token
        env:
          HISTORY_MODE: plan
        run: python private_staging/binance_history/run.py

      - name: Check current Binance spot status
        id: spot
        continue-on-error: true
        run: |
          python - 'private_staging/Crypto Logger-Private Repo' <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from coverage_audit import MARKETS, fetch_live_exchange_info, verify_binance_exchange_info
          issues = verify_binance_exchange_info(fetch_live_exchange_info())
          print(f'Live spot pairs verified: {len(MARKETS) - len(issues)}/{len(MARKETS)}')
          for issue in issues:
              print(issue)
          raise SystemExit(bool(issues))
          PY

      - name: Check first official IMX and RSR daily archives
        id: first_archives
        continue-on-error: true
        run: |
          python - <<'PY'
          import re
          import urllib.request
          for pair, date in [('IMXUSDT', '2022-01-10'), ('RSRUSDT', '2020-08-27')]:
              name = f'{pair}-1m-{date}.zip'
              url = f'https://data.binance.vision/data/spot/daily/klines/{pair}/1m/{name}.CHECKSUM'
              with urllib.request.urlopen(url, timeout=20) as response:
                  body = response.read(512).decode('ascii')
              parts = body.split()
              if len(parts) != 2 or not re.fullmatch('[0-9a-fA-F]{64}', parts[0]) or parts[1].lstrip('*') != name:
                  raise ValueError(f'{pair}: invalid official daily checksum')
              print(f'{pair} {date}: official daily archive checksum published')
          PY

      - name: Time one full 100-market closed-candle fetch
        id: batch
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python - 'private_staging/Crypto Logger-Private Repo' <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          sys.path.insert(0, sys.argv[1])
          from market_catalog import MARKETS
          from ohlc_5m import collect

          class ReadOnlySpotClient:
              def get_klines(self, **params):
                  query = urllib.parse.urlencode(params)
                  request = urllib.request.Request(
                      'https://data-api.binance.vision/api/v3/klines?' + query,
                      headers={'User-Agent': 'crypto-logger-staging-timing/1'})
                  with urllib.request.urlopen(request, timeout=5) as response:
                      body = response.read(20_001)
                  if len(body) > 20_000:
                      raise ValueError('Unexpected Binance candle response size')
                  return json.loads(body)

          pairs = {market['pair'][:-4]: market['pair'] for market in MARKETS}
          assert len(pairs) == 100
          started = time.monotonic()
          rows = collect(ReadOnlySpotClient(), pairs)
          elapsed = time.monotonic() - started
          print(f'Validated closed five-minute candles: {len(rows)}/100 in {elapsed:.1f}s')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'seconds={elapsed:.1f}\n')
          if elapsed >= 180:
              raise TimeoutError('100-market batch exceeds the three-minute staging budget')
          PY

      - name: Record staging gate outcome
        if: always()
        env:
          SPOT_OUTCOME: ${{ steps.spot.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.first_archives.outcome }}
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          BATCH_SECONDS: ${{ steps.batch.outputs.seconds }}
        run: |
          {
            echo '## 100-market staging audit'
            echo
            echo "- Live Binance spot check: $SPOT_OUTCOME"
            echo "- First IMX/RSR archives: $ARCHIVE_OUTCOME"
            echo "- Full 100-market candle batch: $BATCH_OUTCOME (${BATCH_SECONDS:-no time}s)"
            echo '- No history data was downloaded or uploaded.'
            echo '- Coinbase products mapped: 10/100; RUNE explicitly not listed; 89 require review.'
            echo '- Durable OHLC archival remains required before production.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SPOT_OUTCOME" = success && test "$ARCHIVE_OUTCOME" = success && test "$BATCH_OUTCOME" = success
