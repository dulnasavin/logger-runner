name: Workflow Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "44 6 * * 1"

permissions: {}

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@7999d8c8ac51dbd3bd44e6e35e7cd015b5dcdc82
        with:
          inputs: .github
          persona: pedantic
          version: "1.29.0"
          online-audits: true
          advanced-security: true
