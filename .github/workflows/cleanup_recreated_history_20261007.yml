name: One-time production history cleanup
on:
  push:
    branches: [staging]
    paths: [.github/workflows/cleanup_recreated_history_20261007.yml]

permissions:
  contents: read

concurrency:
  group: binance-history-100
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned scoped cleanup code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: a7b2e55b02a200ac23d0e3bda85739141df975db
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Delete and verify scoped production releases and tags
        env:
          PURGE_PRODUCTION_HISTORY: 'YES'
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/purge_recreated_production.py
      - name: Remove private source
        if: always()
        run: rm -rf private_source
