name: Binance Live | Staging Read-only Smoke
on:
  push:
    branches: [staging]
    paths: [.github/workflows/binance_live_staging_smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private staging code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: 5d83c6e4aa05c43ed1a7192a666d1b46835517e1
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run unit tests and read one BTC window
        env:
          PYTHONPATH: private_source/binance_history
        run: |
          python -m unittest discover -s private_source/binance_history -p 'test_*.py' -q
          python - <<'PY'
          import datetime as dt
          import live
          now=dt.datetime.now(dt.timezone.utc)
          day,start,end=live.minute_window(now)[1]
          rows=live.get_rows('BTCUSDT',max(start,end-4*60000),end)
          if not rows or rows[-1][0]>end:
              raise ValueError('No safe closed BTC minute')
          print('BTCUSDT staging read-only live minute check passed:',len(rows),'closed candles.')
          PY
      - name: Remove private source
        if: always()
        run: rm -rf private_source
