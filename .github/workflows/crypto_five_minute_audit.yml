name: "Crypto Logger | Manual five-minute coverage audit"

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "First UTC five-minute slot, e.g. 2026-11-01T00:00:00Z"
        required: true
        type: string
      end_utc:
        description: "Last UTC five-minute slot (inclusive; at most 14 days)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-five-minute-manual-coverage
  cancel-in-progress: false
  queue: max

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
      DATA_BRANCH: runtime-data
      START_UTC: ${{ inputs.start_utc }}
      END_UTC: ${{ inputs.end_utc }}
    steps:
      - name: Require protected main and aligned bounded range
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          def slot(name):
              value = os.environ[name]
              parsed = datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              if parsed.minute % 5:
                  raise ValueError(f"{name} must be aligned to a five-minute UTC slot")
              return parsed
          first, last = slot("START_UTC"), slot("END_UTC")
          if last < first or last - first > timedelta(days=14):
              raise ValueError("Coverage range must be nonempty and at most 14 days")
          PY

      - name: Checkout protected public code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select pinned private audit source
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability runtime_maintenance
          --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          path: private_source
          persist-credentials: false

      - name: Checkout runtime dataset
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
          path: private_data
          persist-credentials: false

      - name: Verify migration and report exact gaps without changes
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "${{ steps.release.outputs.private_code_sha }}"
          test "$(git -C private_data branch --show-current)" = "$DATA_BRANCH"
          test -s private_data/five_minute/partition_manifest.json || {
            echo "::error::Five-minute migration has not been verified; legacy Main remains authoritative."
            exit 1
          }
          script="private_source/Crypto Logger-Private Repo/five_minute_store.py"
          python "$script" audit --root private_data/five_minute \
            --start "$START_UTC" --end "$END_UTC" > "$RUNNER_TEMP/coverage.json"
          jq -r '[
            "## Manual five-minute coverage",
            "",
            "- State: " + .status,
            "- Expected coin-slots: " + (.expected_coin_slots | tostring),
            "- Missing coin-slots: " + (.missing_coin_slots | tostring),
            "- Slots with gaps: " + (.gap_slots | tostring),
            "- Unapplied receipts: " + (.pending_receipts | length | tostring),
            "- Source comparison: " + .source_comparison,
            "- Repair: " + .repair,
            "",
            "The full gap list is in the audit log. A clean receipt count is not an exchange verification."
          ] | .[]' "$RUNNER_TEMP/coverage.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/coverage.json"

      - name: Remove private checkout
        if: always()
        run: rm -rf private_source private_data "$RUNNER_TEMP/coverage.json"
