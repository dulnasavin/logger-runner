name: "Neon Maintenance"
run-name: "Neon Maintenance | ${{ inputs.operation }} | ${{ inputs.table_selection || 'archived-prices' }} | generation ${{ inputs.generation }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Preview/purge archived prices, or preview/clear selected logger tables after emptying prices."
        required: true
        default: preview
        type: choice
        options:
          - preview
          - purge-archived
          - continue-purge
          - preview-tables
          - clear-tables
      table_selection:
        description: "For table modes: choose a table, all logger tables, or custom. Dependent tables appear in preview."
        required: true
        default: archived-prices
        type: choice
        options:
          - archived-prices
          - all-logger-tables
          - custom
          - crypto_prices
          - price_batches
          - dataset_generations
          - neon_sync_state
          - neon_sync_log
          - neon_audit_log
          - neon_job_lock
          - neon_reconciliation_items
          - neon_reconciliation_outbox
      custom_tables:
        description: "Custom selection only: comma-separated logger table names. Neon Auth is excluded."
        required: false
        type: string
      writers_paused:
        description: "clear-tables only: I stopped Main/dispatcher and other database writers."
        required: false
        default: false
        type: boolean
      generation:
        description: "Archived-price modes only: exact archived generation. Leave blank for table modes."
        required: false
        type: string
      approved_plan_id:
        description: "Plan from preview: nmp-v1 for archived purge; ntm-v1 for table reset"
        required: false
        type: string
      continuation_token:
        description: "continue-purge only: saved token from the previous run or preview"
        required: false
        type: string
      confirmation:
        description: "PURGE_ARCHIVED_NEON_GENERATION, CONTINUE_NEON_PURGE, or CLEAR_SELECTED_NEON_TABLES"
        required: false
        type: string
      reason:
        description: "New purge only: non-sensitive single-line reason, 1-200 characters"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: neon-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  maintain:
    name: Maintain selected Neon data with intentional-deletion records
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require protected main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Start Neon Maintenance from branch main."
            exit 1
          }

      - name: Checkout protected release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate enabled Neon capability
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute --capability neon --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.release.outputs.private_repository }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          persist-credentials: false

      - name: Read runtime generation authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.release.outputs.private_repository }}
          ref: ${{ steps.release.outputs.private_data_branch }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_data
          persist-credentials: false

      - name: Verify source and runtime boundary
        env:
          SOURCE_CODE_SHA: ${{ steps.release.outputs.private_code_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "$SOURCE_CODE_SHA"
          test "$(git -C private_data branch --show-current)" = runtime-data
          test -s "private_source/Neon Weekly Audit/neon_maintenance.py" || {
            echo "::error::Pinned private release does not support Neon Maintenance. Update the release pin first."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r "private_source/Crypto Logger-Private Repo/requirements.lock"

      - name: Execute controlled archived-data maintenance
        env:
          OPERATION: ${{ inputs.operation }}
          TABLE_SELECTION: ${{ inputs.table_selection }}
          CUSTOM_TABLES: ${{ inputs.custom_tables }}
          WRITERS_PAUSED: ${{ inputs.writers_paused }}
          PRIVATE_DATA_TOKEN: ${{ inputs.operation == 'clear-tables' && (secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN) || (secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN) }}
          GIT_TERMINAL_PROMPT: "0"
          GENERATION: ${{ inputs.generation }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id }}
          CONTINUATION_TOKEN: ${{ inputs.continuation_token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CHANGE_REASON: ${{ inputs.reason }}
          SOURCE_CODE_SHA: ${{ steps.release.outputs.private_code_sha }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          selected_tables=""
          case "${TABLE_SELECTION:-archived-prices}" in
            archived-prices) ;;
            custom) selected_tables="${CUSTOM_TABLES:-}" ;;
            *) selected_tables="$TABLE_SELECTION" ;;
          esac
          extra_args=(--tables "$selected_tables")
          if test "${WRITERS_PAUSED:-false}" = true; then
            extra_args+=(--writers-paused)
          fi
          if test "$OPERATION" = preview-tables || test "$OPERATION" = clear-tables; then
            test -s "private_source/Neon Weekly Audit/neon_table_maintenance.py" || {
              echo "::error::Release pin must include selectable-table maintenance."
              exit 1
            }
            test -n "$PRIVATE_DATA_TOKEN"
            ASKPASS="${RUNNER_TEMP}/neon-table-git-askpass"
            printf '%s\n' '#!/bin/sh' \
              'case "$1" in' \
              '  *Username*) printf "%s\\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            export GIT_ASKPASS="$ASKPASS"
            trap 'rm -f "$ASKPASS"' EXIT
          fi
          python "private_source/Neon Weekly Audit/neon_maintenance.py" \
            --mode "$OPERATION" --generation "$GENERATION" \
            --runtime-repository private_data --plan-id "$APPROVED_PLAN_ID" \
            --continuation-token "$CONTINUATION_TOKEN" \
            --confirmation "$CONFIRMATION" --reason "$CHANGE_REASON" "${extra_args[@]}"

      - name: Clean up private checkouts
        if: always()
        run: rm -rf private_source private_data
