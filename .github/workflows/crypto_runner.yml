name: Crypto Price Logger
run-name: "🧪 STAGING | ${{ github.event_name }} | ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

# ============================================================================
# STAGING S1 NETWORK QUALIFICATION + VPN AUTH SELF-HEALING
# ============================================================================
# Architecture
#
# crypto_runner.yml
#   -> network_manager.py
#   -> vpn_auth_recovery/recovery_controller.py
#        -> vpnbook_credentials.py
#        -> github_secret_updater.py
#        -> alert_email.py
#   -> price_logger.py
#
# Rules
# - Stored VPN credentials are always tried first.
# - Only AUTH_FAILED triggers live VPNBook credential recovery.
# - Live credentials are fetched only from the official VPNBook page.
# - Recovered username/password are masked immediately.
# - Recovered credentials must pass the complete VPN1/VPN2 self-test.
# - GitHub secrets are refreshed only after successful VPN authentication.
# - Secret-update failure does not kill a recovered logger run; it triggers alert.
# - Recovery failure stops the workflow and triggers alert.
# - Alert recipient addresses are GitHub secrets, not hard-coded in YAML.
# - Provider-triggered VPN failover is still intentionally NOT wired in S1.
# - Production main and Neon remain untouched.
# ============================================================================

concurrency:
  group: crypto-price-logger-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================================
      # SECTION 01 - CHECKOUT + RUN INFORMATION
      # ======================================================================

      - name: Checkout runner repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🧪 CRYPTO PRICE LOGGER - STAGING S1"
          echo "============================================================"
          echo "UTC time:       $(date -u)"
          echo "Public branch:  ${GITHUB_REF_NAME}"
          echo "Public commit:  ${GITHUB_SHA}"
          echo "Workflow run:   ${GITHUB_RUN_NUMBER}"
          echo "Workflow run ID:${GITHUB_RUN_ID}"
          echo "============================================================"
          uname -a
          pwd
          df -h .

      # ======================================================================
      # SECTION 02 - PRIVATE REPOSITORY ACCESS
      # ======================================================================

      - name: Check private repository token
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$TOKEN" || {
            echo "❌ PRIVATE_REPO_TOKEN missing"
            exit 1
          }

          echo "✅ PRIVATE_REPO_TOKEN exists"

      - name: Clone matching private staging branch
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REPOSITORY_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          for attempt in 1 2 3
          do
            echo "Clone attempt ${attempt}/3"
            rm -rf private_logger

            if git clone \
              --branch "$TARGET_BRANCH" \
              --single-branch \
              "$REPOSITORY_URL" \
              private_logger
            then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Private repository clone failed"
              exit 1
            fi

            sleep 5
          done

          cd private_logger
          ACTUAL_BRANCH="$(git branch --show-current)"

          if [ "$ACTUAL_BRANCH" != "$TARGET_BRANCH" ]; then
            echo "❌ Wrong private branch checked out"
            echo "Expected: ${TARGET_BRANCH}"
            echo "Actual:   ${ACTUAL_BRANCH}"
            exit 1
          fi

          echo "✅ Matching private branch checked out"
          git log -1 --oneline
          git status --short

      # ======================================================================
      # SECTION 03 - PRIVATE FILE STRUCTURE
      # ======================================================================

      - name: Validate private repository structure
        run: |
          set -euo pipefail

          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="${LOGGER_DIR}/vpn_auth_recovery"

          for required in \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/requirements.txt" \
            "$RECOVERY_DIR/__init__.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"
          do
            test -s "$required" || {
              echo "❌ Missing or empty: $required"
              exit 1
            }
          done

          test -f private_logger/price_log.csv || {
            echo "❌ price_log.csv missing"
            exit 1
          }

          echo "✅ Private staging structure is valid"
          echo ""
          echo "Logger files:"
          find "$LOGGER_DIR" -maxdepth 1 -type f | sort
          echo ""
          echo "VPN auth recovery module:"
          find "$RECOVERY_DIR" -maxdepth 1 -type f | sort

      # ======================================================================
      # SECTION 04 - PYTHON + DEPENDENCIES
      # ======================================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          set -euo pipefail

          cd private_logger/"Crypto Logger-Private Repo"
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="${LOGGER_DIR}/vpn_auth_recovery"

          python -m py_compile \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"

          echo "✅ All staging Python files compile successfully"

      # ======================================================================
      # SECTION 05 - CORE SECRETS
      # ======================================================================

      - name: Check required core secrets
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          VPN1_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail

          check_secret() {
            local name="$1"
            local value="$2"

            test -n "$value" || {
              echo "❌ ${name} missing"
              exit 1
            }

            echo "✅ ${name} exists"
          }

          check_secret "BINANCE_API_KEY" "$BINANCE_API_KEY"
          check_secret "BINANCE_SECRET_KEY" "$BINANCE_SECRET_KEY"
          check_secret "VPNBOOK_CONFIG / VPN1_CONFIG" "$VPN1_CONFIG"
          check_secret "VPNBOOK_USERNAME / VPN1_USERNAME" "$VPN1_USERNAME"
          check_secret "VPNBOOK_PASSWORD / VPN1_PASSWORD" "$VPN1_PASSWORD"
          check_secret "VPN2_CONFIG" "$VPN2_CONFIG"
          check_secret "VPN2_USERNAME" "$VPN2_USERNAME"
          check_secret "VPN2_PASSWORD" "$VPN2_PASSWORD"

      # ======================================================================
      # SECTION 06 - OPTIONAL SELF-HEALING + PRIVATE ALERT SECRETS
      # ======================================================================

      - name: Check self-healing and alert configuration
        env:
          SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
          SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_TO_2: ${{ secrets.ALERT_EMAIL_TO_2 }}
        run: |
          set -euo pipefail

          if [ -n "$SECRET_UPDATE_TOKEN" ]; then
            echo "✅ VPN secret persistence token configured"
          else
            echo "⚠ VPN_SECRET_UPDATE_TOKEN missing"
            echo "   Runtime auth recovery can still work, but refreshed credentials cannot be persisted."
          fi

          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "✅ SMTP alert authentication configured"
          else
            echo "⚠ SMTP alert authentication incomplete"
          fi

          if [ -n "$ALERT_EMAIL_TO" ]; then
            echo "✅ Primary alert recipient configured as a secret"
          else
            echo "⚠ ALERT_EMAIL_TO missing"
          fi

          if [ -n "$ALERT_EMAIL_TO_2" ]; then
            echo "✅ Secondary alert recipient configured as a secret"
          else
            echo "⚠ ALERT_EMAIL_TO_2 missing"
          fi

      # ======================================================================
      # SECTION 07 - OPENVPN INSTALLATION
      # ======================================================================

      - name: Install OpenVPN
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version | head -n 1
          sudo -n true

          echo "✅ OpenVPN and passwordless sudo available"

      # ======================================================================
      # SECTION 08 - SECURE VPN RUNTIME FILES
      # ======================================================================

      - name: Create VPN1 and VPN2 runtime files
        env:
          VPN1_CONFIG_SECRET: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG_SECRET: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s\n' "$VPN1_CONFIG_SECRET" > vpn1.ovpn
          printf '%s\n%s\n' "$VPN1_USERNAME" "$VPN1_PASSWORD" > vpn1-auth.txt

          printf '%s\n' "$VPN2_CONFIG_SECRET" > vpn2.ovpn
          printf '%s\n%s\n' "$VPN2_USERNAME" "$VPN2_PASSWORD" > vpn2-auth.txt

          chmod 600 vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt

          test -s vpn1.ovpn
          test -s vpn1-auth.txt
          test -s vpn2.ovpn
          test -s vpn2-auth.txt

          echo "✅ Protected VPN runtime files created"

      # ======================================================================
      # SECTION 09 - NETWORK MANAGER STATIC VALIDATION
      # ======================================================================

      - name: Reset S1 network state
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail

          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          python "$MANAGER" reset

          echo "✅ Network state reset"

      - name: Validate complete S1 network configuration
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail

          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"

          python "$MANAGER" validate-all
          python "$MANAGER" policy --error-type RATE_LIMIT
          python "$MANAGER" policy --error-type NETWORK_ERROR
          python "$MANAGER" policy --error-type SERVER_ERROR
          python "$MANAGER" policy --error-type AUTH_ERROR

          echo "✅ S1 configuration and policy map validated"

      # ======================================================================
      # SECTION 10 - VPN AUTH RECOVERY CONTROLLER
      # ======================================================================
      # The controller performs:
      # 1. Stored credential S1 self-test.
      # 2. AUTH_FAILED detection only.
      # 3. Official VPNBook credential fetch.
      # 4. Immediate log masking.
      # 5. One complete S1 retry.
      # 6. Secret persistence only after successful authentication.
      # ======================================================================

      - name: Run VPN1/VPN2 self-test with auth self-healing
        id: vpn_auth
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          CONTROLLER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/recovery_controller.py"

          python "$CONTROLLER" \
            --state-dir "${RUNNER_TEMP}/network-manager" \
            --vpn1-config "${GITHUB_WORKSPACE}/vpn1.ovpn" \
            --vpn1-auth "${GITHUB_WORKSPACE}/vpn1-auth.txt" \
            --vpn2-config "${GITHUB_WORKSPACE}/vpn2.ovpn" \
            --vpn2-auth "${GITHUB_WORKSPACE}/vpn2-auth.txt" \
            --self-test-output "${RUNNER_TEMP}/s1-self-test.json" \
            --recovered-marker "${RUNNER_TEMP}/vpn-auth-recovered" \
            --recovery-failed-marker "${RUNNER_TEMP}/vpn-auth-recovery-failed" \
            --secret-update-success-marker "${RUNNER_TEMP}/vpn-secret-update-success" \
            --secret-update-failed-marker "${RUNNER_TEMP}/vpn-secret-update-failed" \
            --repository "$GITHUB_REPOSITORY" \
            --persist-secrets \
            --update-vpn2-secrets

          test -s "${RUNNER_TEMP}/s1-self-test.json"
          grep -q '"passed": true' "${RUNNER_TEMP}/s1-self-test.json"
          grep -q '"different_public_ips": true' "${RUNNER_TEMP}/s1-self-test.json"

          echo "✅ Complete S1 VPN qualification passed"

      # ======================================================================
      # SECTION 11 - CLEAN VPN1 SESSION FOR LOGGER
      # ======================================================================

      - name: Reconnect clean VPN1 for collection
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail

          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          STATUS_FILE="${RUNNER_TEMP}/network-manager-status.json"

          python "$MANAGER" reset
          python "$MANAGER" connect --network VPN1
          python "$MANAGER" status | tee "$STATUS_FILE"

          grep -q '"active_network": "VPN1"' "$STATUS_FILE"
          grep -q '"running": true' "$STATUS_FILE"
          grep -q '"switch_count": 0' "$STATUS_FILE"

          echo "✅ Clean VPN1 session ready for logger"

      # ======================================================================
      # SECTION 12 - PROVIDER CONNECTIVITY PROBES
      # ======================================================================

      - name: Test CoinGecko connectivity on VPN1
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${RUNNER_TEMP}/coingecko-probe.txt" \
              --write-out "%{http_code}" \
              https://api.coingecko.com/api/v3/ping
          )"

          echo "CoinGecko HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
          echo "✅ CoinGecko probe passed"

      - name: Test Binance connectivity on VPN1
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${RUNNER_TEMP}/binance-probe.txt" \
              --write-out "%{http_code}" \
              https://api.binance.com/api/v3/time
          )"

          echo "Binance HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
          echo "✅ Binance probe passed"

      # ======================================================================
      # SECTION 13 - LOGGER FILE INFORMATION
      # ======================================================================

      - name: Show logger module information
        run: |
          set -euo pipefail

          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="${LOGGER_DIR}/vpn_auth_recovery"

          echo "Core logger files:"
          ls -lh "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"
          wc -l "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"
          sha256sum "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"

          echo ""
          echo "VPN auth recovery files:"
          ls -lh "$RECOVERY_DIR"/*.py
          wc -l "$RECOVERY_DIR"/*.py
          sha256sum "$RECOVERY_DIR"/*.py

      # ======================================================================
      # SECTION 14 - CSV STATE BEFORE LOGGER
      # ======================================================================

      - name: Record CSV state before logger
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(wc -l < "$CSV" | tr -d ' ')"

          echo "$BEFORE_ROWS" > "${RUNNER_TEMP}/csv_rows_before.txt"
          echo "CSV rows before logger: $BEFORE_ROWS"

      # ======================================================================
      # SECTION 15 - RUN PRICE LOGGER
      # ======================================================================

      - name: Run crypto price logger
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          cd private_logger/"Crypto Logger-Private Repo"

          echo "============================================================"
          echo "🧪 STARTING STAGING CRYPTO PRICE LOGGER"
          echo "UTC time: $(date -u)"
          echo "============================================================"

          python price_logger.py

          echo "============================================================"
          echo "✅ STAGING CRYPTO PRICE LOGGER COMPLETED"
          echo "UTC time: $(date -u)"
          echo "============================================================"

      # ======================================================================
      # SECTION 16 - DISCONNECT VPN BEFORE GITHUB/GIT
      # ======================================================================

      - name: Disconnect VPN before GitHub operations
        if: always()
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set +e

          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"

          if [ -f "$MANAGER" ]; then
            python "$MANAGER" reset
          fi

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "Applying final emergency OpenVPN cleanup"
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "❌ OpenVPN still running"
            sudo pgrep -a openvpn || true
            exit 1
          fi

          echo "✅ VPN disconnected before Git/GitHub traffic"

      # ======================================================================
      # SECTION 17 - CSV VALIDATION
      # ======================================================================

      - name: Check generated CSV
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"

          test -s "$CSV" || {
            echo "❌ price_log.csv missing or empty"
            exit 1
          }

          ls -lh "$CSV"
          wc -l "$CSV"
          head -n 1 "$CSV"
          tail -n 12 "$CSV"

      - name: Validate CSV header
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"
          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"
          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"

          if [ "$ACTUAL_HEADER" != "$EXPECTED_HEADER" ]; then
            echo "❌ CSV header is incorrect"
            echo "Expected: $EXPECTED_HEADER"
            echo "Actual:   $ACTUAL_HEADER"
            exit 1
          fi

          echo "✅ CSV header is correct"

      - name: Validate CSV row count
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(cat "${RUNNER_TEMP}/csv_rows_before.txt")"
          AFTER_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          ADDED_ROWS="$((AFTER_ROWS - BEFORE_ROWS))"

          echo "CSV rows before: $BEFORE_ROWS"
          echo "CSV rows after:  $AFTER_ROWS"
          echo "Rows added:      $ADDED_ROWS"

          if [ "$ADDED_ROWS" -le 0 ]; then
            echo "❌ Logger produced no new CSV rows"
            exit 1
          fi

          echo "✅ CSV contains new staging data"

      - name: Create CSV safety backup
        run: |
          set -euo pipefail

          cp -- private_logger/price_log.csv "${RUNNER_TEMP}/price_log.csv"
          test -s "${RUNNER_TEMP}/price_log.csv"

          echo "✅ CSV safety backup created"

      # ======================================================================
      # SECTION 18 - SAVE CSV TO PRIVATE STAGING
      # ======================================================================

      - name: Save CSV to private staging branch
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          cd private_logger

          CSV="price_log.csv"
          BACKUP_CSV="${RUNNER_TEMP}/price_log.csv"
          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          git config user.name "github-actions-staging"
          git config user.email "actions@github.com"
          git add -- price_log.csv

          if git diff --cached --quiet; then
            echo "❌ No CSV change detected"
            exit 1
          fi

          git diff --cached --stat
          git commit -m "STAGING test price log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          for attempt in 1 2 3
          do
            echo "Git synchronisation attempt ${attempt}/3"
            git fetch origin "$TARGET_BRANCH"

            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              cp -- "$BACKUP_CSV" "$CSV"
              echo "❌ Rebase conflict"
              exit 1
            fi

            if git push "$REMOTE_URL" "HEAD:${TARGET_BRANCH}"; then
              echo "✅ CSV pushed successfully"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "❌ CSV push failed after 3 attempts"
          exit 1

      - name: Verify private staging push
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          cd private_logger

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote "$REMOTE_URL" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"

          echo "Local SHA:  $LOCAL_SHA"
          echo "Remote SHA: $REMOTE_SHA"

          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"

          echo "✅ Remote staging push verified"

      # ======================================================================
      # SECTION 19 - HIGH-PRIORITY PRIVATE EMAIL ALERT
      # ======================================================================
      # Recipients are deliberately stored as GitHub secrets:
      # ALERT_EMAIL_TO
      # ALERT_EMAIL_TO_2
      # ======================================================================

      - name: Send standout VPN auth recovery alert
        if: always()
        continue-on-error: true
        env:
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_TO_2: ${{ secrets.ALERT_EMAIL_TO_2 }}
        run: |
          set +e

          ALERT="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          [ -f "$ALERT" ] || exit 0

          NEED_ALERT="false"
          ALERT_TYPE=""

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ]; then
            NEED_ALERT="true"
            ALERT_TYPE="VPN AUTH RECOVERY FAILED"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            NEED_ALERT="true"
            ALERT_TYPE="VPN CREDENTIALS RECOVERED BUT SECRET REFRESH FAILED"
          fi

          if [ "$NEED_ALERT" != "true" ]; then
            echo "No VPN credential alert required"
            exit 0
          fi

          if [ -z "$ALERT_SMTP_USERNAME" ] || \
             [ -z "$ALERT_SMTP_PASSWORD" ] || \
             [ -z "$ALERT_EMAIL_TO" ]; then
            echo "⚠ Private alert configuration incomplete; custom email not sent"
            exit 0
          fi

          SUBJECT="🚨 CRYPTO LOGGER | ${ALERT_TYPE} | STAGING | Run #${GITHUB_RUN_NUMBER}"

          BODY="CRITICAL CRYPTO LOGGER NETWORK ALERT

Environment: STAGING
Repository: ${GITHUB_REPOSITORY}
Branch: ${GITHUB_REF_NAME}
Workflow run: #${GITHUB_RUN_NUMBER}
Run ID: ${GITHUB_RUN_ID}
UTC time: $(date -u)

WHAT HAPPENED
The stored VPNBook credentials were rejected, or proven recovered credentials could not be persisted safely.

AUTOMATIC RECOVERY PATH
1. Stored VPN credentials were attempted first.
2. AUTH_FAILED was classified separately from network/server failures.
3. Current credentials were requested from the official VPNBook OpenVPN page.
4. Retrieved username/password were masked in GitHub logs.
5. VPN1 and VPN2 were re-tested exactly once.
6. GitHub secret refresh was attempted only after successful authentication.

SECURITY
No VPN password or email recipient address is included in this message body, workflow summary, or debug diagnostics.

ACTION
Review this staging run and its debug artifact:
https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

This is a dedicated Crypto Logger recovery alert and is separate from generic GitHub workflow-failure notifications."

          python "$ALERT" --subject "$SUBJECT" --body "$BODY"

      # ======================================================================
      # SECTION 20 - SUCCESS SUMMARY
      # ======================================================================

      - name: Create logger summary
        if: success()
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"
          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          DATA_ROWS="$((CSV_ROWS - 1))"
          LATEST_TIMESTAMP="$(tail -n 1 "$CSV" | cut -d',' -f1)"

          AUTH_RECOVERY="Not needed"
          SECRET_REFRESH="Not needed"

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            AUTH_RECOVERY="Used successfully"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            SECRET_REFRESH="Updated successfully"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            SECRET_REFRESH="Failed - private alert requested"
          fi

          {
            echo "## 🧪 Crypto Price Logger - STAGING S1"
            echo ""
            echo "### Network qualification"
            echo "- **S1 network manager:** Passed"
            echo "- **VPN1 live connection:** Passed"
            echo "- **VPN2 live connection:** Passed"
            echo "- **Different VPN public IPs:** Passed"
            echo ""
            echo "### Authentication recovery"
            echo "- **VPNBook auth recovery:** ${AUTH_RECOVERY}"
            echo "- **GitHub VPN secret refresh:** ${SECRET_REFRESH}"
            echo ""
            echo "### Logger"
            echo "- **Collection network:** VPN1"
            echo "- **Provider-triggered VPN2 switching:** Not enabled yet"
            echo "- **Maximum future VPN switches per run:** 1"
            echo "- **CSV total rows:** ${CSV_ROWS}"
            echo "- **CSV data rows:** ${DATA_ROWS}"
            echo "- **Latest timestamp:** ${LATEST_TIMESTAMP}"
            echo ""
            echo "### Safety"
            echo "- **VPN disconnected before Git/GitHub traffic:** Yes"
            echo "- **Production main:** Untouched"
            echo "- **Neon writes:** Disabled"
            echo "- **Completed UTC:** $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ Detailed staging summary created"

      # ======================================================================
      # SECTION 21 - FAILURE DIAGNOSTICS
      # ======================================================================

      - name: Prepare debug files if failed
        if: failure()
        run: |
          set +e

          mkdir -p debug

          [ -f private_logger/price_log.csv ] && cp private_logger/price_log.csv debug/price_log.csv
          [ -f "${RUNNER_TEMP}/coingecko-probe.txt" ] && cp "${RUNNER_TEMP}/coingecko-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/binance-probe.txt" ] && cp "${RUNNER_TEMP}/binance-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/network-manager-status.json" ] && cp "${RUNNER_TEMP}/network-manager-status.json" debug/
          [ -f "${RUNNER_TEMP}/s1-self-test.json" ] && cp "${RUNNER_TEMP}/s1-self-test.json" debug/

          if [ -d "${RUNNER_TEMP}/network-manager" ]; then
            cp -R "${RUNNER_TEMP}/network-manager" debug/network-manager-state 2>/dev/null || true
          fi

          {
            echo "UTC time: $(date -u)"
            echo "Public branch: ${GITHUB_REF_NAME}"
            echo ""
            echo "Recovery markers:"
            echo "auth_recovered=$([ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && echo yes || echo no)"
            echo "auth_recovery_failed=$([ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo yes || echo no)"
            echo "secret_update_success=$([ -f "${RUNNER_TEMP}/vpn-secret-update-success" ] && echo yes || echo no)"
            echo "secret_update_failed=$([ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo yes || echo no)"
            echo ""
            echo "OpenVPN processes:"
            sudo pgrep -a openvpn || true
            echo ""
            echo "Network interfaces:"
            ip addr show || true
            echo ""
            echo "IPv4 routes:"
            ip route show || true
            echo ""
            echo "DNS status:"
            resolvectl status 2>/dev/null || cat /etc/resolv.conf || true
          } > debug/network-diagnostics.txt

          sudo chown -R "$(id -u):$(id -g)" debug
          chmod -R u+rwX,go+rX debug

          find debug -maxdepth 3 -type f -ls || true

      - name: Upload debug files if failed
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: staging-crypto-price-logger-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # ======================================================================
      # SECTION 22 - FINAL RUNNER CLEANUP
      # ======================================================================

      - name: Cleanup runner
        if: always()
        run: |
          set +e

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

          rm -rf private_logger
          sudo rm -rf debug
          rm -rf "${RUNNER_TEMP}/network-manager"

          sudo rm -f vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt

          echo "✅ Runner cleaned"
