name: Crypto Price Logger
run-name: "🚀 PRODUCTION S1 | ${{ github.event_name }} | ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# ============================================================================
# CRYPTO PRICE LOGGER - PRODUCTION S1
# NETWORK QUALIFICATION + VPNBOOK AUTHENTICATION SELF-HEALING
# ============================================================================
# Production rules:
# - Public main reads/writes private main.
# - Production price_log.csv stays on private main and is never replaced by
#   staging CSV history.
# - Stored VPN credentials are attempted first.
# - Only AUTH_FAILED triggers live VPNBook credential recovery.
# - Live credentials are fetched only from the official VPNBook OpenVPN page.
# - Retrieved credentials are masked before reuse.
# - Recovery receives exactly one complete VPN1/VPN2 retry.
# - VPN1 and VPN2 must prove different public exit IPs.
# - GitHub Actions secrets are updated only after recovered credentials prove
#   valid through the complete VPN test.
# - Secret-update failure does not kill an already recovered price-logger run.
# - Recovery failure stops the workflow and may send a private email alert.
# - Provider-triggered VPN switching is NOT wired yet in S1.
# - Neon writes remain disabled at this stage.
# ============================================================================

concurrency:
  group: crypto-price-logger-production
  cancel-in-progress: false

jobs:
  run-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================================
      # SECTION 01 - CHECK OUT THE PUBLIC PRODUCTION RUNNER
      # ======================================================================
      - name: "01.1 Checkout public production runner"
        uses: actions/checkout@v6

      # ======================================================================
      # SECTION 02 - IDENTIFY THIS EXACT PRODUCTION RUN
      # ======================================================================
      - name: "02.1 Display production run identity"
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🚀 CRYPTO PRICE LOGGER - PRODUCTION S1"
          echo "============================================================"
          echo "UTC time:        $(date -u)"
          echo "Repository:      ${GITHUB_REPOSITORY}"
          echo "Public branch:   ${GITHUB_REF_NAME}"
          echo "Public commit:   ${GITHUB_SHA}"
          echo "Workflow:        ${GITHUB_WORKFLOW}"
          echo "Run number:      ${GITHUB_RUN_NUMBER}"
          echo "Run ID:          ${GITHUB_RUN_ID}"
          echo "Run attempt:     ${GITHUB_RUN_ATTEMPT}"
          echo "Runner OS:       ${RUNNER_OS}"
          echo "============================================================"

      # ======================================================================
      # SECTION 03 - VALIDATE PRIVATE REPOSITORY ACCESS
      # ======================================================================
      - name: "03.1 Validate PRIVATE_REPO_TOKEN"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || { echo "❌ PRIVATE_REPO_TOKEN missing"; exit 1; }
          echo "✅ PRIVATE_REPO_TOKEN configured"

      # ======================================================================
      # SECTION 04 - CLONE PRIVATE MAIN
      # ======================================================================
      - name: "04.1 Clone private production main branch"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="main"
          REPOSITORY_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          for attempt in 1 2 3; do
            echo "Private clone attempt ${attempt}/3"
            rm -rf private_logger
            if git clone --branch "$TARGET_BRANCH" --single-branch "$REPOSITORY_URL" private_logger; then
              echo "✅ Private production repository cloned"
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ Private repository clone failed"; exit 1; }
            sleep 5
          done

      - name: "04.2 Verify private main branch alignment"
        run: |
          set -euo pipefail
          cd private_logger
          ACTUAL_BRANCH="$(git branch --show-current)"
          test "$ACTUAL_BRANCH" = "main" || { echo "❌ Expected private main, got ${ACTUAL_BRANCH}"; exit 1; }
          git log -1 --oneline
          echo "✅ Private production branch is main"

      # ======================================================================
      # SECTION 05 - VERIFY PRODUCTION LOGGER FILE STRUCTURE
      # ======================================================================
      - name: "05.1 Validate core production logger files"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          for required in \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/requirements.txt"; do
            test -s "$required" || { echo "❌ Missing or empty: $required"; exit 1; }
          done
          test -s private_logger/price_log.csv || { echo "❌ Production price_log.csv missing or empty"; exit 1; }
          echo "✅ Core production files validated"

      - name: "05.2 Validate VPN auth recovery helper files"
        run: |
          set -euo pipefail
          RECOVERY_DIR="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery"
          for required in \
            "$RECOVERY_DIR/__init__.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"; do
            test -s "$required" || { echo "❌ Missing or empty recovery file: $required"; exit 1; }
          done
          echo "✅ VPN auth recovery package validated"

      # ======================================================================
      # SECTION 06 - SET UP PYTHON
      # ======================================================================
      - name: "06.1 Setup Python 3.13"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ======================================================================
      # SECTION 07 - INSTALL AND VERIFY DEPENDENCIES
      # ======================================================================
      - name: "07.1 Install production logger dependencies"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          echo "✅ Python dependencies installed and verified"

      # ======================================================================
      # SECTION 08 - COMPILE ALL PYTHON MODULES
      # ======================================================================
      - name: "08.1 Compile production Python modules"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="$LOGGER_DIR/vpn_auth_recovery"
          python -m py_compile \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"
          echo "✅ All production Python modules compile"

      # ======================================================================
      # SECTION 09 - VALIDATE BINANCE SECRETS
      # ======================================================================
      - name: "09.1 Validate Binance API secrets"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo "❌ BINANCE_API_KEY missing"; exit 1; }
          test -n "$BINANCE_SECRET_KEY" || { echo "❌ BINANCE_SECRET_KEY missing"; exit 1; }
          echo "✅ Binance API secrets configured"

      # ======================================================================
      # SECTION 10 - VALIDATE VPN1 SECRETS
      # ======================================================================
      - name: "10.1 Validate VPN1 production secrets"
        env:
          VPN1_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN1_CONFIG" || { echo "❌ VPNBOOK_CONFIG missing"; exit 1; }
          test -n "$VPN1_USERNAME" || { echo "❌ VPNBOOK_USERNAME missing"; exit 1; }
          test -n "$VPN1_PASSWORD" || { echo "❌ VPNBOOK_PASSWORD missing"; exit 1; }
          echo "✅ VPN1 production secrets configured"

      # ======================================================================
      # SECTION 11 - VALIDATE VPN2 SECRETS
      # ======================================================================
      - name: "11.1 Validate VPN2 production secrets"
        env:
          VPN2_CONFIG: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN2_CONFIG" || { echo "❌ VPN2_CONFIG missing"; exit 1; }
          test -n "$VPN2_USERNAME" || { echo "❌ VPN2_USERNAME missing"; exit 1; }
          test -n "$VPN2_PASSWORD" || { echo "❌ VPN2_PASSWORD missing"; exit 1; }
          echo "✅ VPN2 production secrets configured"

      # ======================================================================
      # SECTION 12 - CHECK OPTIONAL VPN SECRET UPDATE TOKEN
      # ======================================================================
      - name: "12.1 Check VPN_SECRET_UPDATE_TOKEN"
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$VPN_SECRET_UPDATE_TOKEN" ]; then
            echo "✅ Automatic GitHub VPN secret update enabled"
          else
            echo "⚠ VPN_SECRET_UPDATE_TOKEN missing; runtime recovery can work but cannot persist refreshed credentials"
          fi

      # ======================================================================
      # SECTION 13 - CHECK AUTHENTICATED MAKE/OUTLOOK ALERT SECRETS
      # ======================================================================
      - name: "13.1 Check Make webhook alert secrets"
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$ALERT_MAKE_WEBHOOK_URL" ] && [ -n "$ALERT_MAKE_API_KEY" ]; then
            echo "✅ Authenticated Make/Outlook alert delivery configured"
          else
            echo "⚠ Make/Outlook alert secrets incomplete; GitHub Issue fallback will protect required alerts"
          fi

      # ======================================================================
      # SECTION 14 - INSTALL OPENVPN
      # ======================================================================
      - name: "14.1 Install and verify OpenVPN"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version | head -n 1
          sudo -n true
          echo "✅ OpenVPN ready"

      # ======================================================================
      # SECTION 15 - CREATE PROTECTED VPN RUNTIME FILES
      # ======================================================================
      - name: "15.1 Create protected VPN1/VPN2 runtime files"
        env:
          VPN1_CONFIG_SECRET: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG_SECRET: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPN1_CONFIG_SECRET" > vpn1.ovpn
          printf '%s\n%s\n' "$VPN1_USERNAME" "$VPN1_PASSWORD" > vpn1-auth.txt
          printf '%s\n' "$VPN2_CONFIG_SECRET" > vpn2.ovpn
          printf '%s\n%s\n' "$VPN2_USERNAME" "$VPN2_PASSWORD" > vpn2-auth.txt
          chmod 600 vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt
          test -s vpn1.ovpn && test -s vpn1-auth.txt && test -s vpn2.ovpn && test -s vpn2-auth.txt
          echo "✅ Protected VPN runtime files created"

      # ======================================================================
      # SECTION 16 - RESET AND VALIDATE NETWORK MANAGER
      # ======================================================================
      - name: "16.1 Reset network manager state"
        env: &network_env
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" reset

      - name: "16.2 Validate both VPN profiles"
        env: *network_env
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" validate-all
          echo "✅ Network manager and both VPN profiles validated"

      # ======================================================================
      # SECTION 17 - VERIFY NETWORK POLICY MAP
      # ======================================================================
      - name: "17.1 Verify S1 network policy classifications"
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          python "$MANAGER" policy --error-type RATE_LIMIT
          python "$MANAGER" policy --error-type NETWORK_ERROR
          python "$MANAGER" policy --error-type SERVER_ERROR
          python "$MANAGER" policy --error-type AUTH_ERROR
          echo "✅ S1 network policy map validated"

      # ======================================================================
      # SECTION 18 - RUN AUTH SELF-HEALING + FULL VPN QUALIFICATION
      # ======================================================================
      - name: "18.1 Run stored-auth test and automatic VPNBook recovery"
        id: vpn_auth_recovery
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          CONTROLLER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/recovery_controller.py"
          python "$CONTROLLER" \
            --state-dir "${RUNNER_TEMP}/network-manager" \
            --vpn1-config "${GITHUB_WORKSPACE}/vpn1.ovpn" \
            --vpn1-auth "${GITHUB_WORKSPACE}/vpn1-auth.txt" \
            --vpn2-config "${GITHUB_WORKSPACE}/vpn2.ovpn" \
            --vpn2-auth "${GITHUB_WORKSPACE}/vpn2-auth.txt" \
            --self-test-output "${RUNNER_TEMP}/s1-self-test.json" \
            --recovered-marker "${RUNNER_TEMP}/vpn-auth-recovered" \
            --recovery-failed-marker "${RUNNER_TEMP}/vpn-auth-recovery-failed" \
            --secret-update-success-marker "${RUNNER_TEMP}/vpn-secret-update-success" \
            --secret-update-failed-marker "${RUNNER_TEMP}/vpn-secret-update-failed" \
            --repository "$GITHUB_REPOSITORY" \
            --persist-secrets \
            --update-vpn2-secrets

      # ======================================================================
      # SECTION 19 - VERIFY VPN1/VPN2 SELF-TEST RESULTS
      # ======================================================================
      - name: "19.1 Verify S1 qualification result"
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/s1-self-test.json"
          cat "${RUNNER_TEMP}/s1-self-test.json"
          grep -q '"passed": true' "${RUNNER_TEMP}/s1-self-test.json"
          grep -q '"different_public_ips": true' "${RUNNER_TEMP}/s1-self-test.json"
          echo "✅ VPN1 and VPN2 passed with different public IPs"

      # ======================================================================
      # SECTION 20 - REPORT AUTH RECOVERY / SECRET UPDATE OUTCOME
      # ======================================================================
      - name: "20.1 Report VPN credential recovery state"
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            echo "⚠ Stored credentials expired; live VPNBook recovery succeeded"
          else
            echo "✅ Stored VPN credentials remained valid"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            echo "✅ GitHub VPN secrets updated"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            echo "⚠ GitHub VPN secret update failed; current run may continue"
          else
            echo "ℹ GitHub VPN secret update was not required"
          fi

      # ======================================================================
      # SECTION 21 - ESTABLISH FRESH VPN1 PRODUCTION COLLECTION SESSION
      # ======================================================================
      - name: "21.1 Reset after S1 qualification"
        env: *network_env
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" reset

      - name: "21.2 Connect fresh VPN1 production session"
        env: *network_env
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" connect --network VPN1

      - name: "21.3 Verify VPN1 production session"
        env: *network_env
        run: |
          set -euo pipefail
          STATUS_FILE="${RUNNER_TEMP}/network-manager-status.json"
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" status | tee "$STATUS_FILE"
          grep -q '"active_network": "VPN1"' "$STATUS_FILE"
          grep -q '"running": true' "$STATUS_FILE"
          grep -q '"switch_count": 0' "$STATUS_FILE"
          echo "✅ Fresh VPN1 production session verified"

      # ======================================================================
      # SECTION 22 - PROVIDER CONNECTIVITY PROBES
      # ======================================================================
      - name: "22.1 Test CoinGecko through VPN1"
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 --output "${RUNNER_TEMP}/coingecko-probe.txt" --write-out "%{http_code}" https://api.coingecko.com/api/v3/ping)"
          echo "CoinGecko HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"

      - name: "22.2 Test Binance through VPN1"
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 --output "${RUNNER_TEMP}/binance-probe.txt" --write-out "%{http_code}" https://api.binance.com/api/v3/time)"
          echo "Binance HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"

      # ======================================================================
      # SECTION 23 - RECORD PRODUCTION CSV STATE BEFORE LOGGER
      # ======================================================================
      - name: "23.1 Record production CSV row count"
        run: |
          set -euo pipefail
          BEFORE_ROWS="$(wc -l < private_logger/price_log.csv | tr -d ' ')"
          echo "$BEFORE_ROWS" > "${RUNNER_TEMP}/csv_rows_before.txt"
          echo "Production CSV rows before logger: ${BEFORE_ROWS}"

      # ======================================================================
      # SECTION 24 - RUN THE PRODUCTION PRICE LOGGER
      # ======================================================================
      - name: "24.1 Run price_logger.py on verified VPN1"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          echo "============================================================"
          echo "🚀 STARTING PRODUCTION CRYPTO PRICE LOGGER"
          echo "UTC time: $(date -u)"
          echo "============================================================"
          python price_logger.py
          echo "✅ PRODUCTION CRYPTO PRICE LOGGER COMPLETED"

      # ======================================================================
      # SECTION 25 - DISCONNECT VPN BEFORE GIT/GITHUB TRAFFIC
      # ======================================================================
      - name: "25.1 Disconnect managed VPN"
        if: always()
        env: *network_env
        run: |
          set +e
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          [ -f "$MANAGER" ] && python "$MANAGER" reset

      - name: "25.2 Verify OpenVPN fully stopped"
        if: always()
        run: |
          set +e
          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi
          sudo pgrep -x openvpn >/dev/null 2>&1 && { echo "❌ OpenVPN still running"; exit 1; }
          echo "✅ VPN disconnected before Git/GitHub traffic"

      # ======================================================================
      # SECTION 26 - VALIDATE PRODUCTION CSV OUTPUT
      # ======================================================================
      - name: "26.1 Validate production CSV schema and new rows"
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"
          test -s "$CSV"
          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"
          test "$ACTUAL_HEADER" = "$EXPECTED_HEADER" || { echo "❌ CSV header mismatch"; exit 1; }
          BEFORE_ROWS="$(cat "${RUNNER_TEMP}/csv_rows_before.txt")"
          AFTER_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          ADDED_ROWS="$((AFTER_ROWS - BEFORE_ROWS))"
          echo "Rows before: ${BEFORE_ROWS}"
          echo "Rows after:  ${AFTER_ROWS}"
          echo "Rows added:  ${ADDED_ROWS}"
          test "$ADDED_ROWS" -gt 0 || { echo "❌ Logger produced no new production CSV rows"; exit 1; }
          tail -n 12 "$CSV"
          echo "✅ Production CSV validated"

      # ======================================================================
      # SECTION 27 - CREATE CSV SAFETY BACKUP
      # ======================================================================
      - name: "27.1 Backup production CSV before Git operations"
        run: |
          set -euo pipefail
          cp -- private_logger/price_log.csv "${RUNNER_TEMP}/price_log.csv"
          test -s "${RUNNER_TEMP}/price_log.csv"

      # ======================================================================
      # SECTION 28 - COMMIT AND PUSH ONLY THE PRODUCTION CSV CHANGE
      # ======================================================================
      - name: "28.1 Commit production CSV locally"
        run: |
          set -euo pipefail
          cd private_logger
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- price_log.csv
          git diff --cached --quiet && { echo "❌ No production CSV change detected"; exit 1; }
          git commit -m "Update crypto price log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: "28.2 Rebase and push private main"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          REMOTE_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          cd private_logger
          for attempt in 1 2 3; do
            echo "Production Git sync attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              cp -- "${RUNNER_TEMP}/price_log.csv" price_log.csv
              echo "❌ Production rebase conflict"
              exit 1
            fi
            if git push "$REMOTE_URL" HEAD:main; then
              echo "✅ Production CSV pushed to private main"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "❌ Production CSV push failed"
          exit 1

      # ======================================================================
      # SECTION 29 - VERIFY PRIVATE MAIN PUSH
      # ======================================================================
      - name: "29.1 Verify remote private main SHA"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          REMOTE_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          cd private_logger
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote "$REMOTE_URL" refs/heads/main | awk '{print $1}')"
          echo "Local SHA:  ${LOCAL_SHA}"
          echo "Remote SHA: ${REMOTE_SHA}"
          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "✅ Private main push verified"

      # ======================================================================
      # SECTION 30 - CLASSIFY PRODUCTION ALERT CONDITION
      # ======================================================================
      - name: "30.1 Determine whether human attention is required"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          rm -f "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo "VPN_AUTH_RECOVERY_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ ! -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] && [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo "VPN_SECRET_UPDATE_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ ! -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] && [ "$JOB_STATUS" = "failure" ] && echo "PRODUCTION_WORKFLOW_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] \
            && echo "⚠ Production alert required: $(cat "${RUNNER_TEMP}/vpn-alert-type.txt")" \
            || echo "✅ No production alert required"

      # ======================================================================
      # SECTION 31 - SEND PRIVATE HIGH-PRIORITY ALERT THROUGH MAKE/OUTLOOK
      # ======================================================================
      - name: "31.1 Send production VPN recovery alert"
        id: send_make_alert
        if: always()
        continue-on-error: true
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
          ALERT_CHATGPT_CHAT_URL: ${{ secrets.ALERT_CHATGPT_CHAT_URL }}
          CRYPTO_LOGGER_ENVIRONMENT: PRODUCTION
        run: |
          set -euo pipefail
          ALERT_FILE="${RUNNER_TEMP}/vpn-alert-type.txt"
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          if [ ! -f "$ALERT_FILE" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No production VPN recovery alert required"
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"
          test -s "$NOTIFIER" || { echo "❌ alert_email.py unavailable"; exit 1; }
          test -n "$ALERT_MAKE_WEBHOOK_URL" || { echo "❌ ALERT_MAKE_WEBHOOK_URL missing"; exit 1; }
          test -n "$ALERT_MAKE_API_KEY" || { echo "❌ ALERT_MAKE_API_KEY missing"; exit 1; }
          ALERT_TYPE="$(cat "$ALERT_FILE")"
          echo "alert_type=$ALERT_TYPE" >> "$GITHUB_OUTPUT"
          python "$NOTIFIER" --alert-type "$ALERT_TYPE"

      - name: "31.2 Create deduplicated GitHub Issue if alert delivery fails"
        if: always() && steps.send_make_alert.outputs.required == 'true' && steps.send_make_alert.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          ALERT_TYPE: ${{ steps.send_make_alert.outputs.alert_type }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- crypto-logger-alert-delivery-failure -->";
            const title = "🚨 Crypto Logger alert delivery failed";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue =>
              !issue.pull_request &&
              (issue.title === title || (issue.body || "").includes(marker))
            );
            if (existing) {
              core.warning(`Alert-delivery issue already open: #${existing.number}`);
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "## Crypto Logger alert delivery failure",
              "",
              "The production workflow required a private recovery alert, but the authenticated Make/Outlook delivery step failed.",
              "",
              `- **Alert type:** ${process.env.ALERT_TYPE || "unknown"}`,
              `- **Workflow:** ${context.workflow}`,
              `- **Run ID:** ${context.runId}`,
              `- **Run attempt:** ${process.env.GITHUB_RUN_ATTEMPT || "unknown"}`,
              `- **Run:** ${runUrl}`,
              "",
              "### Required checks",
              "1. Confirm the Make scenario is active.",
              "2. Reauthorize the Outlook connection if Microsoft revoked or expired it.",
              "3. Confirm `ALERT_MAKE_WEBHOOK_URL` and `ALERT_MAKE_API_KEY` still match Make.",
              "4. Close this issue only after a manual Make webhook test succeeds.",
              "",
              "_This issue is deduplicated: while it remains open, later failures will not create additional issues._"
            ].join("\n");
            const created = await github.rest.issues.create({ owner, repo, title, body });
            core.warning(`Created fallback issue #${created.data.number}`);

      # ======================================================================
      # SECTION 32 - CREATE PRODUCTION SUCCESS SUMMARY
      # ======================================================================
      - name: "32.1 Create structured production summary"
        if: success()
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          AUTH_RECOVERY="Not needed"
          SECRET_UPDATE="Not needed"

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            AUTH_RECOVERY="Used successfully"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            SECRET_UPDATE="Updated successfully"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            SECRET_UPDATE="Failed - private alert requested"
          fi

          {
            echo "## 🚀 Crypto Price Logger - PRODUCTION S1"
            echo ""
            echo "- **VPN1 qualification:** Passed"
            echo "- **VPN2 qualification:** Passed"
            echo "- **Different public IPs:** Passed"
            echo "- **VPNBook auth recovery:** ${AUTH_RECOVERY}"
            echo "- **GitHub VPN secret update:** ${SECRET_UPDATE}"
            echo "- **CoinGecko VPN1 probe:** Passed"
            echo "- **Binance VPN1 probe:** Passed"
            echo "- **Production CSV rows:** ${CSV_ROWS}"
            echo "- **Collection network:** VPN1"
            echo "- **Provider-triggered VPN2 switching:** Not enabled yet"
            echo "- **Neon writes:** Disabled"
            echo "- **Completed UTC:** $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # SECTION 33 - COLLECT FAILURE DIAGNOSTICS
      # ======================================================================
      - name: "33.1 Collect non-secret production diagnostics"
        if: failure()
        run: |
          set +e
          mkdir -p debug
          [ -f private_logger/price_log.csv ] && cp private_logger/price_log.csv debug/price_log.csv
          [ -f "${RUNNER_TEMP}/coingecko-probe.txt" ] && cp "${RUNNER_TEMP}/coingecko-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/binance-probe.txt" ] && cp "${RUNNER_TEMP}/binance-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/network-manager-status.json" ] && cp "${RUNNER_TEMP}/network-manager-status.json" debug/
          [ -f "${RUNNER_TEMP}/s1-self-test.json" ] && cp "${RUNNER_TEMP}/s1-self-test.json" debug/
          [ -d "${RUNNER_TEMP}/network-manager" ] && cp -R "${RUNNER_TEMP}/network-manager" debug/network-manager-state 2>/dev/null || true
          {
            echo "UTC time: $(date -u)"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "vpn_auth_recovered=$([ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && echo yes || echo no)"
            echo "vpn_auth_recovery_failed=$([ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo yes || echo no)"
            echo "vpn_secret_update_success=$([ -f "${RUNNER_TEMP}/vpn-secret-update-success" ] && echo yes || echo no)"
            echo "vpn_secret_update_failed=$([ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo yes || echo no)"
            sudo pgrep -a openvpn || true
            ip route show || true
          } > debug/network-diagnostics.txt
          sudo chown -R "$(id -u):$(id -g)" debug
          chmod -R u+rwX,go+rX debug

      - name: "33.2 Upload production failure diagnostics"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: production-crypto-price-logger-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # ======================================================================
      # SECTION 34 - FINAL EPHEMERAL RUNNER CLEANUP
      # ======================================================================
      - name: "34.1 Cleanup temporary production runner data"
        if: always()
        run: |
          set +e
          sudo pkill -x openvpn 2>/dev/null || true
          rm -rf private_logger
          sudo rm -rf debug
          rm -rf "${RUNNER_TEMP}/network-manager"
          rm -f "${RUNNER_TEMP}/vpn-alert-type.txt"
          sudo rm -f vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt
          echo "✅ Production runner cleanup completed"
