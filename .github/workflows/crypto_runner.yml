name: Crypto Price Logger

on:
  workflow_dispatch:

permissions:
  contents: read

# ============================================================
# PREVENT MULTIPLE LOGGER RUNS
# Only one logger run can update the CSV at a time.
# ============================================================

concurrency:
  group: crypto-price-logger
  cancel-in-progress: false

jobs:

  run-logger:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT PUBLIC RUNNER
      # Downloads the public GitHub Actions runner repository.
      # ======================================================

      - name: Checkout runner repository
        uses: actions/checkout@v4


      # ======================================================
      # RUNNER INFORMATION
      # Shows basic information for workflow troubleshooting.
      # ======================================================

      - name: Show runner information
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🚀 CRYPTO PRICE LOGGER"
          echo "============================================================"

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "Operating system:"
          uname -a

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Disk space:"
          df -h .


      # ======================================================
      # CHECK PRIVATE REPOSITORY TOKEN
      # Confirms that the private GitHub token is available.
      # ======================================================

      - name: Check private repository token
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

        run: |
          set -euo pipefail

          echo "Checking PRIVATE_REPO_TOKEN..."

          if [ -z "$TOKEN" ]; then
            echo "❌ PRIVATE_REPO_TOKEN missing"
            exit 1
          fi

          echo "✅ PRIVATE_REPO_TOKEN exists"


      # ======================================================
      # CLONE PRIVATE REPOSITORY
      # Downloads the private crypto logger with retry support.
      # ======================================================

      - name: Clone private crypto logger
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"

        run: |
          set -euo pipefail

          echo "============================================================"
          echo "📦 DOWNLOADING PRIVATE REPOSITORY"
          echo "============================================================"

          REPOSITORY_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          for attempt in 1 2 3
          do
            echo "Clone attempt ${attempt}/3"

            rm -rf private_logger

            if git clone --branch main --single-branch "$REPOSITORY_URL" private_logger; then
              echo "✅ Private repository downloaded"
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Private repository clone failed after 3 attempts"
              exit 1
            fi

            echo "Waiting before retry..."
            sleep 5
          done

          if [ ! -d "private_logger/.git" ]; then
            echo "❌ Cloned Git repository was not found"
            exit 1
          fi

          cd private_logger

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Latest commit:"
          git log -1 --oneline

          echo ""
          echo "Repository status:"
          git status --short


      # ======================================================
      # VALIDATE REPOSITORY STRUCTURE
      # Checks that the logger and requirements files exist.
      # ======================================================

      - name: Validate private repository structure
        run: |
          set -euo pipefail

          LOGGER_DIRECTORY="private_logger/Crypto Logger-Private Repo"
          LOGGER_FILE="${LOGGER_DIRECTORY}/price_logger.py"
          REQUIREMENTS_FILE="${LOGGER_DIRECTORY}/requirements.txt"

          if [ ! -d "$LOGGER_DIRECTORY" ]; then
            echo "❌ Logger directory missing"
            echo "$LOGGER_DIRECTORY"
            exit 1
          fi

          echo "✅ Logger directory exists"

          if [ ! -f "$LOGGER_FILE" ]; then
            echo "❌ price_logger.py missing"
            exit 1
          fi

          echo "✅ price_logger.py exists"

          if [ ! -f "$REQUIREMENTS_FILE" ]; then
            echo "❌ requirements.txt missing"
            exit 1
          fi

          echo "✅ requirements.txt exists"

          echo ""
          echo "Logger files:"
          find "$LOGGER_DIRECTORY" -maxdepth 2 -type f | sort


      # ======================================================
      # SETUP PYTHON
      # Installs Python 3.13 on the GitHub Actions runner.
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # ======================================================
      # SHOW PYTHON INFORMATION
      # Displays the Python and pip versions being used.
      # ======================================================

      - name: Show Python information
        run: |
          set -euo pipefail

          echo "Python version:"
          python --version

          echo ""
          echo "Pip version:"
          python -m pip --version

          echo ""
          echo "Python location:"
          which python


      # ======================================================
      # INSTALL DEPENDENCIES
      # Installs all packages required by price_logger.py.
      # ======================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          cd private_logger/"Crypto Logger-Private Repo"

          echo "============================================================"
          echo "📦 INSTALLING PYTHON DEPENDENCIES"
          echo "============================================================"

          python -m pip install --upgrade pip

          echo ""
          echo "Installing requirements.txt..."

          python -m pip install -r requirements.txt

          echo ""
          echo "Checking installed dependencies..."

          python -m pip check

          echo ""
          echo "✅ Dependencies installed successfully"


      # ======================================================
      # CHECK REQUIRED SECRETS
      # Confirms that all logger and VPN secrets are available.
      # ======================================================

      - name: Check required secrets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          VPNBOOK_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPNBOOK_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPNBOOK_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}

        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🔐 CHECKING REQUIRED SECRETS"
          echo "============================================================"

          check_secret()
          {
            SECRET_NAME="$1"
            SECRET_VALUE="$2"

            if [ -z "$SECRET_VALUE" ]; then
              echo "❌ ${SECRET_NAME} missing"
              exit 1
            fi

            echo "✅ ${SECRET_NAME} exists"
          }

          check_secret "NEON_DATABASE_URL" "$NEON_DATABASE_URL"
          check_secret "BINANCE_API_KEY" "$BINANCE_API_KEY"
          check_secret "BINANCE_SECRET_KEY" "$BINANCE_SECRET_KEY"
          check_secret "VPNBOOK_CONFIG" "$VPNBOOK_CONFIG"
          check_secret "VPNBOOK_USERNAME" "$VPNBOOK_USERNAME"
          check_secret "VPNBOOK_PASSWORD" "$VPNBOOK_PASSWORD"

          echo ""
          echo "✅ All required secrets are available"


      # ======================================================
      # INSTALL OPENVPN
      # Installs OpenVPN on the temporary Actions runner.
      # ======================================================

      - name: Install OpenVPN
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🌐 INSTALLING OPENVPN"
          echo "============================================================"

          sudo apt-get update
          sudo apt-get install -y openvpn

          echo ""
          echo "OpenVPN version:"
          openvpn --version | head -n 1

          echo ""
          echo "✅ OpenVPN installed"


      # ======================================================
      # CREATE VPN CONFIGURATION
      # Creates protected temporary VPN authentication files.
      # ======================================================

      - name: Create VPN configuration
        env:
          VPNBOOK_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPNBOOK_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPNBOOK_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}

        run: |
          set -euo pipefail

          echo "Creating VPN configuration..."

          umask 077

          printf '%s\n' "$VPNBOOK_CONFIG" > vpnbook.ovpn
          printf '%s\n%s\n' "$VPNBOOK_USERNAME" "$VPNBOOK_PASSWORD" > auth.txt

          echo "auth-user-pass auth.txt" >> vpnbook.ovpn

          chmod 600 vpnbook.ovpn
          chmod 600 auth.txt

          if [ ! -s vpnbook.ovpn ]; then
            echo "❌ VPN configuration is empty"
            exit 1
          fi

          if [ ! -s auth.txt ]; then
            echo "❌ VPN authentication file is empty"
            exit 1
          fi

          echo "✅ VPN configuration created"


      # ======================================================
      # CONNECT VPN
      # Starts OpenVPN and waits for a successful connection.
      # ======================================================

      - name: Connect VPN
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🌐 CONNECTING TO VPN"
          echo "============================================================"

          rm -f vpn.log

          sudo openvpn --config vpnbook.ovpn --daemon --log vpn.log

          VPN_CONNECTED="false"

          for attempt in 1 2 3 4 5 6
          do
            echo "VPN connection check ${attempt}/6"

            if grep -q "Initialization Sequence Completed" vpn.log 2>/dev/null; then
              VPN_CONNECTED="true"
              break
            fi

            if ! pgrep -x openvpn >/dev/null 2>&1; then
              echo "❌ OpenVPN process stopped unexpectedly"

              echo ""
              echo "VPN log:"
              cat vpn.log 2>/dev/null || true

              exit 1
            fi

            sleep 5
          done

          if [ "$VPN_CONNECTED" != "true" ]; then
            echo "❌ VPN connection did not complete"

            echo ""
            echo "VPN log:"
            cat vpn.log 2>/dev/null || true

            exit 1
          fi

          echo "✅ VPN connection completed"


      # ======================================================
      # VERIFY VPN
      # Displays the VPN process, public IP and country.
      # ======================================================

      - name: Verify VPN connection
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🔎 VERIFYING VPN CONNECTION"
          echo "============================================================"

          echo ""
          echo "OpenVPN process:"

          pgrep -a openvpn || true

          echo ""
          echo "Latest VPN log:"

          tail -n 20 vpn.log || true

          echo ""
          echo "Current public IP:"

          curl --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org || true

          echo ""
          echo ""
          echo "Current country:"

          curl --silent --show-error --connect-timeout 10 --max-time 20 https://ipinfo.io/country || true

          echo ""


      # ======================================================
      # TEST COINGECKO
      # Performs an informational CoinGecko connection test.
      # ======================================================

      - name: Test CoinGecko connectivity
        run: |
          echo "============================================================"
          echo "🦎 TESTING COINGECKO"
          echo "============================================================"

          curl --include --connect-timeout 10 --max-time 20 https://api.coingecko.com/api/v3/ping || true

          echo ""
          echo "CoinGecko diagnostic test completed"


      # ======================================================
      # TEST BINANCE
      # Performs an informational Binance connection test.
      # ======================================================

      - name: Test Binance connectivity
        run: |
          echo "============================================================"
          echo "🟡 TESTING BINANCE"
          echo "============================================================"

          curl --include --connect-timeout 10 --max-time 20 https://api.binance.com/api/v3/time || true

          echo ""
          echo "Binance diagnostic test completed"


      # ======================================================
      # VALIDATE PYTHON SYNTAX
      # Checks price_logger.py before running the main logger.
      # ======================================================

      - name: Validate logger syntax
        run: |
          set -euo pipefail

          cd private_logger/"Crypto Logger-Private Repo"

          echo "============================================================"
          echo "🐍 VALIDATING LOGGER SYNTAX"
          echo "============================================================"

          python -m py_compile price_logger.py

          echo ""
          echo "✅ price_logger.py syntax is valid"


      # ======================================================
      # SHOW LOGGER INFORMATION
      # Displays the logger file size, lines and checksum.
      # ======================================================

      - name: Show logger file information
        run: |
          set -euo pipefail

          LOGGER_FILE="private_logger/Crypto Logger-Private Repo/price_logger.py"

          echo "Logger file:"
          ls -lh "$LOGGER_FILE"

          echo ""
          echo "Logger line count:"
          wc -l "$LOGGER_FILE"

          echo ""
          echo "Logger checksum:"
          sha256sum "$LOGGER_FILE"


      # ======================================================
      # RUN CRYPTO LOGGER
      # Collects prices and creates or updates price_log.csv.
      # ======================================================

      - name: Run crypto price logger
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"

        run: |
          set -euo pipefail

          cd private_logger/"Crypto Logger-Private Repo"

          echo "============================================================"
          echo "🚀 STARTING CRYPTO PRICE LOGGER"
          echo "UTC Time: $(date -u)"
          echo "============================================================"

          python price_logger.py

          echo ""
          echo "============================================================"
          echo "✅ CRYPTO PRICE LOGGER COMPLETED"
          echo "UTC Time: $(date -u)"
          echo "============================================================"


      # ======================================================
      # CHECK GENERATED CSV
      # Confirms that price_log.csv exists and is not empty.
      # ======================================================

      - name: Check generated CSV
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"

          echo "============================================================"
          echo "📄 CHECKING GENERATED CSV"
          echo "============================================================"

          if [ ! -f "$CSV" ]; then
            echo "❌ price_log.csv was not created"
            exit 1
          fi

          if [ ! -s "$CSV" ]; then
            echo "❌ price_log.csv exists but is empty"
            exit 1
          fi

          echo "✅ price_log.csv exists"

          echo ""
          echo "CSV information:"
          ls -lh "$CSV"

          echo ""
          echo "CSV row count:"
          wc -l "$CSV"

          echo ""
          echo "CSV header:"
          head -n 1 "$CSV"

          echo ""
          echo "Latest CSV rows:"
          tail -n 12 "$CSV"


      # ======================================================
      # VALIDATE CSV HEADER
      # Stops malformed CSV files from being committed.
      # ======================================================

      - name: Validate CSV header
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"

          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"

          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"

          echo "Expected header:"
          echo "$EXPECTED_HEADER"

          echo ""
          echo "Actual header:"
          echo "$ACTUAL_HEADER"

          if [ "$ACTUAL_HEADER" != "$EXPECTED_HEADER" ]; then
            echo "❌ CSV header is incorrect"
            exit 1
          fi

          echo ""
          echo "✅ CSV header is correct"


      # ======================================================
      # VALIDATE CSV ROW COUNT
      # Requires one header and at least one crypto data row.
      # ======================================================

      - name: Validate CSV row count
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"

          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"

          echo "CSV rows found: $CSV_ROWS"

          if [ "$CSV_ROWS" -lt 2 ]; then
            echo "❌ CSV does not contain crypto data"
            exit 1
          fi

          echo "✅ CSV contains crypto data"


      # ======================================================
      # CREATE CSV SAFETY BACKUP
      # Copies the CSV outside Git before synchronisation.
      # ======================================================

      - name: Create CSV safety backup
        run: |
          set -euo pipefail

          SOURCE_CSV="private_logger/price_log.csv"

          BACKUP_CSV="${RUNNER_TEMP}/price_log.csv"

          echo "Creating CSV safety backup..."

          cp -- "$SOURCE_CSV" "$BACKUP_CSV"

          if [ ! -s "$BACKUP_CSV" ]; then
            echo "❌ CSV safety backup failed"
            exit 1
          fi

          echo "✅ CSV safety backup created"

          ls -lh "$BACKUP_CSV"


      # ======================================================
      # SAVE CSV TO PRIVATE REPOSITORY
      # Commits the CSV before fetching, rebasing and pushing.
      # ======================================================

      - name: Save CSV to private repository
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"

        run: |
          set -euo pipefail

          echo "============================================================"
          echo "💾 SAVING CSV TO PRIVATE REPOSITORY"
          echo "============================================================"

          if [ -z "$TOKEN" ]; then
            echo "❌ PRIVATE_REPO_TOKEN missing"
            exit 1
          fi

          cd private_logger

          CSV="price_log.csv"

          BACKUP_CSV="${RUNNER_TEMP}/price_log.csv"

          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          if [ ! -s "$CSV" ]; then
            echo "❌ price_log.csv missing before commit"
            exit 1
          fi

          if [ ! -s "$BACKUP_CSV" ]; then
            echo "❌ CSV safety backup missing"
            exit 1
          fi

          git config user.name "github-actions"

          git config user.email "actions@github.com"

          echo ""
          echo "Repository status before staging:"

          git status --short

          echo ""
          echo "Adding price_log.csv..."

          git add -- price_log.csv

          echo ""
          echo "Repository status after staging:"

          git status --short

          if git diff --cached --quiet; then
            echo ""
            echo "No CSV changes detected"
            echo "Nothing needs to be committed"
            exit 0
          fi

          echo ""
          echo "CSV changes:"

          git diff --cached --stat

          COMMIT_MESSAGE="Update crypto price log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          echo ""
          echo "Creating local commit..."

          git commit -m "$COMMIT_MESSAGE"

          echo ""
          echo "Local commit:"

          git log -1 --oneline

          for attempt in 1 2 3
          do
            echo ""
            echo "------------------------------------------------------------"
            echo "Git synchronisation attempt ${attempt}/3"
            echo "------------------------------------------------------------"

            echo "Fetching latest origin/main..."

            git fetch origin main

            echo ""
            echo "Rebasing local CSV commit..."

            if ! git rebase origin/main; then
              echo "❌ Rebase conflict detected"

              git rebase --abort || true

              cp -- "$BACKUP_CSV" "$CSV"

              echo "CSV restored from safety backup"

              exit 1
            fi

            echo "✅ Rebase completed"

            echo ""
            echo "Pushing CSV update..."

            if git push "$REMOTE_URL" HEAD:main; then
              echo ""
              echo "============================================================"
              echo "✅ CSV PUSHED SUCCESSFULLY"
              echo "============================================================"

              exit 0
            fi

            echo ""
            echo "⚠ Push attempt ${attempt} failed"

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi
          done

          echo "❌ CSV push failed after 3 attempts"

          exit 1


      # ======================================================
      # CREATE WORKFLOW SUMMARY
      # Adds a clear result summary to the Actions run page.
      # ======================================================

      - name: Create logger summary
        run: |
          set -euo pipefail

          CSV="private_logger/price_log.csv"

          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"

          DATA_ROWS="$((CSV_ROWS - 1))"

          LATEST_TIMESTAMP="$(tail -n 1 "$CSV" | cut -d',' -f1)"

          {
            echo "## 🚀 Crypto Price Logger"
            echo ""
            echo "- **Workflow:** Successful"
            echo "- **CSV total rows:** ${CSV_ROWS}"
            echo "- **CSV data rows:** ${DATA_ROWS}"
            echo "- **Latest timestamp:** ${LATEST_TIMESTAMP}"
            echo "- **VPN:** Connected"
            echo "- **Python syntax:** Valid"
            echo "- **Git update:** Successful or no changes required"
            echo "- **Completed UTC:** $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ Workflow summary created"


      # ======================================================
      # UPLOAD FAILURE DEBUG FILES
      # Uploads safe troubleshooting files when the job fails.
      # ======================================================

      - name: Upload debug files if failed
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: crypto-price-logger-debug

          path: |
            vpn.log
            private_logger/price_log.csv

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # CLEANUP RUNNER
      # Stops OpenVPN and removes temporary private files.
      # ======================================================

      - name: Cleanup runner
        if: always()

        run: |
          echo "============================================================"
          echo "🧹 CLEANING RUNNER"
          echo "============================================================"

          echo "Stopping OpenVPN..."

          sudo pkill openvpn 2>/dev/null || true

          echo "Removing private repository..."

          rm -rf private_logger

          echo "Removing VPN files..."

          rm -f vpnbook.ovpn
          rm -f auth.txt
          rm -f vpn.log

          echo "✅ Runner cleaned"
