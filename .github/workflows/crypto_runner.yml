name: "Crypto Logger | Main"
run-name: "Crypto Logger | Main | #${{ github.run_number }}"

on:
  workflow_dispatch:
  # The existing external five-minute dispatcher is authoritative. Do not add a
  # second GitHub cron here: duplicate schedulers can queue overlapping runs.

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data

# ============================================================================
# CRYPTO PRICE LOGGER - PRODUCTION S2
# BOUNDED NETWORK RECOVERY + THREE-SOURCE PRICE CONSENSUS
# ============================================================================
# Production rules:
# - Protected public release authority selects one full private source commit.
# - Mutable repository variables cannot select or enable production code.
# - Runtime CSV/state lives on the dedicated private runtime-data branch.
# - Only price_log.csv, csv_state.json, provider_incident_state.json, and the
#   non-secret runtime manifest may be written by this workflow.
# - Stored VPN credentials are attempted first.
# - Only AUTH_FAILED triggers live VPNBook credential recovery.
# - Live credentials are fetched only from the official VPNBook OpenVPN page.
# - Retrieved credentials are masked before reuse.
# - VPN1 is the primary collection network; VPN2 is validated as cold standby.
# - Transient VPN1 startup failures receive one bounded retry, then one VPN2 failover.
# - GitHub Actions secrets are updated only after recovered credentials prove
#   valid through the complete VPN test.
# - Secret-update failure does not kill an already recovered price-logger run.
# - Recovery failure stops the workflow and may send a private email alert.
# - Provider-triggered recovery is enabled with one global VPN2 switch ceiling.
# - Coinbase and Binance are authenticated primaries; CoinGecko validates.
# - Cached estimates are labelled and automatically disable trading eligibility.
# - Provider alerts send only on incident start, severity change, and recovery.
# - Email, summaries and diagnostics are optional, bounded side effects. Their
#   failures never replace the verified CSV/Neon result or acknowledge delivery.
# - Neon sync is a dependent job and consumes the exact verified data/source
#   commits after core persistence succeeds. Manual repairs use Neon Audit.
# ============================================================================

concurrency:
  group: crypto-main
  cancel-in-progress: false
  queue: max

jobs:
  validate-invocation:
    name: Validate production invocation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      private_code_sha: ${{ steps.release.outputs.private_code_sha }}
      neon_state: ${{ steps.release.outputs.neon_state }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
    steps:
      - name: Require the protected public main ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production may run only from refs/heads/main; received ${GITHUB_REF}"
            exit 1
          }

      - name: Checkout protected public release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate enabled logger release capability
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability logger
          --github-output "$GITHUB_OUTPUT"

  run-logger:
    name: Run, persist, and notify exact logger batch
    needs: validate-invocation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PRIVATE_CODE_SHA: ${{ needs.validate-invocation.outputs.private_code_sha }}
    outputs:
      core_commit_sha: ${{ steps.verify_core.outputs.core_commit_sha }}
      core_verification: ${{ steps.verify_core.outcome }}
      workflow_email_status: ${{ steps.send_make_alert.outputs.delivery_status }}
      source_code_sha: ${{ steps.verify_core.outputs.source_code_sha }}
      alert_required: ${{ steps.send_make_alert.outputs.required }}
      alert_type: ${{ steps.send_make_alert.outputs.alert_type }}
      alert_delivery_error: ${{ steps.send_make_alert.outputs.delivery_error_code }}
      alert_delivery_failed: ${{ steps.send_make_alert.outcome == 'failure' || steps.send_make_alert.outputs.delivery_status == 'failed' || steps.send_make_alert.outputs.delivery_status == 'pending' }}
      provider_alert_required: ${{ steps.send_provider_alert.outputs.required }}
      provider_alert_type: ${{ steps.send_provider_alert.outputs.alert_type }}
      provider_alert_delivery_error: ${{ steps.send_provider_alert.outputs.delivery_error_code }}
      provider_alert_severity: ${{ steps.send_provider_alert.outputs.alert_severity }}
      provider_alert_event_id: ${{ steps.send_provider_alert.outputs.event_id }}
      provider_alert_fingerprint: ${{ steps.send_provider_alert.outputs.fingerprint }}
      provider_alert_delivery_failed: ${{ steps.send_provider_alert.outcome == 'failure' || steps.send_provider_alert.outputs.delivery_status == 'failed' || steps.send_provider_alert.outputs.delivery_status == 'pending' }}
      provider_ack_failed: ${{ steps.send_provider_alert.outputs.delivery_status == 'accepted' && steps.ack_provider_alert.outcome != 'success' }}

    steps:
      # ======================================================================
      # SECTION 01 - CHECK OUT THE PUBLIC PRODUCTION RUNNER
      # ======================================================================
      - name: "01.1 Checkout public production runner"
        id: stage_01_1_checkout_public_production_runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # ======================================================================
      # SECTION 02 - IDENTIFY THIS EXACT PRODUCTION RUN
      # ======================================================================
      - name: "02.1 Display production run identity"
        id: stage_02_1_display_production_run_identity
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🚀 CRYPTO PRICE LOGGER - PRODUCTION S2"
          echo "============================================================"
          echo "UTC time:        $(date -u)"
          echo "Repository:      ${GITHUB_REPOSITORY}"
          echo "Public branch:   ${GITHUB_REF_NAME}"
          echo "Public commit:   ${GITHUB_SHA}"
          echo "Workflow:        ${GITHUB_WORKFLOW}"
          echo "Run number:      ${GITHUB_RUN_NUMBER}"
          echo "Run ID:          ${GITHUB_RUN_ID}"
          echo "Run attempt:     ${GITHUB_RUN_ATTEMPT}"
          echo "Runner OS:       ${RUNNER_OS}"
          echo "============================================================"

      # ======================================================================
      # SECTION 03 - VALIDATE PRIVATE REPOSITORY ACCESS
      # ======================================================================
      - name: "03.1 Validate effective private repository tokens"
        id: stage_03_1_validate_effective_private_repository_tokens
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN" || { echo "❌ PRIVATE_CODE_READ_TOKEN/PRIVATE_REPO_TOKEN missing"; exit 1; }
          test -n "$PRIVATE_DATA_TOKEN" || { echo "❌ PRIVATE_DATA_WRITE_TOKEN/PRIVATE_REPO_TOKEN missing"; exit 1; }
          echo "✅ Effective private code-read and runtime-data tokens configured"

      # ======================================================================
      # SECTION 04 - CHECK OUT PINNED CODE + ISOLATED RUNTIME DATA
      # ======================================================================
      - name: "04.1 Checkout exact private production source"
        id: stage_04_1_checkout_exact_private_production_source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_CODE_SHA }}
          path: private_logger
          fetch-depth: 1
          persist-credentials: false

      - name: "04.2 Verify and detach immutable private source"
        id: stage_04_2_verify_and_detach_immutable_private_source
        run: |
          set -euo pipefail
          cd private_logger
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "${PRIVATE_CODE_SHA,,}" || {
            echo "❌ Private source does not match PRIVATE_CODE_SHA"
            exit 1
          }
          git remote remove origin
          echo "SOURCE_CODE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "✅ Exact private production source verified and detached"

      - name: "04.3 Checkout isolated private runtime-data branch"
        id: stage_04_3_checkout_isolated_private_runtime_data_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 0
          persist-credentials: false

      - name: "04.4 Verify runtime-data branch and copy named state"
        id: stage_04_4_verify_runtime_data_branch_and_copy_named_state
        run: |
          set -euo pipefail
          test "$(git -C private_data branch --show-current)" = "$PRIVATE_DATA_BRANCH"
          python "private_logger/Crypto Logger-Private Repo/manage_csv_file_lifecycle.py" \
            --mode prepare-logger \
            --path private_data/price_log.csv \
            --state-path private_data/csv_state.json \
            --git-repository private_data
          for state_file in csv_state.json provider_incident_state.json; do
            test -f "private_data/$state_file" || {
              echo "❌ runtime-data is missing $state_file; restore it on runtime-data before activation"
              exit 1
            }
            cp -- "private_data/$state_file" "private_logger/$state_file"
          done
          if [ -f private_data/price_log.csv ]; then
            cp -- private_data/price_log.csv private_logger/price_log.csv
          else
            echo "⚠ price_log.csv is absent; generation-aware preflight recovery will inspect Git history"
          fi
          echo "✅ Runtime state copied into the immutable source workspace"

      # ======================================================================
      # SECTION 05 - VERIFY PRODUCTION LOGGER FILE STRUCTURE
      # ======================================================================
      - name: "05.1 Validate core production logger files"
        id: stage_05_1_validate_core_production_logger_files
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          for required in \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/provider_consensus.py" \
            "$LOGGER_DIR/csv_integrity.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/s2_network_manager.py" \
            "$LOGGER_DIR/provider_network_recovery.py" \
            "$LOGGER_DIR/vpn_profile_normalizer.py" \
            "$LOGGER_DIR/requirements.lock" \
            "$LOGGER_DIR/tests/test_csv_integrity.py" \
            "$LOGGER_DIR/tests/test_provider_consensus.py" \
            "$LOGGER_DIR/tests/test_provider_alert_email.py"; do
            test -s "$required" || { echo "❌ Missing or empty: $required"; exit 1; }
          done
          echo "✅ Core production files validated"

      - name: "05.2 Validate VPN auth recovery helper files"
        id: stage_05_2_validate_vpn_auth_recovery_helper_files
        run: |
          set -euo pipefail
          RECOVERY_DIR="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery"
          for required in \
            "$RECOVERY_DIR/__init__.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"; do
            test -s "$required" || { echo "❌ Missing or empty recovery file: $required"; exit 1; }
          done
          echo "✅ VPN auth recovery package validated"

      # ======================================================================
      # SECTION 06 - SET UP PYTHON
      # ======================================================================
      - name: "06.1 Setup Python 3.13"
        id: stage_06_1_setup_python_3_13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # ======================================================================
      # SECTION 07 - INSTALL AND VERIFY DEPENDENCIES
      # ======================================================================
      - name: "07.1 Install production logger dependencies"
        id: stage_07_1_install_production_logger_dependencies
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r requirements.lock
          python -m pip check
          python -c "from coinbase.rest import RESTClient; print('Coinbase SDK import verified')"
          echo "✅ Python dependencies installed and verified"

      # ======================================================================
      # SECTION 08 - COMPILE ALL PYTHON MODULES
      # ======================================================================
      - name: "08.1 Compile production Python modules"
        id: stage_08_1_compile_production_python_modules
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="$LOGGER_DIR/vpn_auth_recovery"
          python -m py_compile \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/provider_consensus.py" \
            "$LOGGER_DIR/csv_integrity.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/s2_network_manager.py" \
            "$LOGGER_DIR/provider_network_recovery.py" \
            "$LOGGER_DIR/vpn_profile_normalizer.py" \
            "$RECOVERY_DIR/recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_credentials.py" \
            "$RECOVERY_DIR/github_secret_updater.py" \
            "$RECOVERY_DIR/alert_email.py"
          echo "✅ All production Python modules compile"

      - name: "08.2 Run production regression tests"
        id: production_regression
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          export PYTHONPATH="$PWD:$(dirname "$PWD")/Neon Weekly Audit"
          python provider_consensus.py persist-incident --help >/dev/null
          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v
          echo "✅ CSV, consensus, incident-alert, and recovery tests passed"

      # ======================================================================
      # SECTION 09 - VALIDATE BINANCE SECRETS
      # ======================================================================
      - name: "09.1 Validate Binance API secrets"
        id: stage_09_1_validate_binance_api_secrets
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo "❌ BINANCE_API_KEY missing"; exit 1; }
          test -n "$BINANCE_SECRET_KEY" || { echo "❌ BINANCE_SECRET_KEY missing"; exit 1; }
          echo "✅ Binance API secrets configured"

      - name: "09.2 Validate Coinbase read-only API secrets"
        id: stage_09_2_validate_coinbase_read_only_api_secrets
        env:
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$COINBASE_API_KEY_NAME" || { echo "❌ COINBASE_API_KEY_NAME missing"; exit 1; }
          test -n "$COINBASE_API_PRIVATE_KEY" || { echo "❌ COINBASE_API_PRIVATE_KEY missing"; exit 1; }
          # Coinbase currently issues either a full resource name such as
          # organizations/.../apiKeys/... or a standalone key ID.  The official
          # SDK accepts both, so do not reject a valid modern key format here.
          test "${#COINBASE_API_KEY_NAME}" -ge 16 || { echo "❌ COINBASE_API_KEY_NAME is unexpectedly short"; exit 1; }
          test "${#COINBASE_API_PRIVATE_KEY}" -ge 32 || { echo "❌ COINBASE_API_PRIVATE_KEY is unexpectedly short"; exit 1; }
          echo "✅ Coinbase key ID/name and private key are configured (values not printed)"

      # ======================================================================
      # SECTION 10 - VALIDATE VPN1 SECRETS
      # ======================================================================
      - name: "10.1 Validate VPN1 production secrets"
        id: stage_10_1_validate_vpn1_production_secrets
        env:
          VPN1_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN1_CONFIG" || { echo "❌ VPNBOOK_CONFIG missing"; exit 1; }
          test -n "$VPN1_USERNAME" || { echo "❌ VPNBOOK_USERNAME missing"; exit 1; }
          test -n "$VPN1_PASSWORD" || { echo "❌ VPNBOOK_PASSWORD missing"; exit 1; }
          echo "✅ VPN1 production secrets configured"

      # ======================================================================
      # SECTION 11 - VALIDATE VPN2 SECRETS
      # ======================================================================
      - name: "11.1 Validate VPN2 production secrets"
        id: stage_11_1_validate_vpn2_production_secrets
        env:
          VPN2_CONFIG: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN2_CONFIG" || { echo "❌ VPN2_CONFIG missing"; exit 1; }
          test -n "$VPN2_USERNAME" || { echo "❌ VPN2_USERNAME missing"; exit 1; }
          test -n "$VPN2_PASSWORD" || { echo "❌ VPN2_PASSWORD missing"; exit 1; }
          echo "✅ VPN2 production secrets configured"

      # ======================================================================
      # SECTION 12 - CHECK OPTIONAL VPN SECRET UPDATE TOKEN
      # ======================================================================
      - name: "12.1 Check VPN_SECRET_UPDATE_TOKEN"
        id: stage_12_1_check_vpn_secret_update_token
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$VPN_SECRET_UPDATE_TOKEN" ]; then
            echo "✅ Automatic GitHub VPN secret update enabled"
          else
            echo "⚠ VPN_SECRET_UPDATE_TOKEN missing; runtime recovery can work but cannot persist refreshed credentials"
          fi

      # ======================================================================
      # SECTION 13 - CHECK AUTHENTICATED MAKE/OUTLOOK ALERT SECRETS
      # ======================================================================
      - name: "13.1 Check Make webhook alert secrets"
        id: stage_13_1_check_make_webhook_alert_secrets
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
          ALERT_LOCAL_HELPER_TOKEN: ${{ secrets.ALERT_LOCAL_HELPER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ALERT_MAKE_WEBHOOK_URL" ] && [ -n "$ALERT_MAKE_API_KEY" ]; then
            echo "✅ Authenticated Make/Outlook alert delivery configured"
          else
            echo "⚠ Make/Outlook alert secrets incomplete; GitHub Issue fallback will protect required alerts"
          fi
          if [ -n "$ALERT_LOCAL_HELPER_TOKEN" ] && [ "${#ALERT_LOCAL_HELPER_TOKEN}" -ge 32 ]; then
            echo "✅ Signed Windows localhost debug links enabled"
          elif [ -n "$ALERT_LOCAL_HELPER_TOKEN" ]; then
            echo "⚠ ALERT_LOCAL_HELPER_TOKEN is too short; the optional desktop shortcut will be omitted"
          else
            echo "ℹ Windows localhost debug links are not enabled"
          fi

      # ======================================================================
      # SECTION 14 - INSTALL OPENVPN
      # ======================================================================
      - name: "14.1 Install and verify OpenVPN"
        id: stage_14_1_install_and_verify_openvpn
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version | head -n 1
          sudo -n true
          echo "✅ OpenVPN ready"

      # ======================================================================
      # SECTION 15 - CREATE PROTECTED VPN RUNTIME FILES
      # ======================================================================
      - name: "15.1 Create protected VPN1/VPN2 runtime files"
        id: stage_15_1_create_protected_vpn1_vpn2_runtime_files
        env:
          VPN1_CONFIG_SECRET: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG_SECRET: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "vpn-runtime"
          root.mkdir(mode=0o700)
          payloads = {
              "vpn1.ovpn": os.environ["VPN1_CONFIG_SECRET"] + "\n",
              "vpn1-auth.txt": os.environ["VPN1_USERNAME"] + "\n" + os.environ["VPN1_PASSWORD"] + "\n",
              "vpn2.ovpn": os.environ["VPN2_CONFIG_SECRET"] + "\n",
              "vpn2-auth.txt": os.environ["VPN2_USERNAME"] + "\n" + os.environ["VPN2_PASSWORD"] + "\n",
          }
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          for name, payload in payloads.items():
              descriptor = os.open(root / name, flags, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8") as file:
                  file.write(payload)
                  file.flush()
                  os.fsync(file.fileno())
          PY
          test -s "${RUNNER_TEMP}/vpn-runtime/vpn1.ovpn"
          test -s "${RUNNER_TEMP}/vpn-runtime/vpn1-auth.txt"
          test -s "${RUNNER_TEMP}/vpn-runtime/vpn2.ovpn"
          test -s "${RUNNER_TEMP}/vpn-runtime/vpn2-auth.txt"
          echo "✅ Protected VPN runtime files created"

      # ======================================================================
      # SECTION 16 - PREPARE S2 NETWORK MANAGER RUNTIME
      # ======================================================================
      - name: "16.1 Prepare S2 network runtime boundary"
        id: stage_16_1_prepare_s2_network_runtime_boundary
        env: &network_env
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          NETWORK_MANAGER_ALLOWED_ROOTS: ${{ runner.temp }}:${{ github.workspace }}
          VPN1_CONFIG: ${{ runner.temp }}/vpn-runtime/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ runner.temp }}/vpn-runtime/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn2-auth.txt
        run: |
          set -euo pipefail
          test -s "private_logger/Crypto Logger-Private Repo/s2_network_manager.py"
          test -s "private_logger/Crypto Logger-Private Repo/provider_network_recovery.py"
          test -s "private_logger/Crypto Logger-Private Repo/vpn_profile_normalizer.py"
          test -s "$VPN1_CONFIG"
          test -s "$VPN1_AUTH_FILE"
          test -s "$VPN2_CONFIG_FILE"
          test -s "$VPN2_AUTH_FILE"
          echo "✅ S2 Network Manager is ready before any network-sensitive provider work"

      # ======================================================================
      # SECTION 18 - BOOTSTRAP VPN1 + AUTH RECOVERY + COLD-STANDBY VPN2
      # ======================================================================
      - name: "18.1 Bootstrap managed network and recover VPNBook auth if required"
        id: vpn_auth_recovery
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          NETWORK_MANAGER_ALLOWED_ROOTS: ${{ runner.temp }}:${{ github.workspace }}
          VPN1_CONFIG: ${{ runner.temp }}/vpn-runtime/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ runner.temp }}/vpn-runtime/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn2-auth.txt
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          CONTROLLER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/recovery_controller.py"
          python "$CONTROLLER" \
            --state-dir "$NETWORK_MANAGER_STATE_DIR" \
            --vpn1-config "$VPN1_CONFIG" \
            --vpn1-auth "$VPN1_AUTH_FILE" \
            --vpn2-config "$VPN2_CONFIG_FILE" \
            --vpn2-auth "$VPN2_AUTH_FILE" \
            --self-test-output "${RUNNER_TEMP}/s2-bootstrap.json" \
            --recovered-marker "${RUNNER_TEMP}/vpn-auth-recovered" \
            --recovery-failed-marker "${RUNNER_TEMP}/vpn-auth-recovery-failed" \
            --secret-update-success-marker "${RUNNER_TEMP}/vpn-secret-update-success" \
            --secret-update-failed-marker "${RUNNER_TEMP}/vpn-secret-update-failed" \
            --repository "$GITHUB_REPOSITORY" \
            --persist-secrets \
            --update-vpn2-secrets

      # ======================================================================
      # SECTION 19 - VERIFY THE MANAGED STARTUP NETWORK
      # ======================================================================
      - name: "19.1 Verify S2 bootstrap and bounded network state"
        id: stage_19_1_verify_s2_bootstrap_and_bounded_network_state
        env: *network_env
        run: |
          set -euo pipefail
          BOOTSTRAP="${RUNNER_TEMP}/s2-bootstrap.json"
          STATUS="${RUNNER_TEMP}/network-manager-status.json"
          test -s "$BOOTSTRAP"
          jq -e '
            .passed == true and
            .vpn2_standby_validated == true and
            (.startup_network == "VPN1" or .startup_network == "VPN2")
          ' "$BOOTSTRAP" >/dev/null
          STARTUP_NETWORK="$(jq -r '.startup_network' "$BOOTSTRAP")"
          echo "STARTUP_NETWORK=$STARTUP_NETWORK" >> "$GITHUB_ENV"
          python "private_logger/Crypto Logger-Private Repo/s2_network_manager.py" status | tee "$STATUS"
          grep -q '"running": true' "$STATUS"
          SWITCH_COUNT="$(jq -r '.switch_count' "$STATUS")"
          test "$SWITCH_COUNT" -le 1
          echo "✅ S2 bootstrap verified on ${STARTUP_NETWORK}; VPN2 remains cold unless recovery required"

      # ======================================================================
      # SECTION 20 - REPORT AUTH RECOVERY / SECRET UPDATE OUTCOME
      # ======================================================================
      - name: "20.1 Report VPN credential recovery state"
        id: stage_20_1_report_vpn_credential_recovery_state
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            echo "⚠ Stored credentials expired; live VPNBook recovery succeeded"
          else
            echo "✅ Stored VPN credentials remained valid"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            echo "✅ GitHub VPN secrets updated"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            echo "⚠ GitHub VPN secret update failed; current run may continue"
          else
            echo "ℹ GitHub VPN secret update was not required"
          fi

      # ======================================================================
      # SECTION 23 - RECORD PRODUCTION CSV STATE BEFORE LOGGER
      # ======================================================================
      - name: "23.1 Preflight and record production CSV state"
        id: csv_preflight
        run: |
          set -euo pipefail
          CSV="private_data/price_log.csv"
          RECOVERY_DIR="${RUNNER_TEMP}/csv-recovery"
          mkdir -p "$RECOVERY_DIR"
          python "private_logger/Crypto Logger-Private Repo/csv_audit.py" \
            --runtime-repository private_data \
            --recovery-dir "$RECOVERY_DIR" \
            | tee "${RUNNER_TEMP}/csv-integrity-preflight.log"
          cp -- private_data/price_log.csv private_logger/price_log.csv
          cp -- private_data/csv_state.json private_logger/csv_state.json
          cp -- private_data/provider_incident_state.json private_logger/provider_incident_state.json
          cp -- private_data/provider_incident_state.json "${RUNNER_TEMP}/provider-state-before.json"
          cp -- private_data/csv_state.json "${RUNNER_TEMP}/provider-csv-state-before.json"
          BEFORE_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          echo "$BEFORE_ROWS" > "${RUNNER_TEMP}/csv_rows_before.txt"
          echo "Production CSV rows before logger: ${BEFORE_ROWS}"

      # ======================================================================
      # SECTION 24 - RUN THE PRODUCTION PRICE LOGGER
      # ======================================================================
      - name: "24.1 Run price_logger.py on managed S2 network"
        id: run_price_logger
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXCHANGERATE_DEV_API_KEY: ${{ secrets.EXCHANGERATE_DEV_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          CSV_RECOVERY_DIR: ${{ runner.temp }}/csv-recovery
          PROVIDER_REPORT_FILE: ${{ runner.temp }}/provider-report.json
          PROVIDER_EVENT_FILE: ${{ runner.temp }}/provider-event.json
          CRYPTO_LOGGER_NETWORK_RECOVERY: "1"
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          NETWORK_MANAGER_ALLOWED_ROOTS: ${{ runner.temp }}:${{ github.workspace }}
          VPN1_CONFIG: ${{ runner.temp }}/vpn-runtime/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ runner.temp }}/vpn-runtime/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ runner.temp }}/vpn-runtime/vpn2-auth.txt
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          echo "============================================================"
          echo "🚀 STARTING PRODUCTION CRYPTO PRICE LOGGER"
          echo "UTC time: $(date -u)"
          echo "============================================================"
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python price_logger.py
          echo "✅ PRODUCTION CRYPTO PRICE LOGGER COMPLETED"

      - name: "24.2 Validate sanitized provider decision report"
        id: stage_24_2_validate_sanitized_provider_decision_report
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/provider-report.json"
          test -s "$REPORT" || { echo "❌ Provider report missing"; exit 1; }
          jq -e '
            .version == 1 and
            (.overall_severity | IN("HEALTHY", "WARNING", "CRITICAL")) and
            (.trading_allowed | type == "boolean") and
            (.network_recovery.enabled == true) and
            (.network_recovery.switch_count <= 1) and
            (.decisions | type == "object" and length == 11)
          ' "$REPORT" >/dev/null
          echo "Provider severity: $(jq -r '.overall_severity' "$REPORT")"
          echo "Trading allowed:   $(jq -r '.trading_allowed' "$REPORT")"
          echo "Affected symbols:  $(jq -r '.affected_symbols | join(", ") | if length == 0 then "none" else . end' "$REPORT")"
          echo "✅ Provider report schema validated"

      # ======================================================================
      # SECTION 25 - DISCONNECT VPN BEFORE GIT/GITHUB TRAFFIC
      # ======================================================================
      - name: "25.1 Disconnect managed VPN"
        id: stage_25_1_disconnect_managed_vpn
        if: always()
        env: *network_env
        run: |
          set +e
          MANAGER="private_logger/Crypto Logger-Private Repo/s2_network_manager.py"
          [ -f "$MANAGER" ] && python "$MANAGER" reset

      - name: "25.2 Verify OpenVPN fully stopped"
        id: stage_25_2_verify_openvpn_fully_stopped
        if: always()
        run: |
          set -euo pipefail
          STATE="${RUNNER_TEMP}/network-manager/state.json"
          test -s "$STATE"
          test "$(jq -r '.active_network' "$STATE")" = "null"
          test "$(jq -r '.pid_file' "$STATE")" = "null"
          echo "✅ Managed VPN disconnected before Git/GitHub traffic"

      # ======================================================================
      # SECTION 26 - VALIDATE PRODUCTION CSV OUTPUT
      # ======================================================================
      - name: "26.1 Validate production CSV schema and new rows"
        id: stage_26_1_validate_production_csv_schema_and_new_rows
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          INTEGRITY="private_logger/Crypto Logger-Private Repo/csv_integrity.py"
          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"
          python "$INTEGRITY" \
            --path "$CSV" \
            --recovery-dir "${RUNNER_TEMP}/csv-recovery" \
            --validate-only \
            | tee "${RUNNER_TEMP}/csv-integrity-postflight.log"
          test -s "$CSV"
          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"
          test "$ACTUAL_HEADER" = "$EXPECTED_HEADER" || { echo "❌ CSV header mismatch"; exit 1; }
          BEFORE_ROWS="$(cat "${RUNNER_TEMP}/csv_rows_before.txt")"
          AFTER_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          ADDED_ROWS="$((AFTER_ROWS - BEFORE_ROWS))"
          echo "Rows before: ${BEFORE_ROWS}"
          echo "Rows after:  ${AFTER_ROWS}"
          echo "Rows added:  ${ADDED_ROWS}"
          test "$ADDED_ROWS" -eq 11 || { echo "❌ Expected exactly 11 new symbol rows, got ${ADDED_ROWS}"; exit 1; }
          echo "✅ Production CSV validated"

      # ======================================================================
      # SECTION 27 - BACK UP PRICE + NON-SECRET INCIDENT STATE
      # ======================================================================
      - name: "27.1 Backup production state before Git operations"
        id: stage_27_1_backup_production_state_before_git_operations
        run: |
          set -euo pipefail
          cp -- private_logger/price_log.csv "${RUNNER_TEMP}/price_log.csv"
          cp -- private_logger/csv_state.json "${RUNNER_TEMP}/csv_state.json"
          cp -- private_logger/provider_incident_state.json "${RUNNER_TEMP}/provider_incident_state.json"
          test -s "${RUNNER_TEMP}/price_log.csv"
          test -s "${RUNNER_TEMP}/provider_incident_state.json"

      # ======================================================================
      # SECTION 28 - COMMIT ONLY ALLOWLISTED RUNTIME STATE
      # ======================================================================
      - name: "28.1 Commit production logger state locally"
        id: stage_28_1_commit_production_logger_state_locally
        run: |
          set -euo pipefail
          cp -- private_logger/price_log.csv private_data/price_log.csv
          cp -- private_logger/csv_state.json private_data/csv_state.json
          cp -- private_logger/provider_incident_state.json private_data/provider_incident_state.json
          jq -n \
            --arg source_code_sha "$SOURCE_CODE_SHA" \
            --arg producer_repository "$GITHUB_REPOSITORY" \
            --arg producer_workflow "$GITHUB_WORKFLOW" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg generated_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{version: 1, source_code_sha: $source_code_sha,
              producer_repository: $producer_repository,
              producer_workflow: $producer_workflow,
              producer_run_id: $producer_run_id,
              producer_run_attempt: $producer_run_attempt,
              generated_at_utc: $generated_at_utc}' \
            > private_data/runtime_manifest.json
          cd private_data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- price_log.csv csv_state.json provider_incident_state.json runtime_manifest.json
          UNEXPECTED="$(git diff --name-only | grep -Ev '^(price_log\.csv|csv_state\.json|provider_incident_state\.json|runtime_manifest\.json)$' || true)"
          test -z "$UNEXPECTED" || { echo "❌ Unexpected runtime-data changes detected"; exit 1; }
          git diff --cached --quiet && { echo "❌ No production logger state change detected"; exit 1; }
          git commit -m "Update runtime data for logger run ${GITHUB_RUN_ID}"

      - name: "28.2 Push only the unchanged runtime-data snapshot"
        id: stage_28_2_push_only_the_unchanged_runtime_data_snapshot
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          cd private_data
          STARTING_DATA_SHA="$(git rev-parse HEAD^)"
          for attempt in 1 2 3; do
            echo "Production Git sync attempt ${attempt}/3"
            git fetch origin "$PRIVATE_DATA_BRANCH"
            REMOTE_DATA_SHA="$(git rev-parse "origin/$PRIVATE_DATA_BRANCH")"
            if test "$REMOTE_DATA_SHA" = "$(git rev-parse HEAD)"; then
              echo "Exact production commit is already present remotely"
              rm -f "$ASKPASS"
              exit 0
            fi
            if test "$REMOTE_DATA_SHA" != "$STARTING_DATA_SHA"; then
              echo "❌ Runtime-data changed concurrently; no overwrite attempted"
              exit 1
            fi
            if git push origin "HEAD:$PRIVATE_DATA_BRANCH"; then
              rm -f "$ASKPASS"
              echo "✅ Allowlisted state pushed to private runtime-data"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "❌ Production state push failed"
          exit 1

      # ======================================================================
      # SECTION 29 - VERIFY PRIVATE RUNTIME-DATA PUSH
      # ======================================================================
      - name: "29.1 Verify remote private runtime-data SHA"
        id: verify_core
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          cd private_data
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$PRIVATE_DATA_BRANCH" | awk '{print $1}')"
          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "core_commit_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "source_code_sha=$SOURCE_CODE_SHA" >> "$GITHUB_OUTPUT"
          rm -f "$ASKPASS"
          echo "✅ Exact private runtime-data commit verified"

      - name: "29.2 Persist incident state from an incomplete price batch"
        id: persist_failed_incident
        if: always() && steps.csv_preflight.outcome == 'success' && steps.run_price_logger.outcome == 'failure'
        continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/provider-report.json"
          test -s "$REPORT"
          jq -e '.version == 1 and .overall_severity == "CRITICAL" and
            ((.decisions | type == "object" and length == 11) and
             any(.decisions[]; .accepted_usd == null) or
             (.condition_code == "FX_RATE_CRITICAL" and
              (.decisions | type == "object" and length == 0) and
              .fx_status == "NO_CURRENT_FX_RATE" and
              .fx_decision.status == "NO_CURRENT_FX_RATE" and
              .fx_decision.severity == "CRITICAL" and
              .fx_decision.rate == null and .fx_decision.cached_estimate == false))' "$REPORT" >/dev/null
          jq -e --slurpfile report "$REPORT" '
            .version == 2 and .last_run_at_utc == $report[0].completed_at_utc
          ' private_logger/provider_incident_state.json >/dev/null
          {
            echo "## Price batch rejected"
            echo ""
            echo "No CSV prices from this batch were committed; Neon sync is skipped."
            jq -r 'if .condition_code == "FX_RATE_CRITICAL" then
              "- FX conversion stopped: " + .fx_status + ". Retry state retained."
              else empty end' "$REPORT"
            jq -r '.decisions | to_entries[] | select(.value.accepted_usd == null) |
              "- " + .key + ": " + .value.status + ". " + .value.reason' "$REPORT"
            echo ""
            echo "VPN2 switches: $(jq -r '.network_recovery.switch_count // 0' "$REPORT")."
          } >> "$GITHUB_STEP_SUMMARY"
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          python "private_logger/Crypto Logger-Private Repo/provider_consensus.py" persist-incident \
            --repository private_data \
            --state-file private_logger/provider_incident_state.json \
            --expected-state-file "${RUNNER_TEMP}/provider-state-before.json" \
            --csv-state-file "${RUNNER_TEMP}/provider-csv-state-before.json"
          echo "Incident recorded; incomplete prices were not committed and Neon remains skipped"

      # ======================================================================
      # SECTION 30 - CLASSIFY PRODUCTION ALERT CONDITION
      # ======================================================================
      - name: "30.1 Determine whether human attention is required"
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
          LOGGER_OUTCOME: ${{ steps.run_price_logger.outcome }}
          INCIDENT_CHECKPOINT_OUTCOME: ${{ steps.persist_failed_incident.outcome }}
        run: |
          set +e
          rm -f "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo "VPN_AUTH_RECOVERY_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          [ ! -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] && [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo "VPN_SECRET_UPDATE_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          if [ ! -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] && [ "$JOB_STATUS" = "failure" ]; then
            if [ "$LOGGER_OUTCOME" = "failure" ] && [ "$INCIDENT_CHECKPOINT_OUTCOME" = "success" ]; then
              echo "Incomplete-price incident recorded; provider notification policy handles this failure"
            else
              echo "PRODUCTION_WORKFLOW_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
            fi
          fi
          [ -f "${RUNNER_TEMP}/vpn-alert-type.txt" ] \
            && echo "⚠ Production alert required: $(cat "${RUNNER_TEMP}/vpn-alert-type.txt")" \
            || echo "✅ No production alert required"

      # ======================================================================
      # SECTION 31 - SEND PRIVATE HIGH-PRIORITY ALERT THROUGH MAKE/OUTLOOK
      # ======================================================================
      - name: "31.1 Send production failure or VPN recovery alert"
        id: send_make_alert
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
          ALERT_CHATGPT_CHAT_URL: ${{ secrets.ALERT_CHATGPT_CHAT_URL }}
          ALERT_LOCAL_HELPER_TOKEN: ${{ secrets.ALERT_LOCAL_HELPER_TOKEN }}
          PRODUCTION_COLLECTION_OUTCOME: ${{ steps.run_price_logger.outcome }}
          PRODUCTION_PERSISTENCE_OUTCOME: ${{ steps.verify_core.outcome }}
          CRYPTO_LOGGER_ENVIRONMENT: PRODUCTION
          PRODUCTION_TEST_OUTCOME: ${{ steps.production_regression.outcome }}
          PRODUCTION_STEP_OUTCOMES: >-
            [
              {"name":"01.1 Checkout public production runner","outcome":"${{ steps.stage_01_1_checkout_public_production_runner.outcome }}"},
              {"name":"02.1 Display production run identity","outcome":"${{ steps.stage_02_1_display_production_run_identity.outcome }}"},
              {"name":"03.1 Validate effective private repository tokens","outcome":"${{ steps.stage_03_1_validate_effective_private_repository_tokens.outcome }}"},
              {"name":"04.1 Checkout exact private production source","outcome":"${{ steps.stage_04_1_checkout_exact_private_production_source.outcome }}"},
              {"name":"04.2 Verify and detach immutable private source","outcome":"${{ steps.stage_04_2_verify_and_detach_immutable_private_source.outcome }}"},
              {"name":"04.3 Checkout isolated private runtime-data branch","outcome":"${{ steps.stage_04_3_checkout_isolated_private_runtime_data_branch.outcome }}"},
              {"name":"04.4 Verify runtime-data branch and copy named state","outcome":"${{ steps.stage_04_4_verify_runtime_data_branch_and_copy_named_state.outcome }}"},
              {"name":"05.1 Validate core production logger files","outcome":"${{ steps.stage_05_1_validate_core_production_logger_files.outcome }}"},
              {"name":"05.2 Validate VPN auth recovery helper files","outcome":"${{ steps.stage_05_2_validate_vpn_auth_recovery_helper_files.outcome }}"},
              {"name":"06.1 Setup Python 3.13","outcome":"${{ steps.stage_06_1_setup_python_3_13.outcome }}"},
              {"name":"07.1 Install production logger dependencies","outcome":"${{ steps.stage_07_1_install_production_logger_dependencies.outcome }}"},
              {"name":"08.1 Compile production Python modules","outcome":"${{ steps.stage_08_1_compile_production_python_modules.outcome }}"},
              {"name":"08.2 Run production regression tests","outcome":"${{ steps.production_regression.outcome }}"},
              {"name":"09.1 Validate Binance API secrets","outcome":"${{ steps.stage_09_1_validate_binance_api_secrets.outcome }}"},
              {"name":"09.2 Validate Coinbase read-only API secrets","outcome":"${{ steps.stage_09_2_validate_coinbase_read_only_api_secrets.outcome }}"},
              {"name":"10.1 Validate VPN1 production secrets","outcome":"${{ steps.stage_10_1_validate_vpn1_production_secrets.outcome }}"},
              {"name":"11.1 Validate VPN2 production secrets","outcome":"${{ steps.stage_11_1_validate_vpn2_production_secrets.outcome }}"},
              {"name":"12.1 Check VPN_SECRET_UPDATE_TOKEN","outcome":"${{ steps.stage_12_1_check_vpn_secret_update_token.outcome }}"},
              {"name":"13.1 Check Make webhook alert secrets","outcome":"${{ steps.stage_13_1_check_make_webhook_alert_secrets.outcome }}"},
              {"name":"14.1 Install and verify OpenVPN","outcome":"${{ steps.stage_14_1_install_and_verify_openvpn.outcome }}"},
              {"name":"15.1 Create protected VPN1/VPN2 runtime files","outcome":"${{ steps.stage_15_1_create_protected_vpn1_vpn2_runtime_files.outcome }}"},
              {"name":"16.1 Prepare S2 network runtime boundary","outcome":"${{ steps.stage_16_1_prepare_s2_network_runtime_boundary.outcome }}"},
              {"name":"18.1 Bootstrap managed network and recover VPNBook auth if required","outcome":"${{ steps.vpn_auth_recovery.outcome }}"},
              {"name":"19.1 Verify S2 bootstrap and bounded network state","outcome":"${{ steps.stage_19_1_verify_s2_bootstrap_and_bounded_network_state.outcome }}"},
              {"name":"20.1 Report VPN credential recovery state","outcome":"${{ steps.stage_20_1_report_vpn_credential_recovery_state.outcome }}"},
              {"name":"23.1 Preflight and record production CSV state","outcome":"${{ steps.csv_preflight.outcome }}"},
              {"name":"24.1 Run price_logger.py on managed S2 network","outcome":"${{ steps.run_price_logger.outcome }}"},
              {"name":"24.2 Validate sanitized provider decision report","outcome":"${{ steps.stage_24_2_validate_sanitized_provider_decision_report.outcome }}"},
              {"name":"25.1 Disconnect managed VPN","outcome":"${{ steps.stage_25_1_disconnect_managed_vpn.outcome }}"},
              {"name":"25.2 Verify OpenVPN fully stopped","outcome":"${{ steps.stage_25_2_verify_openvpn_fully_stopped.outcome }}"},
              {"name":"26.1 Validate production CSV schema and new rows","outcome":"${{ steps.stage_26_1_validate_production_csv_schema_and_new_rows.outcome }}"},
              {"name":"27.1 Backup production state before Git operations","outcome":"${{ steps.stage_27_1_backup_production_state_before_git_operations.outcome }}"},
              {"name":"28.1 Commit production logger state locally","outcome":"${{ steps.stage_28_1_commit_production_logger_state_locally.outcome }}"},
              {"name":"28.2 Push only the unchanged runtime-data snapshot","outcome":"${{ steps.stage_28_2_push_only_the_unchanged_runtime_data_snapshot.outcome }}"},
              {"name":"29.1 Verify remote private runtime-data SHA","outcome":"${{ steps.verify_core.outcome }}"},
              {"name":"29.2 Persist incident state from an incomplete price batch","outcome":"${{ steps.persist_failed_incident.outcome }}"}
            ]
        run: |
          set -euo pipefail
          ALERT_FILE="${RUNNER_TEMP}/vpn-alert-type.txt"
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          if [ ! -f "$ALERT_FILE" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "delivery_status=not_required" >> "$GITHUB_OUTPUT"
            echo "No production failure or VPN recovery alert required"
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "delivery_status=pending" >> "$GITHUB_OUTPUT"
          ALERT_TYPE="$(cat "$ALERT_FILE")"
          echo "alert_type=$ALERT_TYPE" >> "$GITHUB_OUTPUT"
          test -s "$NOTIFIER" || { echo "❌ alert_email.py unavailable"; exit 1; }
          test -n "$ALERT_MAKE_WEBHOOK_URL" || { echo "❌ ALERT_MAKE_WEBHOOK_URL missing"; exit 1; }
          test -n "$ALERT_MAKE_API_KEY" || { echo "❌ ALERT_MAKE_API_KEY missing"; exit 1; }
          if timeout --kill-after=5s 45s python "$NOTIFIER" --alert-type "$ALERT_TYPE"; then
            echo "delivery_status=accepted" >> "$GITHUB_OUTPUT"
          else
            echo "delivery_status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Production email unavailable or timed out. GitHub Issue fallback will be attempted; the core data result is unchanged."
          fi

      - name: "31.3 Send deduplicated price-source event alert"
        id: send_provider_alert
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
          ALERT_CHATGPT_CHAT_URL: ${{ secrets.ALERT_CHATGPT_CHAT_URL }}
          ALERT_LOCAL_HELPER_TOKEN: ${{ secrets.ALERT_LOCAL_HELPER_TOKEN }}
          PRODUCTION_COLLECTION_OUTCOME: ${{ steps.run_price_logger.outcome }}
          PRODUCTION_PERSISTENCE_OUTCOME: ${{ steps.verify_core.outcome }}
          CRYPTO_LOGGER_ENVIRONMENT: PRODUCTION
          PROVIDER_EVENT_FILE: ${{ runner.temp }}/provider-event.json
        run: |
          set -euo pipefail
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          if [ ! -s "$PROVIDER_EVENT_FILE" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "delivery_status=not_required" >> "$GITHUB_OUTPUT"
            echo "No new provider incident/severity/recovery email required"
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "delivery_status=pending" >> "$GITHUB_OUTPUT"
          EVENT_TYPE="$(jq -r '.event_type' "$PROVIDER_EVENT_FILE")"
          EVENT_SEVERITY="$(jq -r '.severity' "$PROVIDER_EVENT_FILE")"
          EVENT_ID="$(jq -r '.event_id // empty' "$PROVIDER_EVENT_FILE")"
          EVENT_FINGERPRINT="$(jq -r '.fingerprint // empty' "$PROVIDER_EVENT_FILE")"
          case "$EVENT_TYPE" in
            PRICE_SOURCE_INCIDENT|PRICE_SOURCE_SEVERITY_CHANGED|PRICE_SOURCE_RECOVERED) ;;
            *) echo "❌ Unsupported provider event type: ${EVENT_TYPE}"; exit 1 ;;
          esac
          case "${EVENT_TYPE}:${EVENT_SEVERITY}" in
            PRICE_SOURCE_RECOVERED:RECOVERY|PRICE_SOURCE_INCIDENT:WARNING|PRICE_SOURCE_INCIDENT:CRITICAL|PRICE_SOURCE_SEVERITY_CHANGED:WARNING|PRICE_SOURCE_SEVERITY_CHANGED:CRITICAL) ;;
            *) echo "❌ Unsupported provider event severity"; exit 1 ;;
          esac
          [[ "$EVENT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "❌ Invalid provider event ID"; exit 1; }
          [[ "$EVENT_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || { echo "❌ Invalid provider fingerprint"; exit 1; }
          echo "alert_type=$EVENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "alert_severity=$EVENT_SEVERITY" >> "$GITHUB_OUTPUT"
          echo "event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$EVENT_FINGERPRINT" >> "$GITHUB_OUTPUT"
          if timeout --kill-after=5s 45s python "$NOTIFIER" --alert-type "$EVENT_TYPE"; then
            echo "delivery_status=accepted" >> "$GITHUB_OUTPUT"
          else
            echo "delivery_status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Provider email unavailable or timed out. The event remains pending for retry; GitHub Issue fallback will be attempted. CSV saving and Neon sync remain independent."
          fi

      - name: "31.5 Acknowledge and persist delivered provider event"
        id: ack_provider_alert
        if: always() && (steps.verify_core.outcome == 'success' || steps.persist_failed_incident.outcome == 'success') && steps.send_provider_alert.outputs.required == 'true' && steps.send_provider_alert.outcome == 'success' && steps.send_provider_alert.outputs.delivery_status == 'accepted'
        continue-on-error: true
        timeout-minutes: 1
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PROVIDER_EVENT_FILE: ${{ runner.temp }}/provider-event.json
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          CONSENSUS="private_logger/Crypto Logger-Private Repo/provider_consensus.py"
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          python "$CONSENSUS" persist-incident \
            --repository private_data \
            --state-file private_logger/provider_incident_state.json \
            --expected-state-file private_logger/provider_incident_state.json \
            --csv-state-file private_logger/csv_state.json \
            --acknowledge-event-file "$PROVIDER_EVENT_FILE"
          echo "✅ Provider delivery acknowledged after Make confirmed email-module success (mailbox receipt not verified)"

      - name: "31.6 Report optional notification health"
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          WORKFLOW_EMAIL_STATUS: ${{ steps.send_make_alert.outputs.delivery_status }}
          PROVIDER_EMAIL_STATUS: ${{ steps.send_provider_alert.outputs.delivery_status }}
          WORKFLOW_EMAIL_OUTCOME: ${{ steps.send_make_alert.outcome }}
          PROVIDER_EMAIL_OUTCOME: ${{ steps.send_provider_alert.outcome }}
          PROVIDER_ACK_OUTCOME: ${{ steps.ack_provider_alert.outcome }}
        run: |
          set -euo pipefail
          DEGRADED=false
          for STATUS in "$WORKFLOW_EMAIL_STATUS" "$PROVIDER_EMAIL_STATUS"; do
            case "$STATUS" in
              accepted|not_required) ;;
              *) DEGRADED=true ;;
            esac
          done
          if [ "$WORKFLOW_EMAIL_OUTCOME" = failure ] || [ "$PROVIDER_EMAIL_OUTCOME" = failure ]; then
            DEGRADED=true
          fi
          if [ "$DEGRADED" = true ]; then
            echo "::warning::Optional email delivery is degraded. This does not change CSV or Neon success; see the separate data steps. Check the failed Make scenario execution to repair delivery."
          fi
          if [ "$PROVIDER_EMAIL_STATUS" = accepted ] && [ "${PROVIDER_ACK_OUTCOME:-unavailable}" != success ]; then
            echo "::warning::Provider email was accepted, but its delivery checkpoint was not saved. Duplicate reminders are possible; inspect the acknowledgment step before retrying."
          fi
          {
            echo "## Optional notifications"
            echo "- Production/VPN email: ${WORKFLOW_EMAIL_STATUS:-unavailable}"
            echo "- Provider event email: ${PROVIDER_EMAIL_STATUS:-unavailable}"
            echo "- Provider delivery checkpoint: ${PROVIDER_ACK_OUTCOME:-unavailable}"
            echo "- accepted means Make returned explicit email-module success; it is not proof of mailbox receipt."
            echo "- Failed events remain pending. GitHub Issue fallback is a separate best-effort job."
            echo "- Email and reporting failures do not block verified CSV persistence or Neon sync."
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # SECTION 32 - CREATE PRODUCTION SUCCESS SUMMARY
      # ======================================================================
      - name: "32.1 Create structured production summary"
        if: success()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          REPORT="${RUNNER_TEMP}/provider-report.json"
          CSV_ROWS="$(( $(wc -l < "$CSV") - 1 ))"
          AUTH_RECOVERY="Not needed"
          SECRET_UPDATE="Not needed"

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            AUTH_RECOVERY="Used successfully"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            SECRET_UPDATE="Updated successfully"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            SECRET_UPDATE="Failed - private alert requested"
          fi

          {
            echo "## 🚀 Crypto Logger | Main | Production S2"
            echo ""
            echo "### 1. Run identity"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| Public commit | \`${GITHUB_SHA}\` |"
            echo "| Completed UTC | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
            echo "| Trigger | ${GITHUB_EVENT_NAME} |"
            echo ""
            echo "### 2. Network and recovery"
            echo ""
            echo "- **Managed startup network:** ${STARTUP_NETWORK:-Unknown}"
            echo "- **VPN2 cold-standby profile:** Validated"
            echo "- **VPNBook auth recovery:** ${AUTH_RECOVERY}"
            echo "- **GitHub VPN secret update:** ${SECRET_UPDATE}"
            echo "- **Provider-triggered network recovery:** Enabled"
            echo "- **Successful reconnects:** $(jq -r '.network_recovery.reconnect_count // 0' "$REPORT")"
            echo "- **Reconnect attempts:** $(jq -r '.network_recovery.reconnect_attempt_count // 0' "$REPORT")"
            echo "- **Successful VPN2 switches:** $(jq -r '.network_recovery.switch_count // 0' "$REPORT")"
            echo "- **VPN2 switch attempts:** $(jq -r '.network_recovery.switch_attempt_count // 0' "$REPORT")"
            echo "- **Network after collection:** $(jq -r '.network_recovery.active_network // "unknown"' "$REPORT")"
            echo ""
            echo "### 3. Provider health"
            echo ""
            echo "| Provider path | Result |"
            echo "|---|---|"
            jq -r '.provider_statuses | to_entries | sort_by(.key)[] | "| \(.key) | \(.value) |"' "$REPORT"
            echo ""
            echo "- **Overall source severity:** $(jq -r '.overall_severity' "$REPORT")"
            echo "- **Trading allowed:** $(jq -r '.trading_allowed' "$REPORT")"
            echo "- **FX selection:** $(jq -r '.fx_status' "$REPORT")"
            echo "- **Affected symbols:** $(jq -r '.affected_symbols | join(", ") | if length == 0 then "None" else . end' "$REPORT")"
            echo ""
            echo "### 4. Per-symbol consensus"
            echo ""
            echo "| Symbol | Decision | Confidence | Severity | Sources used |"
            echo "|---|---|---|---|---|"
            jq -r '.decisions | to_entries | sort_by(.key)[] | "| \(.key) | \(.value.status) | \(.value.confidence) | \(.value.severity) | \(.value.used_sources | join(" + ")) |"' "$REPORT"
            echo ""
            echo "### 5. Persistence and downstream state"
            echo ""
            echo "- **Rows appended this run:** 11"
            echo "- **Production CSV data rows (header excluded):** ${CSV_ROWS}"
            echo "- **Neon comparison:** Compare the active dataset generation. Archived generations are counted separately in Neon Audit."
            echo "- **Incident state persisted:** Yes"
            echo "- **Neon handoff:** Runs only after the exact runtime-data commit is verified"
            echo ""
            echo "### 6. Release status"
            echo ""
            echo "- S2 bounded provider recovery and consensus are active in this release."
            echo "- S3 Smart Cache work remains separate and is not enabled by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # SECTION 33 - COLLECT FAILURE DIAGNOSTICS
      # ======================================================================
      - name: "33.1 Collect non-secret production diagnostics"
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set +e
          mkdir -p debug
          {
            echo '{'
            printf '  "run_id": "%s",\n' "$GITHUB_RUN_ID"
            printf '  "run_attempt": "%s",\n' "$GITHUB_RUN_ATTEMPT"
            printf '  "source_code_sha": "%s",\n' "${SOURCE_CODE_SHA:-unavailable}"
            printf '  "vpn_auth_recovered": %s,\n' "$([ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && echo true || echo false)"
            printf '  "vpn_auth_recovery_failed": %s,\n' "$([ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo true || echo false)"
            printf '  "vpn_secret_update_failed": %s\n' "$([ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo true || echo false)"
            echo '}'
          } > debug/diagnostic-summary.json
          if [ -s "${RUNNER_TEMP}/provider-report.json" ]; then
            jq '{version, overall_severity, trading_allowed,
                 affected_symbol_count: (.affected_symbols | length),
                 provider_statuses}' "${RUNNER_TEMP}/provider-report.json" \
              > debug/provider-summary.json || true
          fi
          chmod -R u+rwX,go-rwx debug

      - name: "33.2 Upload production failure diagnostics"
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-crypto-price-logger-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # ======================================================================
      # SECTION 34 - FINAL EPHEMERAL RUNNER CLEANUP
      # ======================================================================
      - name: "34.1 Cleanup temporary production runner data"
        if: always()
        env: *network_env
        run: |
          set +e
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          [ -f "$MANAGER" ] && python "$MANAGER" reset >/dev/null 2>&1 || true
          rm -rf private_logger private_data
          sudo rm -rf debug
          rm -rf "${RUNNER_TEMP}/network-manager"
          rm -rf "${RUNNER_TEMP}/vpn-runtime"
          rm -rf "${RUNNER_TEMP}/csv-recovery"
          rm -f "${RUNNER_TEMP}/vpn-alert-type.txt"
          rm -f "${RUNNER_TEMP}/provider-report.json"
          rm -f "${RUNNER_TEMP}/provider-event.json"
          rm -f "${RUNNER_TEMP}/provider-state-before.json"
          rm -f "${RUNNER_TEMP}/provider-csv-state-before.json"
          rm -f "${RUNNER_TEMP}/coinbase-probe.txt"
          rm -f "${RUNNER_TEMP}/coingecko-probe.txt"
          rm -f "${RUNNER_TEMP}/binance-probe.txt"
          rm -f "${RUNNER_TEMP}/crypto-git-askpass"
          echo "✅ Production runner cleanup completed"

  sync-neon:
    name: Sync exact committed batch to Neon
    needs:
      - validate-invocation
      - run-logger
    if: >-
      always() &&
      needs.validate-invocation.result == 'success' &&
      needs.validate-invocation.outputs.neon_state == 'enabled' &&
      needs.run-logger.outputs.core_commit_sha != '' &&
      needs.run-logger.outputs.source_code_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate exact handoff and database secret
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATA_SHA: ${{ needs.run-logger.outputs.core_commit_sha }}
          SOURCE_SHA: ${{ needs.run-logger.outputs.source_code_sha }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN"
          test -n "$PRIVATE_DATA_TOKEN"
          test -n "$NEON_DATABASE_URL"
          [[ "$DATA_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact committed runtime data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.run-logger.outputs.core_commit_sha }}
          path: private_data
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact source used by the logger
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.run-logger.outputs.source_code_sha }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify manifest and assemble exact sync workspace
        env:
          DATA_SHA: ${{ needs.run-logger.outputs.core_commit_sha }}
          SOURCE_SHA: ${{ needs.run-logger.outputs.source_code_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private_data rev-parse HEAD)" = "$DATA_SHA"
          test "$(git -C private_source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r '.source_code_sha' private_data/runtime_manifest.json)" = "$SOURCE_SHA"
          test "$(jq -r '.producer_run_id' private_data/runtime_manifest.json)" = "$GITHUB_RUN_ID"
          cp -- private_data/price_log.csv private_source/price_log.csv
          cp -- private_data/csv_state.json private_source/csv_state.json
          echo "✅ Logger source and committed data handoff match exactly"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: private_source/Crypto Logger-Private Repo/requirements.lock

      - name: Install locked private dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r "private_source/Crypto Logger-Private Repo/requirements.lock"
          python -m pip check

      - name: Run exact one-way Neon sync
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd private_source
          python "Neon Sync/sync_to_neon.py"

      - name: Publish sanitized Neon handoff summary
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DATA_SHA: ${{ needs.run-logger.outputs.core_commit_sha }}
          SOURCE_SHA: ${{ needs.run-logger.outputs.source_code_sha }}
        run: |
          {
            echo "## Neon exact handoff"
            echo "- Runtime-data commit: \`$DATA_SHA\`"
            echo "- Private source commit: \`$SOURCE_SHA\`"
            echo "- No CSV rows, database URL, or provider credentials were printed or uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup private handoff workspaces
        if: always()
        run: rm -rf private_data private_source

  fallback-issues:
    name: Trusted GitHub Issue fallback
    needs:
      - validate-invocation
      - run-logger
      - sync-neon
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # retain the workflow-wide read-only source permission
      issues: write # create or update sanitized alert-delivery fallback issues
    steps:
      - name: "31.2 Create or update trusted Issue if workflow alert delivery fails"
        id: workflow_fallback
        if: >-
          always() && (
          needs.validate-invocation.result == 'failure' || needs.validate-invocation.result == 'cancelled' ||
          needs.run-logger.result == 'failure' || needs.run-logger.result == 'cancelled' ||
          needs.sync-neon.result == 'failure' || needs.sync-neon.result == 'cancelled' ||
          needs.run-logger.outputs.alert_delivery_failed == 'true' ||
          needs.run-logger.outputs.provider_ack_failed == 'true')
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LOGGER_ALERT_TYPE: ${{ needs.run-logger.outputs.alert_type }}
          DELIVERY_ERROR: ${{ needs.run-logger.outputs.alert_delivery_error }}
          EMAIL_FAILED: ${{ needs.run-logger.outputs.alert_delivery_failed }}
          CORE_VERIFICATION: ${{ needs.run-logger.outputs.core_verification }}
          WORKFLOW_EMAIL_STATUS: ${{ needs.run-logger.outputs.workflow_email_status }}
          LOGGER_RESULT: ${{ needs.run-logger.result }}
          SYNC_RESULT: ${{ needs.sync-neon.result }}
          VALIDATION_RESULT: ${{ needs.validate-invocation.result }}
          PROVIDER_ACK_FAILED: ${{ needs.run-logger.outputs.provider_ack_failed }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const label = "crypto-alert-fallback";
            const interrupted = value => ["failure", "cancelled"].includes(value);
            const alertType = interrupted(process.env.VALIDATION_RESULT)
              ? "PRODUCTION_VALIDATION_FAILED"
              : interrupted(process.env.LOGGER_RESULT)
                ? (process.env.LOGGER_ALERT_TYPE || "PRODUCTION_WORKFLOW_FAILED")
                : interrupted(process.env.SYNC_RESULT)
                  ? "NEON_SYNC_FAILED"
                  : process.env.PROVIDER_ACK_FAILED === "true"
                    ? "PROVIDER_DELIVERY_CHECKPOINT_FAILED"
                    : (process.env.LOGGER_ALERT_TYPE || "PRODUCTION_WORKFLOW_FAILED");
            const fingerprint = crypto.createHash("sha256")
              .update(`workflow:${alertType}`)
              .digest("hex").slice(0, 24);
            const marker = `<!-- crypto-alert-fallback:${fingerprint} -->`;
            const title = process.env.EMAIL_FAILED === "true"
              ? "🚨 Crypto Logger alert delivery failed"
              : `🚨 Crypto Logger ${alertType}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "b60205",
                description: "Trusted fallback created by the production alert workflow"
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label, per_page: 100
            });
            const trustedAuthors = new Set(["github-actions[bot]", owner.toLowerCase()]);
            const existing = issues.find(issue =>
              !issue.pull_request &&
              trustedAuthors.has((issue.user?.login || "").toLowerCase()) &&
              issue.labels.some(item => (item.name || item) === label) &&
              (issue.body || "").includes(marker)
            );
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const deliveryHelp = {
              MAKE_EMAIL_AUTH_INVALID_GRANT: "Make reported invalid_grant: reauthorize Email send connection in Credentials > Connections, then verify it.",
              MAKE_WEBHOOK_AUTH_REJECTED: "Make rejected webhook authentication: check the configured webhook/API key without exposing either value.",
              MAKE_DELIVERY_UNCONFIRMED: 'No explicit email-module success was received. Inspect Make history before retrying: mail may already have been sent. Verify that the final Webhook response returns {"ok":true} only after the email module succeeds.',
              MAKE_HTTP_ERROR: "Make returned an HTTP error. Inspect the failed scenario execution for the exact cause; HTTP 500 alone does not prove an OAuth or VPN problem.",
              MAKE_NETWORK_ERROR: "The delivery request could not connect or was interrupted. Inspect Make availability, runner connectivity and Make history before retrying; mail may already have been sent.",
              MAKE_TIMEOUT: "The email scenario did not confirm success before the timeout. Check its execution before retrying to avoid duplicates."
            };
            const deliveryDiagnosis = interrupted(process.env.VALIDATION_RESULT)
              ? "Production validation did not complete. The logger and email steps were not reached. Inspect the validation job's first failed or cancelled step."
              : process.env.EMAIL_FAILED !== "true" && process.env.PROVIDER_ACK_FAILED === "true"
                ? "Provider email was accepted, but its delivery checkpoint was not saved. Inspect the acknowledgment step before retrying."
              : process.env.EMAIL_FAILED !== "true" && process.env.WORKFLOW_EMAIL_STATUS === "accepted"
              ? "The workflow email received an explicit success acknowledgment; this issue records a core job failure."
              : process.env.EMAIL_FAILED !== "true" && process.env.WORKFLOW_EMAIL_STATUS === "not_required"
                ? "No workflow email was required at the earlier notification stage; this issue records the later core job failure."
                : deliveryHelp[process.env.DELIVERY_ERROR] || "Delivery was not confirmed. Check the notifier step and Make execution history; missing configuration or a timeout may have prevented sending.";
            const status = value => ["success", "failure", "skipped", "cancelled"].includes(value) ? value : "unknown";
            const evidence = [
              `- **Production validation:** ${status(process.env.VALIDATION_RESULT)}`,
              `- **Logger job:** ${status(process.env.LOGGER_RESULT)}`,
              `- **CSV commit verification:** ${status(process.env.CORE_VERIFICATION)}`,
              `- **Neon sync job:** ${status(process.env.SYNC_RESULT)}`,
              "- Email failure alone does not imply that CSV saving, Neon, or VPN failed.",
              `- **Delivery diagnosis:** ${deliveryDiagnosis}`,
              ...(process.env.PROVIDER_ACK_FAILED === "true" ? ["- **Provider delivery checkpoint:** Email was accepted, but the delivery record was not saved. Inspect the acknowledgment step; repeated delivery is possible."] : []),
              "- **Make history:** https://us2.make.com/2723330/scenarios/5967130/logs",
              "- If Make history says invalid_grant, reauthorize Email send connection and use Verify. A GitHub restart cannot renew that OAuth grant.",
              "- After repair, use an authorized alert test or the next real notification and confirm the email-module result and mailbox receipt before relying on email alerts."
            ];
            const reminder = [
              `Production incident requires attention: **${alertType}**.`,
              ...evidence,
              `Run: ${runUrl}`,
              `Attempt: ${process.env.GITHUB_RUN_ATTEMPT || "unknown"}`
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: reminder
              });
              core.warning(`Updated trusted fallback issue #${existing.number}`);
              return;
            }
            const body = [
              marker,
              "## Crypto Logger incident and notification status",
              "",
              `- **Alert type:** ${alertType}`,
              `- **Run:** ${runUrl}`,
              "",
              ...evidence,
              "For a core job failure, open its first failed step. No credential value is included here."
            ].join("\n");
            const created = await github.rest.issues.create({
              owner, repo, title, body, labels: [label]
            });
            core.warning(`Created trusted fallback issue #${created.data.number}`);

      - name: "31.4 Create or update trusted Issue if provider delivery fails"
        id: provider_fallback
        if: always() && needs.run-logger.outputs.provider_alert_delivery_failed == 'true'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ALERT_TYPE: ${{ needs.run-logger.outputs.provider_alert_type }}
          ALERT_SEVERITY: ${{ needs.run-logger.outputs.provider_alert_severity }}
          ALERT_EVENT_ID: ${{ needs.run-logger.outputs.provider_alert_event_id }}
          ALERT_FINGERPRINT: ${{ needs.run-logger.outputs.provider_alert_fingerprint }}
          DELIVERY_ERROR: ${{ needs.run-logger.outputs.provider_alert_delivery_error }}
          CORE_VERIFICATION: ${{ needs.run-logger.outputs.core_verification }}
          WORKFLOW_EMAIL_STATUS: ${{ needs.run-logger.outputs.workflow_email_status }}
          LOGGER_RESULT: ${{ needs.run-logger.result }}
          SYNC_RESULT: ${{ needs.sync-neon.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const label = "crypto-alert-fallback";
            const eventType = process.env.ALERT_TYPE || "unknown";
            const severity = process.env.ALERT_SEVERITY || "unknown";
            const eventId = process.env.ALERT_EVENT_ID || "missing-event-id";
            const eventFingerprint = process.env.ALERT_FINGERPRINT || eventId;
            const fingerprint = crypto.createHash("sha256")
              .update(`provider:${eventFingerprint}`)
              .digest("hex").slice(0, 24);
            const marker = `<!-- crypto-alert-fallback:${fingerprint} -->`;
            const title = "🚨 Crypto Logger provider alert delivery failed";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "b60205",
                description: "Trusted fallback created by the production alert workflow"
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label, per_page: 100
            });
            const trustedAuthors = new Set(["github-actions[bot]", owner.toLowerCase()]);
            const existing = issues.find(issue =>
              !issue.pull_request &&
              trustedAuthors.has((issue.user?.login || "").toLowerCase()) &&
              issue.labels.some(item => (item.name || item) === label) &&
              (issue.body || "").includes(marker)
            );
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const deliveryHelp = {
              MAKE_EMAIL_AUTH_INVALID_GRANT: "Make reported invalid_grant: reauthorize Email send connection in Credentials > Connections, then verify it.",
              MAKE_WEBHOOK_AUTH_REJECTED: "Make rejected webhook authentication: check the configured webhook/API key without exposing either value.",
              MAKE_DELIVERY_UNCONFIRMED: 'No explicit email-module success was received. Inspect Make history before retrying: mail may already have been sent. Verify that the final Webhook response returns {"ok":true} only after the email module succeeds.',
              MAKE_HTTP_ERROR: "Make returned an HTTP error. Inspect the failed scenario execution for the exact cause; HTTP 500 alone does not prove an OAuth or VPN problem.",
              MAKE_NETWORK_ERROR: "The delivery request could not connect or was interrupted. Inspect Make availability, runner connectivity and Make history before retrying; mail may already have been sent.",
              MAKE_TIMEOUT: "The email scenario did not confirm success before the timeout. Check its execution before retrying to avoid duplicates."
            };
            const deliveryDiagnosis = deliveryHelp[process.env.DELIVERY_ERROR] || "Delivery was not confirmed. Check the notifier step and Make execution history; missing configuration or a timeout may have prevented sending.";
            const status = value => ["success", "failure", "skipped", "cancelled"].includes(value) ? value : "unknown";
            const evidence = [
              `- **Logger job:** ${status(process.env.LOGGER_RESULT)}`,
              `- **CSV commit verification:** ${status(process.env.CORE_VERIFICATION)}`,
              `- **Neon sync job:** ${status(process.env.SYNC_RESULT)}`,
              "- Email failure alone does not imply that CSV saving, Neon, or VPN failed.",
              `- **Delivery diagnosis:** ${deliveryDiagnosis}`,
              "- **Make history:** https://us2.make.com/2723330/scenarios/5967130/logs",
              "- If Make history says invalid_grant, reauthorize Email send connection and use Verify. A GitHub restart cannot renew that OAuth grant.",
              "- After repair, use an authorized alert test or the next real notification and confirm the email-module result and mailbox receipt before relying on email alerts."
            ];
            const reminder = [`Provider alert delivery remains unconfirmed. Event: **${eventType}**; severity: **${severity}**; run: ${runUrl}`, ...evidence].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: reminder
              });
              core.warning(`Updated trusted provider fallback issue #${existing.number}`);
              return;
            }
            const body = [
              marker,
              "## Provider alert delivery failure",
              "",
              `- **Event:** ${eventType}`,
              `- **Severity:** ${severity}`,
              `- **Run:** ${runUrl}`,
              "",
              ...evidence,
              "The event remains pending in private runtime state for a later eligible retry with the same event ID. No provider API secret is included."
            ].join("\n");
            const created = await github.rest.issues.create({
              owner, repo, title, body, labels: [label]
            });
            core.warning(`Created trusted provider fallback issue #${created.data.number}`);

      - name: "31.7 Verify fallback reporting health"
        if: always()
        timeout-minutes: 1
        env:
          WORKFLOW_FALLBACK_OUTCOME: ${{ steps.workflow_fallback.outcome }}
          PROVIDER_FALLBACK_OUTCOME: ${{ steps.provider_fallback.outcome }}
        run: |
          set -euo pipefail
          FAILED=false
          for OUTCOME in "$WORKFLOW_FALLBACK_OUTCOME" "$PROVIDER_FALLBACK_OUTCOME"; do
            case "$OUTCOME" in
              success|skipped) ;;
              *) FAILED=true ;;
            esac
          done
          {
            echo "## Alert fallback health"
            echo "- Workflow issue: ${WORKFLOW_FALLBACK_OUTCOME:-unavailable}"
            echo "- Provider issue: ${PROVIDER_FALLBACK_OUTCOME:-unavailable}"
            echo "- success means the issue/comment was saved; it does not prove a GitHub notification was received."
            if [ "$FAILED" = true ]; then
              echo "- ACTION REQUIRED: An incident could not be recorded in GitHub Issues. Inspect the failed fallback step and repository Issues permissions/API availability."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" = true ]; then
            echo "::error::Alert fallback failed. Email may also be unavailable; inspect notification and fallback steps. Completed CSV and Neon jobs retain their separate results."
            exit 1
          fi
