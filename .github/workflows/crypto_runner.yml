name: Crypto Price Logger
run-name: "🧪 STAGING | ${{ github.event_name }} | ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

# ============================================================
# STAGING S1 NETWORK QUALIFICATION + AUTH SELF-HEALING
# - Public staging reads/writes private staging.
# - network_manager.py owns VPN process lifecycle.
# - S1 self-test proves VPN1 + VPN2 independently connect.
# - Stored VPNBook credentials are tried first.
# - AUTH_FAILED triggers one live credential refresh from the
#   official VPNBook OpenVPN page, immediate masking and one retry.
# - If live credentials work, the workflow can persist them back
#   to GitHub Actions secrets using VPN_SECRET_UPDATE_TOKEN.
# - Auth recovery failure triggers a high-priority custom email
#   when SMTP alert secrets are configured.
# - Provider-triggered automatic VPN switching is NOT wired yet.
# - Production main and Neon remain untouched.
# ============================================================

concurrency:
  group: crypto-price-logger-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🧪 CRYPTO PRICE LOGGER - STAGING S1"
          echo "============================================================"
          echo "UTC time: $(date -u)"
          echo "Public branch: ${GITHUB_REF_NAME}"
          echo "Public commit: ${GITHUB_SHA}"
          uname -a
          pwd
          df -h .

      - name: Check private repository token
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo "❌ PRIVATE_REPO_TOKEN missing"
            exit 1
          }
          echo "✅ PRIVATE_REPO_TOKEN exists"

      - name: Clone private crypto logger
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REPOSITORY_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          for attempt in 1 2 3
          do
            echo "Clone attempt ${attempt}/3"
            rm -rf private_logger

            if git clone \
              --branch "$TARGET_BRANCH" \
              --single-branch \
              "$REPOSITORY_URL" \
              private_logger
            then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Private repository clone failed"
              exit 1
            fi

            sleep 5
          done

          cd private_logger
          ACTUAL_BRANCH="$(git branch --show-current)"

          if [ "$ACTUAL_BRANCH" != "$TARGET_BRANCH" ]; then
            echo "❌ Wrong private branch checked out"
            exit 1
          fi

          git log -1 --oneline
          git status --short

      - name: Validate private repository structure
        run: |
          set -euo pipefail
          LOGGER_DIRECTORY="private_logger/Crypto Logger-Private Repo"

          for required in \
            "$LOGGER_DIRECTORY/price_logger.py" \
            "$LOGGER_DIRECTORY/network_manager.py" \
            "$LOGGER_DIRECTORY/vpnbook_credentials.py" \
            "$LOGGER_DIRECTORY/github_secret_updater.py" \
            "$LOGGER_DIRECTORY/alert_email.py" \
            "$LOGGER_DIRECTORY/requirements.txt"
          do
            test -s "$required" || {
              echo "❌ Missing or empty: $required"
              exit 1
            }
          done

          test -f private_logger/price_log.csv || {
            echo "❌ price_log.csv missing"
            exit 1
          }

          echo "✅ Private staging structure is valid"
          find "$LOGGER_DIRECTORY" -maxdepth 1 -type f | sort

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check required core secrets
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          VPN1_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail

          check_secret() {
            local name="$1"
            local value="$2"
            test -n "$value" || {
              echo "❌ ${name} missing"
              exit 1
            }
            echo "✅ ${name} exists"
          }

          check_secret "BINANCE_API_KEY" "$BINANCE_API_KEY"
          check_secret "BINANCE_SECRET_KEY" "$BINANCE_SECRET_KEY"
          check_secret "VPNBOOK_CONFIG / VPN1_CONFIG" "$VPN1_CONFIG"
          check_secret "VPNBOOK_USERNAME / VPN1_USERNAME" "$VPN1_USERNAME"
          check_secret "VPNBOOK_PASSWORD / VPN1_PASSWORD" "$VPN1_PASSWORD"
          check_secret "VPN2_CONFIG" "$VPN2_CONFIG"
          check_secret "VPN2_USERNAME" "$VPN2_USERNAME"
          check_secret "VPN2_PASSWORD" "$VPN2_PASSWORD"

      - name: Check optional self-healing and alert secrets
        env:
          SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
          SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          SECOND_RECIPIENT: ${{ secrets.ALERT_EMAIL_TO_2 }}
        run: |
          set -euo pipefail

          if [ -n "$SECRET_UPDATE_TOKEN" ]; then
            echo "✅ VPN_SECRET_UPDATE_TOKEN configured"
          else
            echo "⚠ VPN_SECRET_UPDATE_TOKEN not configured; live credentials can be used for the run but cannot be persisted"
          fi

          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "✅ SMTP alert credentials configured"
          else
            echo "⚠ SMTP alert credentials are not fully configured; custom email alerts will be skipped"
          fi

          if [ -n "$SECOND_RECIPIENT" ]; then
            echo "✅ Second alert recipient configured"
          else
            echo "ℹ Second alert recipient not configured; dulnasavin@outlook.com remains the default recipient"
          fi

      - name: Install OpenVPN
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version | head -n 1
          sudo -n true
          echo "✅ OpenVPN and passwordless sudo available"

      - name: Create VPN1 and VPN2 files
        env:
          VPN1_CONFIG_SECRET: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
          VPN2_CONFIG_SECRET: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s\n' "$VPN1_CONFIG_SECRET" > vpn1.ovpn
          printf '%s\n%s\n' "$VPN1_USERNAME" "$VPN1_PASSWORD" > vpn1-auth.txt
          printf '%s\n' "$VPN2_CONFIG_SECRET" > vpn2.ovpn
          printf '%s\n%s\n' "$VPN2_USERNAME" "$VPN2_PASSWORD" > vpn2-auth.txt

          chmod 600 vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt
          test -s vpn1.ovpn
          test -s vpn1-auth.txt
          test -s vpn2.ovpn
          test -s vpn2-auth.txt
          echo "✅ VPN1 and VPN2 files created securely"

      - name: Validate Python syntax
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python -m py_compile \
            price_logger.py \
            network_manager.py \
            vpnbook_credentials.py \
            github_secret_updater.py \
            alert_email.py
          echo "✅ Python syntax valid"

      - name: Reset S1 network state
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          python "$MANAGER" reset
          echo "✅ Network state reset"

      - name: Validate complete S1 network configuration
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"

          python "$MANAGER" validate-all
          python "$MANAGER" policy --error-type RATE_LIMIT
          python "$MANAGER" policy --error-type NETWORK_ERROR
          python "$MANAGER" policy --error-type SERVER_ERROR
          python "$MANAGER" policy --error-type AUTH_ERROR

          echo "✅ S1 configuration and policy map validated"

      - name: Self-test VPN1 and VPN2 with live auth recovery
        id: vpn_auth
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail

          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          CREDENTIAL_HELPER="private_logger/Crypto Logger-Private Repo/vpnbook_credentials.py"
          SELF_TEST="${RUNNER_TEMP}/s1-self-test.json"

          rm -f \
            "${RUNNER_TEMP}/vpn-auth-recovered" \
            "${RUNNER_TEMP}/vpn-auth-recovery-failed"

          echo "Trying stored VPN credentials first..."

          set +e
          python "$MANAGER" self-test | tee "$SELF_TEST"
          FIRST_RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$FIRST_RESULT" -eq 0 ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "✅ Stored VPN credentials accepted"
            exit 0
          fi

          if [ "$FIRST_RESULT" -ne 20 ]; then
            echo "❌ S1 failed for a non-authentication reason; live credential recovery will not run"
            exit "$FIRST_RESULT"
          fi

          echo "⚠ Stored VPN credentials were rejected with AUTH_FAILED"
          echo "Fetching current credentials from the official VPNBook OpenVPN page..."

          python "$CREDENTIAL_HELPER" \
            --auth-file "${GITHUB_WORKSPACE}/vpn1-auth.txt" \
            --auth-file "${GITHUB_WORKSPACE}/vpn2-auth.txt"

          touch "${RUNNER_TEMP}/vpn-auth-recovered"

          echo "Retrying complete VPN1/VPN2 self-test once with masked live credentials..."

          set +e
          python "$MANAGER" self-test | tee "$SELF_TEST"
          RETRY_RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RETRY_RESULT" -ne 0 ]; then
            touch "${RUNNER_TEMP}/vpn-auth-recovery-failed"
            echo "❌ Live VPNBook credentials also failed the S1 self-test"
            exit "$RETRY_RESULT"
          fi

          grep -q '"passed": true' "$SELF_TEST"
          grep -q '"different_public_ips": true' "$SELF_TEST"

          echo "recovered=true" >> "$GITHUB_OUTPUT"
          echo "✅ Live VPNBook credential recovery succeeded"
          echo "✅ VPN1 and VPN2 independently connected with different exit IPs"

      - name: Persist recovered VPN credentials to GitHub secrets
        id: persist_vpn_auth
        if: steps.vpn_auth.outputs.recovered == 'true'
        continue-on-error: true
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          UPDATER="private_logger/Crypto Logger-Private Repo/github_secret_updater.py"

          if [ -z "$VPN_SECRET_UPDATE_TOKEN" ]; then
            echo "⚠ VPN_SECRET_UPDATE_TOKEN missing"
            touch "${RUNNER_TEMP}/vpn-secret-update-failed"
            exit 0
          fi

          if python "$UPDATER" \
            --repository "$GITHUB_REPOSITORY" \
            --auth-file "${GITHUB_WORKSPACE}/vpn1-auth.txt" \
            --update-vpn2
          then
            touch "${RUNNER_TEMP}/vpn-secret-update-success"
            echo "✅ GitHub VPN secrets refreshed after successful live authentication"
          else
            touch "${RUNNER_TEMP}/vpn-secret-update-failed"
            echo "⚠ Live credentials worked, but GitHub secret persistence failed"
            exit 1
          fi

      - name: Reconnect VPN1 for logger collection
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          STATUS_FILE="${RUNNER_TEMP}/network-manager-status.json"

          python "$MANAGER" reset
          python "$MANAGER" connect --network VPN1
          python "$MANAGER" status | tee "$STATUS_FILE"

          grep -q '"active_network": "VPN1"' "$STATUS_FILE"
          grep -q '"running": true' "$STATUS_FILE"
          grep -q '"switch_count": 0' "$STATUS_FILE"

          echo "✅ Clean VPN1 session ready for logger"

      - name: Test CoinGecko connectivity on VPN1
        run: |
          set -euo pipefail
          HTTP_CODE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${RUNNER_TEMP}/coingecko-probe.txt" \
              --write-out "%{http_code}" \
              https://api.coingecko.com/api/v3/ping
          )"
          echo "CoinGecko HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"

      - name: Test Binance connectivity on VPN1
        run: |
          set -euo pipefail
          HTTP_CODE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${RUNNER_TEMP}/binance-probe.txt" \
              --write-out "%{http_code}" \
              https://api.binance.com/api/v3/time
          )"
          echo "Binance HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"

      - name: Show logger file information
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          ls -lh \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/vpnbook_credentials.py" \
            "$LOGGER_DIR/github_secret_updater.py" \
            "$LOGGER_DIR/alert_email.py"
          wc -l \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/vpnbook_credentials.py" \
            "$LOGGER_DIR/github_secret_updater.py" \
            "$LOGGER_DIR/alert_email.py"

      - name: Record CSV state before logger
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          echo "$BEFORE_ROWS" > "${RUNNER_TEMP}/csv_rows_before.txt"
          echo "CSV rows before logger: $BEFORE_ROWS"

      - name: Run crypto price logger
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          echo "============================================================"
          echo "🧪 STARTING STAGING CRYPTO PRICE LOGGER"
          echo "UTC time: $(date -u)"
          echo "============================================================"
          python price_logger.py
          echo "✅ STAGING CRYPTO PRICE LOGGER COMPLETED"

      - name: Disconnect VPN before GitHub operations
        if: always()
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set +e
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"

          if [ -f "$MANAGER" ]; then
            python "$MANAGER" reset
          fi

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "Applying final emergency OpenVPN cleanup"
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "❌ OpenVPN still running"
            sudo pgrep -a openvpn || true
            exit 1
          fi

          echo "✅ VPN disconnected before Git/GitHub traffic"

      - name: Check generated CSV
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          test -s "$CSV" || {
            echo "❌ price_log.csv missing or empty"
            exit 1
          }
          ls -lh "$CSV"
          wc -l "$CSV"
          head -n 1 "$CSV"
          tail -n 12 "$CSV"

      - name: Validate CSV header
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"
          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"

          if [ "$ACTUAL_HEADER" != "$EXPECTED_HEADER" ]; then
            echo "❌ CSV header is incorrect"
            echo "Expected: $EXPECTED_HEADER"
            echo "Actual:   $ACTUAL_HEADER"
            exit 1
          fi

          echo "✅ CSV header is correct"

      - name: Validate CSV row count
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(cat "${RUNNER_TEMP}/csv_rows_before.txt")"
          AFTER_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          ADDED_ROWS="$((AFTER_ROWS - BEFORE_ROWS))"

          echo "CSV rows before: $BEFORE_ROWS"
          echo "CSV rows after:  $AFTER_ROWS"
          echo "Rows added:      $ADDED_ROWS"

          if [ "$ADDED_ROWS" -le 0 ]; then
            echo "❌ Logger produced no new CSV rows"
            exit 1
          fi

          echo "✅ CSV contains new staging data"

      - name: Create CSV safety backup
        run: |
          set -euo pipefail
          cp -- private_logger/price_log.csv "${RUNNER_TEMP}/price_log.csv"
          test -s "${RUNNER_TEMP}/price_log.csv"
          echo "✅ CSV safety backup created"

      - name: Save CSV to private repository
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          cd private_logger

          CSV="price_log.csv"
          BACKUP_CSV="${RUNNER_TEMP}/price_log.csv"
          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          git config user.name "github-actions-staging"
          git config user.email "actions@github.com"
          git add -- price_log.csv

          if git diff --cached --quiet; then
            echo "❌ No CSV change detected"
            exit 1
          fi

          git diff --cached --stat
          git commit -m "STAGING test price log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          for attempt in 1 2 3
          do
            echo "Git synchronisation attempt ${attempt}/3"
            git fetch origin "$TARGET_BRANCH"

            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              cp -- "$BACKUP_CSV" "$CSV"
              echo "❌ Rebase conflict"
              exit 1
            fi

            if git push "$REMOTE_URL" "HEAD:${TARGET_BRANCH}"; then
              echo "✅ CSV pushed successfully"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "❌ CSV push failed after 3 attempts"
          exit 1

      - name: Verify private branch push
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          cd private_logger

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote "$REMOTE_URL" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"

          echo "Local SHA:  $LOCAL_SHA"
          echo "Remote SHA: $REMOTE_SHA"
          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "✅ Remote staging push verified"

      - name: Send standout VPN auth recovery alert
        if: always()
        continue-on-error: true
        env:
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: dulnasavin@outlook.com
          ALERT_EMAIL_TO_2: ${{ secrets.ALERT_EMAIL_TO_2 }}
        run: |
          set +e

          ALERT="private_logger/Crypto Logger-Private Repo/alert_email.py"

          [ -f "$ALERT" ] || exit 0

          NEED_ALERT="false"
          ALERT_TYPE=""

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ]; then
            NEED_ALERT="true"
            ALERT_TYPE="VPN AUTH RECOVERY FAILED"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            NEED_ALERT="true"
            ALERT_TYPE="VPN CREDENTIALS USED BUT SECRET UPDATE FAILED"
          fi

          if [ "$NEED_ALERT" != "true" ]; then
            echo "No VPN credential alert required"
            exit 0
          fi

          if [ -z "$ALERT_SMTP_USERNAME" ] || [ -z "$ALERT_SMTP_PASSWORD" ]; then
            echo "⚠ SMTP alert credentials missing; custom email could not be sent"
            exit 0
          fi

          SUBJECT="🚨 CRYPTO LOGGER | ${ALERT_TYPE} | STAGING | Run #${GITHUB_RUN_NUMBER}"

          BODY="CRITICAL CRYPTO LOGGER NETWORK ALERT

Environment: STAGING
Repository: ${GITHUB_REPOSITORY}
Branch: ${GITHUB_REF_NAME}
Workflow run: #${GITHUB_RUN_NUMBER}
Run ID: ${GITHUB_RUN_ID}
UTC time: $(date -u)

What happened:
Stored VPNBook credentials were rejected or the recovered credentials could not be persisted safely.

Automatic recovery attempted:
1. Detected VPN authentication failure.
2. Contacted the official VPNBook OpenVPN page.
3. Retrieved current public VPNBook credentials.
4. Masked username/password in GitHub logs.
5. Retried the complete VPN1/VPN2 network qualification once.
6. Attempted GitHub secret refresh only after successful live authentication.

Security:
The VPN password is NOT included in this email, workflow summary, or debug output.

Action:
Open GitHub Actions and review the staging workflow run and debug artifact.
Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

This alert is intentionally more specific than GitHub's generic workflow-failed notification."

          python "$ALERT" \
            --subject "$SUBJECT" \
            --body "$BODY"

      - name: Create logger summary
        if: success()
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          DATA_ROWS="$((CSV_ROWS - 1))"
          LATEST_TIMESTAMP="$(tail -n 1 "$CSV" | cut -d',' -f1)"

          AUTH_RECOVERY="Not needed"
          SECRET_REFRESH="Not needed"

          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            AUTH_RECOVERY="Used successfully"
          fi

          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            SECRET_REFRESH="Updated successfully"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            SECRET_REFRESH="Failed - alert requested"
          fi

          {
            echo "## 🧪 Crypto Price Logger - STAGING S1"
            echo ""
            echo "- **Workflow:** Successful"
            echo "- **S1 network manager:** Passed"
            echo "- **VPN1 live connection:** Passed"
            echo "- **VPN2 live connection:** Passed"
            echo "- **VPN1/VPN2 different public IPs:** Passed"
            echo "- **VPNBook auth recovery:** ${AUTH_RECOVERY}"
            echo "- **GitHub VPN secret refresh:** ${SECRET_REFRESH}"
            echo "- **Normal logger collection network:** VPN1"
            echo "- **Automatic provider-triggered VPN2 switching:** Not enabled yet"
            echo "- **Maximum future VPN switches per run:** 1"
            echo "- **CSV total rows:** ${CSV_ROWS}"
            echo "- **CSV data rows:** ${DATA_ROWS}"
            echo "- **Latest timestamp:** ${LATEST_TIMESTAMP}"
            echo "- **Git/GitHub traffic after VPN:** Yes"
            echo "- **Production main:** Untouched"
            echo "- **Neon writes:** Disabled"
            echo "- **Completed UTC:** $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare debug files if failed
        if: failure()
        run: |
          set +e
          mkdir -p debug

          [ -f private_logger/price_log.csv ] && cp private_logger/price_log.csv debug/price_log.csv
          [ -f "${RUNNER_TEMP}/coingecko-probe.txt" ] && cp "${RUNNER_TEMP}/coingecko-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/binance-probe.txt" ] && cp "${RUNNER_TEMP}/binance-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/network-manager-status.json" ] && cp "${RUNNER_TEMP}/network-manager-status.json" debug/
          [ -f "${RUNNER_TEMP}/s1-self-test.json" ] && cp "${RUNNER_TEMP}/s1-self-test.json" debug/

          if [ -d "${RUNNER_TEMP}/network-manager" ]; then
            cp -R "${RUNNER_TEMP}/network-manager" debug/network-manager-state 2>/dev/null || true
          fi

          {
            echo "UTC time: $(date -u)"
            echo "Public branch: ${GITHUB_REF_NAME}"
            echo "Auth recovery marker: $([ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && echo yes || echo no)"
            echo "Auth recovery failure marker: $([ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo yes || echo no)"
            echo "Secret update failure marker: $([ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo yes || echo no)"
            echo "OpenVPN processes:"
            sudo pgrep -a openvpn || true
            echo "Network interfaces:"
            ip addr show || true
            echo "IPv4 routes:"
            ip route show || true
            echo "DNS status:"
            resolvectl status 2>/dev/null || cat /etc/resolv.conf || true
          } > debug/network-diagnostics.txt

          sudo chown -R "$(id -u):$(id -g)" debug
          chmod -R u+rwX,go+rX debug
          find debug -maxdepth 3 -type f -ls || true

      - name: Upload debug files if failed
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: staging-crypto-price-logger-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup runner
        if: always()
        run: |
          set +e

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

          rm -rf private_logger
          sudo rm -rf debug
          rm -rf "${RUNNER_TEMP}/network-manager"

          sudo rm -f vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt
          echo "✅ Runner cleaned"
