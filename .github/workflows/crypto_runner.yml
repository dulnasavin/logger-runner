name: Crypto Price Logger
run-name: "🧪 STAGING S1 | ${{ github.event_name }} | ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

# ============================================================================
# CRYPTO PRICE LOGGER - STAGING S1
# NETWORK QUALIFICATION + VPNBOOK AUTHENTICATION SELF-HEALING
# ============================================================================
#
# CORE ARCHITECTURE
#
# crypto_runner.yml
#   |
#   +--> Crypto Logger-Private Repo/network_manager.py
#   |
#   +--> Crypto Logger-Private Repo/vpn_auth_recovery/
#   |      |
#   |      +--> vpn_auth_recovery_controller.py
#   |      +--> vpnbook_live_credential_fetcher.py
#   |      +--> github_actions_secret_rotator.py
#   |      +--> workflow_failure_email_notifier.py
#   |
#   +--> Crypto Logger-Private Repo/price_logger.py
#
# SAFETY RULES
# - Main branch is untouched by this staging workflow.
# - Stored VPN credentials are attempted first.
# - Only AUTH_FAILED triggers live VPNBook credential recovery.
# - Live credentials come only from the official VPNBook OpenVPN page.
# - Username/password are masked before reuse.
# - Recovery gets exactly one full VPN1/VPN2 retry.
# - VPN1 and VPN2 must produce different public IP addresses.
# - GitHub Actions secrets rotate only after live credentials prove valid.
# - Secret-rotation failure does not kill an already recovered logger run.
# - Recovery failure stops the workflow.
# - Alert recipients are private GitHub secrets.
# - Provider-triggered VPN switching is not yet enabled in S1.
# - Neon writes remain disabled in staging.
# ============================================================================

concurrency:
  group: crypto-price-logger-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================================
      # SECTION 01 - CHECKOUT PUBLIC RUNNER REPOSITORY
      # ======================================================================
      - name: "01.1 Checkout public runner repository"
        uses: actions/checkout@v6

      # ======================================================================
      # SECTION 02 - DISPLAY WORKFLOW RUN IDENTITY
      # ======================================================================
      - name: "02.1 Display staging run identity"
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🧪 CRYPTO PRICE LOGGER - STAGING S1"
          echo "============================================================"
          echo "UTC time:        $(date -u)"
          echo "Public branch:   ${GITHUB_REF_NAME}"
          echo "Public commit:   ${GITHUB_SHA}"
          echo "Workflow:        ${GITHUB_WORKFLOW}"
          echo "Run number:      ${GITHUB_RUN_NUMBER}"
          echo "Run ID:          ${GITHUB_RUN_ID}"
          echo "Run attempt:     ${GITHUB_RUN_ATTEMPT}"
          echo "Repository:      ${GITHUB_REPOSITORY}"
          echo "Runner OS:       ${RUNNER_OS}"
          echo "============================================================"
          uname -a
          pwd
          df -h .

      # ======================================================================
      # SECTION 03 - VALIDATE PRIVATE REPOSITORY ACCESS TOKEN
      # ======================================================================
      - name: "03.1 Validate PRIVATE_REPO_TOKEN"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || {
            echo "❌ PRIVATE_REPO_TOKEN is missing"
            exit 1
          }
          echo "✅ PRIVATE_REPO_TOKEN is configured"

      # ======================================================================
      # SECTION 04 - CLONE MATCHING PRIVATE STAGING BRANCH
      # ======================================================================
      - name: "04.1 Clone private logger staging branch"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REPOSITORY_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"

          for attempt in 1 2 3
          do
            echo "Private clone attempt ${attempt}/3"
            rm -rf private_logger

            if git clone \
              --branch "$TARGET_BRANCH" \
              --single-branch \
              "$REPOSITORY_URL" \
              private_logger
            then
              echo "✅ Private repository clone completed"
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Private repository clone failed after 3 attempts"
              exit 1
            fi

            sleep 5
          done

      - name: "04.2 Verify private branch alignment"
        run: |
          set -euo pipefail
          cd private_logger
          ACTUAL_BRANCH="$(git branch --show-current)"

          echo "Expected branch: ${GITHUB_REF_NAME}"
          echo "Actual branch:   ${ACTUAL_BRANCH}"

          test "$ACTUAL_BRANCH" = "$GITHUB_REF_NAME" || {
            echo "❌ Public/private branch mismatch"
            exit 1
          }

          git log -1 --oneline
          git status --short
          echo "✅ Public and private branches are aligned"

      # ======================================================================
      # SECTION 05 - VALIDATE PRIVATE LOGGER DIRECTORY STRUCTURE
      # ======================================================================
      - name: "05.1 Validate required private logger files"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          RECOVERY_DIR="${LOGGER_DIR}/vpn_auth_recovery"

          for required in \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py" \
            "$LOGGER_DIR/requirements.txt" \
            "$RECOVERY_DIR/__init__.py" \
            "$RECOVERY_DIR/vpn_auth_recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_live_credential_fetcher.py" \
            "$RECOVERY_DIR/github_actions_secret_rotator.py" \
            "$RECOVERY_DIR/workflow_failure_email_notifier.py"
          do
            test -s "$required" || {
              echo "❌ Required file missing or empty: $required"
              exit 1
            }
            echo "✅ Found: $required"
          done

          test -f private_logger/price_log.csv || {
            echo "❌ private_logger/price_log.csv is missing"
            exit 1
          }

      - name: "05.2 Display private logger module tree"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          echo "Core modules:"
          find "$LOGGER_DIR" -maxdepth 1 -type f | sort
          echo ""
          echo "VPN authentication recovery modules:"
          find "$LOGGER_DIR/vpn_auth_recovery" -maxdepth 1 -type f | sort

      # ======================================================================
      # SECTION 06 - SET UP PYTHON RUNTIME
      # ======================================================================
      - name: "06.1 Setup Python 3.13"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "06.2 Display Python runtime information"
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          which python

      # ======================================================================
      # SECTION 07 - INSTALL AND VERIFY PYTHON DEPENDENCIES
      # ======================================================================
      - name: "07.1 Install private logger dependencies"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "07.2 Validate dependency consistency"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          python -m pip check
          echo "✅ Python dependency check passed"

      # ======================================================================
      # SECTION 08 - STATIC-COMPILE ALL PRIVATE PYTHON MODULES
      # ======================================================================
      - name: "08.1 Compile core logger modules"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          python -m py_compile \
            "$LOGGER_DIR/price_logger.py" \
            "$LOGGER_DIR/network_manager.py"
          echo "✅ Core logger modules compile"

      - name: "08.2 Compile VPN authentication recovery modules"
        run: |
          set -euo pipefail
          RECOVERY_DIR="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery"
          python -m py_compile \
            "$RECOVERY_DIR/vpn_auth_recovery_controller.py" \
            "$RECOVERY_DIR/vpnbook_live_credential_fetcher.py" \
            "$RECOVERY_DIR/github_actions_secret_rotator.py" \
            "$RECOVERY_DIR/workflow_failure_email_notifier.py"
          echo "✅ VPN authentication recovery modules compile"

      # ======================================================================
      # SECTION 09 - VALIDATE CORE PRICE-LOGGER SECRETS
      # ======================================================================
      - name: "09.1 Validate Binance secrets"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo "❌ BINANCE_API_KEY missing"; exit 1; }
          test -n "$BINANCE_SECRET_KEY" || { echo "❌ BINANCE_SECRET_KEY missing"; exit 1; }
          echo "✅ Binance secrets configured"

      # ======================================================================
      # SECTION 10 - VALIDATE VPN1 STORED SECRETS
      # ======================================================================
      - name: "10.1 Validate VPN1 stored configuration and credentials"
        env:
          VPN1_CONFIG: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN1_CONFIG" || { echo "❌ VPNBOOK_CONFIG missing"; exit 1; }
          test -n "$VPN1_USERNAME" || { echo "❌ VPNBOOK_USERNAME missing"; exit 1; }
          test -n "$VPN1_PASSWORD" || { echo "❌ VPNBOOK_PASSWORD missing"; exit 1; }
          echo "✅ VPN1 stored secrets configured"

      # ======================================================================
      # SECTION 11 - VALIDATE VPN2 STORED SECRETS
      # ======================================================================
      - name: "11.1 Validate VPN2 configuration and credentials"
        env:
          VPN2_CONFIG: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPN2_CONFIG" || { echo "❌ VPN2_CONFIG missing"; exit 1; }
          test -n "$VPN2_USERNAME" || { echo "❌ VPN2_USERNAME missing"; exit 1; }
          test -n "$VPN2_PASSWORD" || { echo "❌ VPN2_PASSWORD missing"; exit 1; }
          echo "✅ VPN2 stored secrets configured"

      # ======================================================================
      # SECTION 12 - VALIDATE OPTIONAL VPN SECRET-ROTATION CAPABILITY
      # ======================================================================
      - name: "12.1 Check VPN_SECRET_UPDATE_TOKEN"
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$VPN_SECRET_UPDATE_TOKEN" ]; then
            echo "✅ VPN secret-rotation token configured"
          else
            echo "⚠ VPN_SECRET_UPDATE_TOKEN missing"
            echo "   Live auth recovery may still work for this run, but refreshed credentials cannot be persisted."
          fi

      # ======================================================================
      # SECTION 13 - VALIDATE PRIVATE EMAIL ALERT CONFIGURATION
      # ======================================================================
      - name: "13.1 Check SMTP authentication secrets"
        env:
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ALERT_SMTP_USERNAME" ] && [ -n "$ALERT_SMTP_PASSWORD" ]; then
            echo "✅ SMTP authentication secrets configured"
          else
            echo "⚠ SMTP authentication secrets incomplete"
          fi

      - name: "13.2 Check private email-recipient secrets"
        env:
          ALERT_EMAIL_TO_PRIMARY: ${{ secrets.ALERT_EMAIL_TO_PRIMARY }}
          ALERT_EMAIL_TO_SECONDARY: ${{ secrets.ALERT_EMAIL_TO_SECONDARY }}
        run: |
          set -euo pipefail
          if [ -n "$ALERT_EMAIL_TO_PRIMARY" ]; then
            echo "✅ Primary private alert recipient configured"
          else
            echo "⚠ ALERT_EMAIL_TO_PRIMARY missing"
          fi

          if [ -n "$ALERT_EMAIL_TO_SECONDARY" ]; then
            echo "✅ Secondary private alert recipient configured"
          else
            echo "⚠ ALERT_EMAIL_TO_SECONDARY missing"
          fi

      # ======================================================================
      # SECTION 14 - INSTALL OPENVPN
      # ======================================================================
      - name: "14.1 Install OpenVPN package"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: "14.2 Verify OpenVPN and passwordless sudo"
        run: |
          set -euo pipefail
          openvpn --version | head -n 1
          sudo -n true
          echo "✅ OpenVPN and passwordless sudo available"

      # ======================================================================
      # SECTION 15 - CREATE PROTECTED VPN RUNTIME FILES
      # ======================================================================
      - name: "15.1 Create protected VPN1 runtime files"
        env:
          VPN1_CONFIG_SECRET: ${{ secrets.VPNBOOK_CONFIG }}
          VPN1_USERNAME: ${{ secrets.VPNBOOK_USERNAME }}
          VPN1_PASSWORD: ${{ secrets.VPNBOOK_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPN1_CONFIG_SECRET" > vpn1.ovpn
          printf '%s\n%s\n' "$VPN1_USERNAME" "$VPN1_PASSWORD" > vpn1-auth.txt
          chmod 600 vpn1.ovpn vpn1-auth.txt
          test -s vpn1.ovpn
          test -s vpn1-auth.txt
          echo "✅ VPN1 protected runtime files created"

      - name: "15.2 Create protected VPN2 runtime files"
        env:
          VPN2_CONFIG_SECRET: ${{ secrets.VPN2_CONFIG }}
          VPN2_USERNAME: ${{ secrets.VPN2_USERNAME }}
          VPN2_PASSWORD: ${{ secrets.VPN2_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPN2_CONFIG_SECRET" > vpn2.ovpn
          printf '%s\n%s\n' "$VPN2_USERNAME" "$VPN2_PASSWORD" > vpn2-auth.txt
          chmod 600 vpn2.ovpn vpn2-auth.txt
          test -s vpn2.ovpn
          test -s vpn2-auth.txt
          echo "✅ VPN2 protected runtime files created"

      # ======================================================================
      # SECTION 16 - RESET NETWORK-MANAGER RUNTIME STATE
      # ======================================================================
      - name: "16.1 Reset network-manager state and switch counter"
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          python "$MANAGER" reset
          echo "✅ Network-manager runtime state reset"

      # ======================================================================
      # SECTION 17 - VALIDATE NETWORK-MANAGER CONFIGURATION
      # ======================================================================
      - name: "17.1 Validate both VPN profiles and local dependencies"
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          python "$MANAGER" validate-all
          echo "✅ VPN1/VPN2 profile validation passed"

      # ======================================================================
      # SECTION 18 - VALIDATE FUTURE NETWORK ERROR POLICY MAP
      # ======================================================================
      - name: "18.1 Validate RATE_LIMIT policy"
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" policy --error-type RATE_LIMIT

      - name: "18.2 Validate NETWORK_ERROR policy"
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" policy --error-type NETWORK_ERROR

      - name: "18.3 Validate SERVER_ERROR policy"
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" policy --error-type SERVER_ERROR

      - name: "18.4 Validate AUTH_ERROR policy"
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" policy --error-type AUTH_ERROR

      # ======================================================================
      # SECTION 19 - RUN VPN AUTHENTICATION RECOVERY CONTROLLER
      # ======================================================================
      # The controller performs these internal stages:
      # A1 Stored VPN credential test
      # A2 AUTH_FAILED-only live credential retrieval
      # A3 One complete VPN1/VPN2 retry
      # A4 Optional GitHub Actions secret rotation
      # ======================================================================
      - name: "19.1 Run full VPN1/VPN2 auth self-healing qualification"
        id: vpn_auth_recovery
        env:
          VPN_SECRET_UPDATE_TOKEN: ${{ secrets.VPN_SECRET_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          CONTROLLER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/vpn_auth_recovery_controller.py"

          python "$CONTROLLER" \
            --state-dir "${RUNNER_TEMP}/network-manager" \
            --vpn1-config "${GITHUB_WORKSPACE}/vpn1.ovpn" \
            --vpn1-auth "${GITHUB_WORKSPACE}/vpn1-auth.txt" \
            --vpn2-config "${GITHUB_WORKSPACE}/vpn2.ovpn" \
            --vpn2-auth "${GITHUB_WORKSPACE}/vpn2-auth.txt" \
            --self-test-output "${RUNNER_TEMP}/s1-self-test.json" \
            --recovered-marker "${RUNNER_TEMP}/vpn-auth-recovered" \
            --recovery-failed-marker "${RUNNER_TEMP}/vpn-auth-recovery-failed" \
            --secret-update-success-marker "${RUNNER_TEMP}/vpn-secret-update-success" \
            --secret-update-failed-marker "${RUNNER_TEMP}/vpn-secret-update-failed" \
            --repository "$GITHUB_REPOSITORY" \
            --persist-secrets \
            --update-vpn2-secrets

      # ======================================================================
      # SECTION 20 - VERIFY S1 VPN SELF-TEST RESULT FILE
      # ======================================================================
      - name: "20.1 Verify S1 self-test result exists"
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/s1-self-test.json" || {
            echo "❌ S1 self-test result missing or empty"
            exit 1
          }
          cat "${RUNNER_TEMP}/s1-self-test.json"

      - name: "20.2 Verify VPN1 and VPN2 both passed"
        run: |
          set -euo pipefail
          grep -q '"passed": true' "${RUNNER_TEMP}/s1-self-test.json"
          echo "✅ Complete S1 VPN qualification passed"

      - name: "20.3 Verify VPN1 and VPN2 use different public IPs"
        run: |
          set -euo pipefail
          grep -q '"different_public_ips": true' "${RUNNER_TEMP}/s1-self-test.json"
          echo "✅ VPN1 and VPN2 proved independent public exit IPs"

      # ======================================================================
      # SECTION 21 - REPORT AUTH-RECOVERY OUTCOME
      # ======================================================================
      - name: "21.1 Report whether live VPNBook recovery was needed"
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ]; then
            echo "⚠ Stored VPN credentials expired/rejected; live VPNBook recovery was used"
          else
            echo "✅ Stored VPN credentials remained valid; no live recovery was needed"
          fi

      - name: "21.2 Report GitHub secret-rotation outcome"
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ]; then
            echo "✅ Recovered VPN credentials were persisted to GitHub Actions secrets"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            echo "⚠ VPN recovered for this run but GitHub secret rotation failed"
          else
            echo "ℹ No VPN secret rotation was required"
          fi

      # ======================================================================
      # SECTION 22 - ESTABLISH CLEAN VPN1 COLLECTION SESSION
      # ======================================================================
      - name: "22.1 Reset after S1 qualification"
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" reset
          echo "✅ S1 test state cleared"

      - name: "22.2 Connect fresh VPN1 collection session"
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" connect --network VPN1
          echo "✅ Fresh VPN1 connection established"

      # ======================================================================
      # SECTION 23 - VERIFY ACTIVE VPN1 COLLECTION SESSION
      # ======================================================================
      - name: "23.1 Verify network-manager active state"
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set -euo pipefail
          STATUS_FILE="${RUNNER_TEMP}/network-manager-status.json"
          python "private_logger/Crypto Logger-Private Repo/network_manager.py" status | tee "$STATUS_FILE"
          grep -q '"active_network": "VPN1"' "$STATUS_FILE"
          grep -q '"running": true' "$STATUS_FILE"
          grep -q '"switch_count": 0' "$STATUS_FILE"
          echo "✅ Network manager confirms clean VPN1 collection session"

      # ======================================================================
      # SECTION 24 - COINGECKO CONNECTIVITY PROBE
      # ======================================================================
      - name: "24.1 Test CoinGecko API through VPN1"
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --output "${RUNNER_TEMP}/coingecko-probe.txt" \
            --write-out "%{http_code}" \
            https://api.coingecko.com/api/v3/ping)"
          echo "CoinGecko HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
          echo "✅ CoinGecko VPN1 probe passed"

      # ======================================================================
      # SECTION 25 - BINANCE CONNECTIVITY PROBE
      # ======================================================================
      - name: "25.1 Test Binance API through VPN1"
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --output "${RUNNER_TEMP}/binance-probe.txt" \
            --write-out "%{http_code}" \
            https://api.binance.com/api/v3/time)"
          echo "Binance HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
          echo "✅ Binance VPN1 probe passed"

      # ======================================================================
      # SECTION 26 - DISPLAY CORE MODULE METADATA
      # ======================================================================
      - name: "26.1 Display core logger file metadata"
        run: |
          set -euo pipefail
          LOGGER_DIR="private_logger/Crypto Logger-Private Repo"
          ls -lh "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"
          wc -l "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"
          sha256sum "$LOGGER_DIR/price_logger.py" "$LOGGER_DIR/network_manager.py"

      # ======================================================================
      # SECTION 27 - DISPLAY AUTH-RECOVERY MODULE METADATA
      # ======================================================================
      - name: "27.1 Display VPN auth recovery module metadata"
        run: |
          set -euo pipefail
          RECOVERY_DIR="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery"
          ls -lh "$RECOVERY_DIR"/*.py
          wc -l "$RECOVERY_DIR"/*.py
          sha256sum "$RECOVERY_DIR"/*.py

      # ======================================================================
      # SECTION 28 - RECORD CSV STATE BEFORE LOGGER EXECUTION
      # ======================================================================
      - name: "28.1 Record CSV row count before logger"
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          echo "$BEFORE_ROWS" > "${RUNNER_TEMP}/csv_rows_before.txt"
          echo "CSV rows before logger: $BEFORE_ROWS"

      # ======================================================================
      # SECTION 29 - EXECUTE CRYPTO PRICE LOGGER
      # ======================================================================
      - name: "29.1 Run price_logger.py on verified VPN1"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd private_logger/"Crypto Logger-Private Repo"
          echo "============================================================"
          echo "🧪 STARTING STAGING CRYPTO PRICE LOGGER"
          echo "UTC time: $(date -u)"
          echo "============================================================"
          python price_logger.py
          echo "============================================================"
          echo "✅ STAGING CRYPTO PRICE LOGGER COMPLETED"
          echo "UTC time: $(date -u)"
          echo "============================================================"

      # ======================================================================
      # SECTION 30 - DISCONNECT VPN BEFORE GITHUB/GIT TRAFFIC
      # ======================================================================
      - name: "30.1 Disconnect managed VPN session"
        if: always()
        env:
          NETWORK_MANAGER_STATE_DIR: ${{ runner.temp }}/network-manager
          VPN1_CONFIG: ${{ github.workspace }}/vpn1.ovpn
          VPN1_AUTH_FILE: ${{ github.workspace }}/vpn1-auth.txt
          VPN2_CONFIG_FILE: ${{ github.workspace }}/vpn2.ovpn
          VPN2_AUTH_FILE: ${{ github.workspace }}/vpn2-auth.txt
        run: |
          set +e
          MANAGER="private_logger/Crypto Logger-Private Repo/network_manager.py"
          if [ -f "$MANAGER" ]; then
            python "$MANAGER" reset
          fi

      - name: "30.2 Verify no OpenVPN process remains"
        if: always()
        run: |
          set +e
          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "⚠ Managed disconnect left OpenVPN running; using emergency cleanup"
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            echo "❌ OpenVPN still running after emergency cleanup"
            sudo pgrep -a openvpn || true
            exit 1
          fi

          echo "✅ VPN fully disconnected before Git/GitHub traffic"

      # ======================================================================
      # SECTION 31 - VALIDATE GENERATED CSV FILE
      # ======================================================================
      - name: "31.1 Verify price_log.csv exists and is non-empty"
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          test -s "$CSV" || { echo "❌ price_log.csv missing or empty"; exit 1; }
          ls -lh "$CSV"

      - name: "31.2 Validate price_log.csv header"
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          EXPECTED_HEADER="timestamp_nz,symbol,price_usd,price_nzd,status,usd_nzd_rate"
          ACTUAL_HEADER="$(head -n 1 "$CSV" | tr -d '\r')"
          test "$ACTUAL_HEADER" = "$EXPECTED_HEADER" || {
            echo "❌ CSV header mismatch"
            echo "Expected: $EXPECTED_HEADER"
            echo "Actual:   $ACTUAL_HEADER"
            exit 1
          }
          echo "✅ CSV header valid"

      - name: "31.3 Verify logger added new CSV rows"
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          BEFORE_ROWS="$(cat "${RUNNER_TEMP}/csv_rows_before.txt")"
          AFTER_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          ADDED_ROWS="$((AFTER_ROWS - BEFORE_ROWS))"
          echo "Rows before: $BEFORE_ROWS"
          echo "Rows after:  $AFTER_ROWS"
          echo "Rows added:  $ADDED_ROWS"
          test "$ADDED_ROWS" -gt 0 || { echo "❌ Logger produced no new CSV rows"; exit 1; }
          echo "✅ Logger added new CSV rows"

      - name: "31.4 Display latest CSV rows"
        run: |
          set -euo pipefail
          tail -n 12 private_logger/price_log.csv

      # ======================================================================
      # SECTION 32 - CREATE CSV SAFETY BACKUP
      # ======================================================================
      - name: "32.1 Create temporary CSV safety backup"
        run: |
          set -euo pipefail
          cp -- private_logger/price_log.csv "${RUNNER_TEMP}/price_log.csv"
          test -s "${RUNNER_TEMP}/price_log.csv"
          echo "✅ CSV safety backup created"

      # ======================================================================
      # SECTION 33 - COMMIT CSV TO PRIVATE STAGING
      # ======================================================================
      - name: "33.1 Commit generated CSV change locally"
        run: |
          set -euo pipefail
          cd private_logger
          git config user.name "github-actions-staging"
          git config user.email "actions@github.com"
          git add -- price_log.csv

          if git diff --cached --quiet; then
            echo "❌ No CSV change detected for commit"
            exit 1
          fi

          git diff --cached --stat
          git commit -m "STAGING test price log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git log -1 --oneline

      # ======================================================================
      # SECTION 34 - REBASE AND PUSH PRIVATE STAGING CSV
      # ======================================================================
      - name: "34.1 Rebase and push private staging branch"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REMOTE_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          cd private_logger

          for attempt in 1 2 3
          do
            echo "Git synchronisation attempt ${attempt}/3"
            git fetch origin "$TARGET_BRANCH"

            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              cp -- "${RUNNER_TEMP}/price_log.csv" price_log.csv
              echo "❌ Rebase conflict detected"
              exit 1
            fi

            if git push "$REMOTE_URL" "HEAD:${TARGET_BRANCH}"; then
              echo "✅ Private staging push succeeded"
              exit 0
            fi

            [ "$attempt" -lt 3 ] && sleep 5
          done

          echo "❌ Private staging push failed after 3 attempts"
          exit 1

      # ======================================================================
      # SECTION 35 - VERIFY REMOTE PRIVATE STAGING SHA
      # ======================================================================
      - name: "35.1 Verify remote branch matches pushed commit"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          REMOTE_URL="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git"
          cd private_logger
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote "$REMOTE_URL" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          echo "Local SHA:  $LOCAL_SHA"
          echo "Remote SHA: $REMOTE_SHA"
          test -n "$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "✅ Remote private staging SHA verified"

      # ======================================================================
      # SECTION 36 - SEND PRIVATE HIGH-PRIORITY RECOVERY ALERT WHEN NEEDED
      # ======================================================================
      - name: "36.1 Determine whether VPN recovery alert is required"
        if: always()
        run: |
          set +e
          if [ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ]; then
            echo "VPN_AUTH_RECOVERY_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          elif [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ]; then
            echo "VPN_SECRET_ROTATION_FAILED" > "${RUNNER_TEMP}/vpn-alert-type.txt"
          fi

      - name: "36.2 Send standout private VPN recovery email alert"
        if: always()
        continue-on-error: true
        env:
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO_PRIMARY: ${{ secrets.ALERT_EMAIL_TO_PRIMARY }}
          ALERT_EMAIL_TO_SECONDARY: ${{ secrets.ALERT_EMAIL_TO_SECONDARY }}
        run: |
          set +e
          ALERT_FILE="${RUNNER_TEMP}/vpn-alert-type.txt"
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/workflow_failure_email_notifier.py"

          [ -f "$ALERT_FILE" ] || { echo "No VPN recovery email required"; exit 0; }
          [ -f "$NOTIFIER" ] || { echo "⚠ Email notifier module unavailable"; exit 0; }

          ALERT_TYPE="$(cat "$ALERT_FILE")"

          if [ -z "$ALERT_SMTP_USERNAME" ] || \
             [ -z "$ALERT_SMTP_PASSWORD" ] || \
             [ -z "$ALERT_EMAIL_TO_PRIMARY" ]; then
            echo "⚠ Private SMTP/email alert configuration incomplete"
            exit 0
          fi

          if [ "$ALERT_TYPE" = "VPN_AUTH_RECOVERY_FAILED" ]; then
            SUBJECT="🚨 CRYPTO LOGGER CRITICAL | VPN AUTH RECOVERY FAILED | STAGING | Run #${GITHUB_RUN_NUMBER}"
            EVENT_DESCRIPTION="Stored VPNBook credentials were rejected and the live VPNBook recovery path also failed. The logger run could not safely continue."
            ACTION_REQUIRED="Review the VPN authentication logs and debug artifact immediately."
          else
            SUBJECT="⚠️ CRYPTO LOGGER ACTION REQUIRED | VPN RECOVERED BUT SECRET ROTATION FAILED | STAGING | Run #${GITHUB_RUN_NUMBER}"
            EVENT_DESCRIPTION="Live VPNBook credentials successfully recovered VPN access for this run, but GitHub Actions secrets could not be rotated. A future run may fail again when stored credentials are reused."
            ACTION_REQUIRED="Review VPN_SECRET_UPDATE_TOKEN permissions and the secret-rotation logs."
          fi

          BODY="CRYPTO LOGGER - DEDICATED NETWORK RECOVERY ALERT

SEVERITY
${ALERT_TYPE}

RUN IDENTITY
Environment: STAGING
Repository: ${GITHUB_REPOSITORY}
Branch: ${GITHUB_REF_NAME}
Workflow: ${GITHUB_WORKFLOW}
Run number: #${GITHUB_RUN_NUMBER}
Run ID: ${GITHUB_RUN_ID}
Run attempt: ${GITHUB_RUN_ATTEMPT}
UTC time: $(date -u)

WHAT HAPPENED
${EVENT_DESCRIPTION}

AUTOMATIC RECOVERY PIPELINE
1. Stored VPN1/VPN2 credentials were tried first.
2. AUTH_FAILED was separated from network/server/provider failures.
3. The official VPNBook OpenVPN page was queried only after AUTH_FAILED.
4. Retrieved credentials were validated and immediately masked.
5. VPN1 and VPN2 were retried exactly once.
6. GitHub Actions secret rotation was attempted only after successful live authentication.

SECURITY CONTROLS
- VPN username/password are not included in this email.
- Recipient addresses are stored as GitHub Actions secrets.
- Credential values are not intentionally copied into debug artifacts.

ACTION REQUIRED
${ACTION_REQUIRED}

GITHUB ACTIONS RUN
https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

This dedicated Crypto Logger alert is intentionally different from generic GitHub workflow-failure notifications."

          python "$NOTIFIER" --subject "$SUBJECT" --body "$BODY"

      # ======================================================================
      # SECTION 37 - CREATE DETAILED SUCCESS SUMMARY
      # ======================================================================
      - name: "37.1 Create structured staging success summary"
        if: success()
        run: |
          set -euo pipefail
          CSV="private_logger/price_log.csv"
          CSV_ROWS="$(wc -l < "$CSV" | tr -d ' ')"
          DATA_ROWS="$((CSV_ROWS - 1))"
          LATEST_TIMESTAMP="$(tail -n 1 "$CSV" | cut -d',' -f1)"
          AUTH_RECOVERY="Not needed"
          SECRET_ROTATION="Not needed"

          [ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && AUTH_RECOVERY="Used successfully"
          [ -f "${RUNNER_TEMP}/vpn-secret-update-success" ] && SECRET_ROTATION="Updated successfully"
          [ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && SECRET_ROTATION="Failed - private alert requested"

          {
            echo "## 🧪 Crypto Price Logger - STAGING S1"
            echo ""
            echo "### S1 VPN qualification"
            echo "- Network Manager validation: **Passed**"
            echo "- VPN1 live connection: **Passed**"
            echo "- VPN2 live connection: **Passed**"
            echo "- Different public IP requirement: **Passed**"
            echo ""
            echo "### VPNBook authentication self-healing"
            echo "- Live auth recovery: **${AUTH_RECOVERY}**"
            echo "- GitHub secret rotation: **${SECRET_ROTATION}**"
            echo ""
            echo "### Provider probes"
            echo "- CoinGecko through VPN1: **Passed**"
            echo "- Binance through VPN1: **Passed**"
            echo ""
            echo "### Price logger"
            echo "- Collection network: **VPN1**"
            echo "- Provider-triggered VPN2 switching: **Not enabled in S1**"
            echo "- Maximum future VPN switches per run: **1**"
            echo "- CSV total rows: **${CSV_ROWS}**"
            echo "- CSV data rows: **${DATA_ROWS}**"
            echo "- Latest timestamp: **${LATEST_TIMESTAMP}**"
            echo ""
            echo "### Safety"
            echo "- VPN disconnected before Git/GitHub traffic: **Yes**"
            echo "- Production main modified: **No**"
            echo "- Neon writes: **Disabled**"
            echo "- Completed UTC: **$(date -u)**"
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # SECTION 38 - PREPARE FAILURE DIAGNOSTICS
      # ======================================================================
      - name: "38.1 Collect non-secret debug diagnostics"
        if: failure()
        run: |
          set +e
          mkdir -p debug

          [ -f private_logger/price_log.csv ] && cp private_logger/price_log.csv debug/price_log.csv
          [ -f "${RUNNER_TEMP}/coingecko-probe.txt" ] && cp "${RUNNER_TEMP}/coingecko-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/binance-probe.txt" ] && cp "${RUNNER_TEMP}/binance-probe.txt" debug/
          [ -f "${RUNNER_TEMP}/network-manager-status.json" ] && cp "${RUNNER_TEMP}/network-manager-status.json" debug/
          [ -f "${RUNNER_TEMP}/s1-self-test.json" ] && cp "${RUNNER_TEMP}/s1-self-test.json" debug/

          if [ -d "${RUNNER_TEMP}/network-manager" ]; then
            cp -R "${RUNNER_TEMP}/network-manager" debug/network-manager-state 2>/dev/null || true
          fi

          {
            echo "UTC time: $(date -u)"
            echo "Public branch: ${GITHUB_REF_NAME}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo ""
            echo "Recovery markers:"
            echo "vpn_auth_recovered=$([ -f "${RUNNER_TEMP}/vpn-auth-recovered" ] && echo yes || echo no)"
            echo "vpn_auth_recovery_failed=$([ -f "${RUNNER_TEMP}/vpn-auth-recovery-failed" ] && echo yes || echo no)"
            echo "vpn_secret_rotation_success=$([ -f "${RUNNER_TEMP}/vpn-secret-update-success" ] && echo yes || echo no)"
            echo "vpn_secret_rotation_failed=$([ -f "${RUNNER_TEMP}/vpn-secret-update-failed" ] && echo yes || echo no)"
            echo ""
            echo "OpenVPN processes:"
            sudo pgrep -a openvpn || true
            echo ""
            echo "Network interfaces:"
            ip addr show || true
            echo ""
            echo "IPv4 routes:"
            ip route show || true
            echo ""
            echo "DNS status:"
            resolvectl status 2>/dev/null || cat /etc/resolv.conf || true
          } > debug/network-diagnostics.txt

          sudo chown -R "$(id -u):$(id -g)" debug
          chmod -R u+rwX,go+rX debug
          find debug -maxdepth 3 -type f -ls || true

      # ======================================================================
      # SECTION 39 - UPLOAD FAILURE DEBUG ARTIFACT
      # ======================================================================
      - name: "39.1 Upload staging failure diagnostics"
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: staging-crypto-price-logger-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # ======================================================================
      # SECTION 40 - FINAL EPHEMERAL RUNNER CLEANUP
      # ======================================================================
      - name: "40.1 Terminate any remaining OpenVPN process"
        if: always()
        run: |
          set +e
          if sudo pgrep -x openvpn >/dev/null 2>&1; then
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 2
          fi

      - name: "40.2 Remove temporary repositories, state and credentials"
        if: always()
        run: |
          set +e
          rm -rf private_logger
          sudo rm -rf debug
          rm -rf "${RUNNER_TEMP}/network-manager"
          rm -f "${RUNNER_TEMP}/vpn-alert-type.txt"
          sudo rm -f vpn1.ovpn vpn1-auth.txt vpn2.ovpn vpn2-auth.txt
          echo "✅ Ephemeral runner cleanup completed"
