name: "CSV Maintenance"
run-name: "CSV Maintenance | ${{ inputs.operation }} | #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Controlled data operation"
        required: true
        type: choice
        options:
          - validate
          - restore-accidental-deletion
          - intentional-reset
          - delete-empty-csv-file
          - preview-selected-batches
          - delete-selected-batches
          - preview-existing-deletions
          - register-existing-deletions
      confirmation:
        description: "RESET_PRICE_LOG, DELETE_EMPTY_CSV_FILE, DELETE_PRICE_BATCHES, or REGISTER_DELETED_BATCHES"
        required: false
        type: string
      reason:
        description: "Required non-sensitive reason for reset or selected deletion"
        required: false
        type: string
      batch_timestamps_nz:
        description: "Exact timestamp_nz run(s), comma separated; each removes all 11 symbol rows"
        required: false
        type: string

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data

concurrency:
  group: crypto-runtime-data
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate controlled maintenance request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      private_code_sha: ${{ steps.release.outputs.private_code_sha }}
    steps:
      - name: Require protected public main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout protected public release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate enabled runtime-maintenance capability
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability runtime_maintenance
          --github-output "$GITHUB_OUTPUT"

      - name: Validate protected request
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_REASON: ${{ inputs.reason }}
          REQUEST_BATCH_TIMESTAMPS: ${{ inputs.batch_timestamps_nz }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN" || { echo "No effective private code-read token is configured"; exit 1; }
          test -n "$PRIVATE_DATA_TOKEN" || { echo "No effective private data token is configured"; exit 1; }
          case "$REQUESTED_OPERATION" in
            intentional-reset)
              test "$REQUEST_CONFIRMATION" = "RESET_PRICE_LOG"
              test -n "$REQUEST_REASON"
              ;;
            delete-empty-csv-file)
              test "$REQUEST_CONFIRMATION" = "DELETE_EMPTY_CSV_FILE"
              test -n "$REQUEST_REASON"
              ;;
            delete-selected-batches)
              test "$REQUEST_CONFIRMATION" = "DELETE_PRICE_BATCHES"
              test -n "$REQUEST_REASON"
              test -n "$REQUEST_BATCH_TIMESTAMPS"
              ;;
            preview-selected-batches)
              test -n "$REQUEST_REASON"
              test -n "$REQUEST_BATCH_TIMESTAMPS"
              ;;
            register-existing-deletions)
              test "$REQUEST_CONFIRMATION" = "REGISTER_DELETED_BATCHES"
              test -n "$REQUEST_REASON"
              test -n "$REQUEST_BATCH_TIMESTAMPS"
              ;;
            preview-existing-deletions)
              test -n "$REQUEST_REASON"
              test -n "$REQUEST_BATCH_TIMESTAMPS"
              ;;
            validate|restore-accidental-deletion) ;;
            *) echo "Unsupported maintenance operation"; exit 1 ;;
          esac

  maintain-runtime-data:
    name: Maintain isolated private runtime data
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_CODE_SHA: ${{ needs.validate-request.outputs.private_code_sha }}
    steps:
      - name: Checkout pinned CSV integrity source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_CODE_SHA }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private runtime data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Execute the selected controlled operation
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          RESET_REASON: ${{ inputs.reason }}
          BATCH_TIMESTAMPS_NZ: ${{ inputs.batch_timestamps_nz }}
        run: |
          set -euo pipefail
          INTEGRITY="private_source/Crypto Logger-Private Repo/csv_integrity.py"
          RECOVERY_DIR="${RUNNER_TEMP}/csv-recovery"
          mkdir -p "$RECOVERY_DIR"
          case "$REQUESTED_OPERATION" in
            validate)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --recovery-dir "$RECOVERY_DIR" --validate-only \
                --missing-policy fail
              ;;
            restore-accidental-deletion)
              python scripts/manage_csv_file_lifecycle.py \
                --mode guard-recovery \
                --path private_data/price_log.csv \
                --state-path private_data/csv_state.json
              python "$INTEGRITY" --path private_data/price_log.csv \
                --recovery-dir "$RECOVERY_DIR" \
                --missing-policy restore-from-git --git-repository private_data
              ;;
            intentional-reset)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --intentional-reset --confirm-reset RESET_PRICE_LOG \
                --reset-reason "$RESET_REASON"
              ;;
            delete-empty-csv-file)
              python scripts/manage_csv_file_lifecycle.py \
                --mode delete-empty \
                --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --confirmation DELETE_EMPTY_CSV_FILE \
                --reason "$RESET_REASON"
              ;;
            preview-selected-batches)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --delete-reason "$RESET_REASON" --preview-delete
              ;;
            delete-selected-batches)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --confirm-delete DELETE_PRICE_BATCHES \
                --delete-reason "$RESET_REASON"
              ;;
            preview-existing-deletions)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --delete-reason "$RESET_REASON" \
                --register-missing-deletions --preview-delete
              ;;
            register-existing-deletions)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --register-missing-deletions \
                --confirm-registration REGISTER_DELETED_BATCHES \
                --delete-reason "$RESET_REASON"
              ;;
          esac

      - name: Commit only intentional maintenance state
        if: >-
          inputs.operation == 'restore-accidental-deletion' ||
          inputs.operation == 'intentional-reset' ||
          inputs.operation == 'delete-empty-csv-file' ||
          inputs.operation == 'delete-selected-batches' ||
          inputs.operation == 'register-existing-deletions'
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          cd private_data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- price_log.csv csv_state.json
          if git diff --cached --quiet; then
            echo "No runtime-data change was required"
            exit 0
          fi
          git commit -m "CSV maintenance: $REQUESTED_OPERATION"
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          git fetch origin "$PRIVATE_DATA_BRANCH"
          git rebase "origin/$PRIVATE_DATA_BRANCH" || {
            git rebase --abort || true
            echo "Runtime data changed concurrently; no overwrite attempted"
            exit 1
          }
          git push origin "HEAD:$PRIVATE_DATA_BRANCH"
          rm -f "$ASKPASS"

      - name: Cleanup maintenance workspaces
        if: always()
        run: |
          rm -rf private_source private_data "${RUNNER_TEMP}/csv-recovery"
          rm -f "${RUNNER_TEMP}/crypto-git-askpass"
