name: "CSV Maintenance"
run-name: "CSV Maintenance | ${{ inputs.operation }} | #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Controlled data operation"
        required: true
        type: choice
        options:
          - validate
          - restore-accidental-deletion
          - preview-reset
          - intentional-reset
          - delete-empty-csv-file
          - preview-selected-batches
          - delete-selected-batches
          - preview-existing-deletions
          - register-existing-deletions
      confirmation:
        description: "RESET_PRICE_LOG, DELETE_EMPTY_CSV_FILE, DELETE_PRICE_BATCHES, or REGISTER_DELETED_BATCHES"
        required: false
        type: string
      reason:
        description: "Reason: required for reset, file deletion, and selected batches (1-200 characters)"
        required: false
        type: string
      large_reset_confirmation:
        description: "Reset over 2000 rows: enter RESET_<row count>_ROWS from preview-reset; otherwise leave blank"
        required: false
        type: string
      batch_timestamps_nz:
        description: "Selected batches only: exact timestamp_nz values, comma separated (max 100); leave blank for reset/file deletion"
        required: false
        type: string

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data

concurrency:
  group: crypto-runtime-data
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate controlled maintenance request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      private_code_sha: ${{ steps.release.outputs.private_code_sha }}
    steps:
      - name: Require protected public main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error title=Wrong branch::Start a new CSV Maintenance run and select branch main."
            exit 1
          }

      - name: Checkout protected public release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate enabled runtime-maintenance capability
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability runtime_maintenance
          --github-output "$GITHUB_OUTPUT"

      - name: Validate protected request
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_REASON: ${{ inputs.reason }}
          REQUEST_BATCH_TIMESTAMPS: ${{ inputs.batch_timestamps_nz }}
          REQUEST_LARGE_RESET_CONFIRMATION: ${{ inputs.large_reset_confirmation }}
        run: |
          set -euo pipefail
          fail_request() {
            printf '::error title=CSV Maintenance request rejected::%s\n' "$1"
            printf '### CSV Maintenance request rejected\n\n%s\n\nNo maintenance operation ran. Start a new run with the corrected inputs.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          require_confirmation() {
            test "$REQUEST_CONFIRMATION" = "$1" || fail_request "Confirmation does not match the selected operation. Enter exactly $1 in Confirmation."
          }
          require_reason() {
            test -n "${REQUEST_REASON//[[:space:]]/}" || fail_request 'Reason is required. Enter a short explanation, for example: Fresh dataset for end-to-end testing.'
            test "${#REQUEST_REASON}" -le 200 || fail_request 'Reason is too long. Use 200 characters or fewer.'
            [[ "$REQUEST_REASON" != *$'\n'* && "$REQUEST_REASON" != *$'\r'* ]] || fail_request 'Reason must be a single line. Remove line breaks and start a new run.'
          }
          require_batches() {
            test -n "${REQUEST_BATCH_TIMESTAMPS//[[:space:]]/}" || fail_request 'Exact timestamp_nz values are required for selected batches. Copy the batch timestamps from price_log.csv, separated by commas; each batch contains 11 rows.'
          }
          test -n "$PRIVATE_CODE_TOKEN" || fail_request 'Private code-read token is missing. Configure PRIVATE_CODE_READ_TOKEN or PRIVATE_REPO_TOKEN before retrying.'
          test -n "$PRIVATE_DATA_TOKEN" || fail_request 'Private data-write token is missing. Configure PRIVATE_DATA_WRITE_TOKEN or PRIVATE_REPO_TOKEN before retrying.'
          if [ -n "$REQUEST_LARGE_RESET_CONFIRMATION" ]; then
            test "$REQUESTED_OPERATION" = intentional-reset || fail_request 'Large reset confirmation is only for intentional-reset. Leave it blank for other operations.'
            [[ "$REQUEST_LARGE_RESET_CONFIRMATION" =~ ^RESET_[0-9]+_ROWS$ ]] || fail_request 'Large reset confirmation has the wrong format. Run preview-reset, then copy its exact RESET_<row count>_ROWS value.'
          fi
          case "$REQUESTED_OPERATION" in
            intentional-reset)
              require_confirmation RESET_PRICE_LOG
              require_reason
              ;;
            delete-empty-csv-file)
              require_confirmation DELETE_EMPTY_CSV_FILE
              require_reason
              ;;
            delete-selected-batches)
              require_confirmation DELETE_PRICE_BATCHES
              require_reason
              require_batches
              ;;
            preview-selected-batches)
              require_reason
              require_batches
              ;;
            register-existing-deletions)
              require_confirmation REGISTER_DELETED_BATCHES
              require_reason
              require_batches
              ;;
            preview-existing-deletions)
              require_reason
              require_batches
              ;;
            validate|restore-accidental-deletion|preview-reset) ;;
            *) fail_request 'Unsupported operation. Choose one of the operations listed in Run workflow.' ;;
          esac

  maintain-runtime-data:
    name: Maintain isolated private runtime data
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_CODE_SHA: ${{ needs.validate-request.outputs.private_code_sha }}
    steps:
      - name: Checkout pinned CSV integrity source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_CODE_SHA }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned CSV helpers
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "$PRIVATE_CODE_SHA"
          test -s "private_source/Crypto Logger-Private Repo/csv_integrity.py"
          test -s "private_source/Crypto Logger-Private Repo/manage_csv_file_lifecycle.py"
          python "private_source/Crypto Logger-Private Repo/csv_integrity.py" --help | grep -q -- --large-reset-confirmation || {
            echo "::error title=Maintenance release update required::The pinned private release does not support the large-reset safeguard. Update the protected release manifest to the approved maintenance release before running this workflow."
            exit 1
          }

      - name: Checkout private runtime data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Execute the selected controlled operation
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          RESET_REASON: ${{ inputs.reason }}
          BATCH_TIMESTAMPS_NZ: ${{ inputs.batch_timestamps_nz }}
          LARGE_RESET_CONFIRMATION: ${{ inputs.large_reset_confirmation }}
        run: |
          set -euo pipefail
          INTEGRITY="private_source/Crypto Logger-Private Repo/csv_integrity.py"
          RECOVERY_DIR="${RUNNER_TEMP}/csv-recovery"
          mkdir -p "$RECOVERY_DIR"
          case "$REQUESTED_OPERATION" in
            preview-reset)
              python "$INTEGRITY" --path private_data/price_log.csv --preview-reset
              ;;
            validate)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --recovery-dir "$RECOVERY_DIR" --validate-only \
                --missing-policy fail
              ;;
            restore-accidental-deletion)
              python "private_source/Crypto Logger-Private Repo/manage_csv_file_lifecycle.py" \
                --mode guard-recovery \
                --path private_data/price_log.csv \
                --state-path private_data/csv_state.json
              python "$INTEGRITY" --path private_data/price_log.csv \
                --recovery-dir "$RECOVERY_DIR" \
                --missing-policy restore-from-git --git-repository private_data
              ;;
            intentional-reset)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --intentional-reset --confirm-reset RESET_PRICE_LOG \
                --reset-reason "$RESET_REASON" \
                --large-reset-confirmation "$LARGE_RESET_CONFIRMATION"
              ;;
            delete-empty-csv-file)
              python "private_source/Crypto Logger-Private Repo/manage_csv_file_lifecycle.py" \
                --mode delete-empty \
                --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --confirmation DELETE_EMPTY_CSV_FILE \
                --git-repository private_data \
                --reason "$RESET_REASON"
              ;;
            preview-selected-batches)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --delete-reason "$RESET_REASON" --preview-delete
              ;;
            delete-selected-batches)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --confirm-delete DELETE_PRICE_BATCHES \
                --delete-reason "$RESET_REASON"
              ;;
            preview-existing-deletions)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --delete-reason "$RESET_REASON" \
                --register-missing-deletions --preview-delete
              ;;
            register-existing-deletions)
              python "$INTEGRITY" --path private_data/price_log.csv \
                --state-path private_data/csv_state.json \
                --delete-batches "$BATCH_TIMESTAMPS_NZ" \
                --register-missing-deletions \
                --confirm-registration REGISTER_DELETED_BATCHES \
                --delete-reason "$RESET_REASON"
              ;;
          esac

      - name: Commit only intentional maintenance state
        if: >-
          inputs.operation == 'restore-accidental-deletion' ||
          inputs.operation == 'intentional-reset' ||
          inputs.operation == 'delete-empty-csv-file' ||
          inputs.operation == 'delete-selected-batches' ||
          inputs.operation == 'register-existing-deletions'
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          cd private_data
          STARTING_DATA_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- price_log.csv csv_state.json
          if git diff --cached --quiet; then
            echo "No runtime-data change was required"
            exit 0
          fi
          git commit -m "CSV maintenance: $REQUESTED_OPERATION" \
            -m "Requested by: $GITHUB_ACTOR" \
            -m "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          git fetch origin "$PRIVATE_DATA_BRANCH"
          test "$(git rev-parse "origin/$PRIVATE_DATA_BRANCH")" = "$STARTING_DATA_SHA" || {
            echo "::error title=Runtime data changed::Another update reached runtime-data during this run. No overwrite was attempted. Review the latest data, run preview-reset again if resetting, and start a new maintenance run."
            exit 1
          }
          git push origin "HEAD:$PRIVATE_DATA_BRANCH"
          {
            printf '### CSV maintenance saved\n\nOperation: `%s`\n\n' "$REQUESTED_OPERATION"
            printf 'Runtime-data commit: `%s`\n\nThe committed CSV/state diff and earlier CSV versions are available in private repository history.\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ASKPASS"

      - name: Cleanup maintenance workspaces
        if: always()
        run: |
          rm -rf private_source private_data "${RUNNER_TEMP}/csv-recovery"
          rm -f "${RUNNER_TEMP}/crypto-git-askpass"
