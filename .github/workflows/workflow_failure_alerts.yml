name: "Workflow Failure Alerts"

on:
  workflow_run:
    workflows:
      - "Crypto Logger | Main"
      - "CSV Audit"
      - "CSV Maintenance"
      - "Neon Audit | Weekly"
      - "Neon Audit | Daily"
      - "Neon Maintenance"
      - "Neon Schema | Controlled Migration"
      - "Crypto Logger | Staging"
      - "Workflow Security"
      - "CodeQL Advanced"
      - "Binance History | 102 Markets"
      - "Binance Live | 102 Markets"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: workflow-alert-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    if: >-
      contains(fromJSON('["failure","cancelled","timed_out","action_required","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Run only this default-branch script. Never fetch artifacts, caches, code
      # or executable commands from the triggering workflow or pull request.
      - name: Record the failed workflow independently of email
        id: incident
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const supported = new Set([
              "CSV Audit", "CSV Maintenance", "Neon Audit | Weekly", "Neon Audit | Daily", "Neon Maintenance",
              "Neon Schema | Controlled Migration", "Crypto Logger | Staging", "Workflow Security", "CodeQL Advanced"
            ]);
            const failures = new Set(["failure", "cancelled", "timed_out", "action_required", "startup_failure"]);
            const isMain = run?.path === ".github/workflows/crypto_runner.yml" &&
              /^Crypto Logger \| Main(?: \| #\d+)?$/.test(run.name);
            const isHistory = run?.path === ".github/workflows/binance_history_100.yml" &&
              run.name === "Binance History | 102 Markets" &&
              run.event === "workflow_dispatch" && run.head_branch === "main";
            const isLive = run?.path === ".github/workflows/binance_live_102.yml" &&
              run.name === "Binance Live | 102 Markets" &&
              run.event === "workflow_dispatch" && run.head_branch === "main";
            if (!run || (!supported.has(run.name) && !isMain && !isHistory && !isLive) || !failures.has(run.conclusion) ||
                run.repository?.full_name !== `${owner}/${repo}` ||
                !Number.isSafeInteger(run.id) || run.id <= 0 ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt <= 0 ||
                !Number.isSafeInteger(run.run_number) || run.run_number <= 0) {
              core.setOutput("required", "false");
              return;
            }
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const clean = value => String(value || "unknown").replace(/[\r\n\x00-\x1f\x7f]/g, " ").slice(0, 160);
            let details = ["Job details unavailable; open the original run's first failed or cancelled step."];
            let stoppedStage = "stage unavailable";
            let jobOutcomes = ["Final job outcomes unavailable; inspect the original run."];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
              });
              if (isHistory && jobs.some(job => (job.steps || []).some(step =>
                  step.name === "Send history batch email" && step.conclusion === "success"))) {
                core.setOutput("required", "false");
                core.notice("Detailed history outcome email already acknowledged; skipping duplicate fallback.");
                return;
              }
              const failedJobs = jobs.filter(job => failures.has(job.conclusion)).slice(0, 10);
              jobOutcomes = jobs.slice(0, 20).map(job => `${clean(job.name)}: ${clean(job.conclusion)}`);
              if (failedJobs.length) {
                const firstStep = (failedJobs[0].steps || []).find(item => failures.has(item.conclusion));
                stoppedStage = clean(firstStep?.name || failedJobs[0].name);
                if (failedJobs.length > 1) stoppedStage += ` (+${failedJobs.length - 1} jobs)`;
              }
              details = failedJobs.map(job => {
                const step = (job.steps || []).find(item => failures.has(item.conclusion));
                return `${clean(job.name)}: ${job.conclusion}` + (step ? `; first stopped step: ${clean(step.name)}` : "");
              });
              if (!details.length) details = ["No failed job details were returned; review the original run conclusion."];
            } catch {
              core.warning("Job details could not be read; retaining the original workflow failure.");
            }
            const body = [
              "CRYPTO LOGGER - FINAL WORKFLOW OUTCOME",
              "", "WHAT HAPPENED",
              `${run.name} ended with ${run.conclusion}.`,
              `Run #${run.run_number}; attempt ${run.run_attempt}.`,
              "", "FAILED STAGE", ...details,
              "", "FINAL JOB OUTCOMES", ...jobOutcomes,
              "", "ACTION REQUIRED",
              "Open the original run below and review its first failed or cancelled step. The step name identifies where execution stopped; it does not prove the underlying cause.",
              isHistory
                ? "The detailed history email was not confirmed or could not run. Check Make notification settings as well as the download step. After resolving the failure, run download again; verified files are reused."
                : isLive
                ? "The live collector failed. Inspect the first failed step and the history gate before retrying. Check the private manifests for any committed minutes."
                : "For a data conflict or changed runtime snapshot, review the current data and start a fresh preview. Never force a stale repair plan.",
              "", "DATA AND SCHEDULING",
              isHistory
                ? "This is the independent history-download fallback. Progress counts are unavailable here; inspect the private release manifests. A run failure does not prove a VPN cause, and partial uploads may already be safely stored."
                : isLive
                ? "This is the independent live-collector result. A failed job alone does not establish which closed minutes were stored."
                : isMain
                ? "This is the final Main workflow result, including downstream jobs. An earlier in-run provider or failure alert may already have been sent; this message records the completed workflow outcome. A job status alone does not establish which rows were saved or prove a VPN cause."
                : "This reports only the named workflow. It does not establish that Main, CSV persistence, Neon, or VPN failed.",
              isHistory
                ? "History runs are manual. This alert does not automatically restart a batch or download more files."
                : isLive
                ? "Live runs are manual at present. This alert does not automatically restart collection or bypass the history gate."
                : "CSV Audit and Neon Audit have independent cron schedules. A failure in one does not cancel the other's scheduled start. Each retains its own data safety checks.",
              "", "ORIGINAL GITHUB ACTIONS RUN", runUrl
            ].join("\n");
            core.setOutput("required", "true");
            core.setOutput("run_id", String(run.id));
            core.setOutput("run_attempt", String(run.run_attempt));
            core.setOutput("run_number", String(run.run_number));
            core.setOutput("workflow_name", run.name);
            core.setOutput("subject", `CRYPTO LOGGER FINAL | ${clean(run.name)} | ${run.conclusion.toUpperCase()}: ${stoppedStage} | Run #${run.run_number}`);
            core.setOutput("body", body);
            // One open issue per workflow/stage/outcome. Keep each new run visible
            // in that issue while limiting Make mail to incident start and daily reminders.
            const crypto = require("crypto");
            const signature = crypto.createHash("sha256")
              .update(JSON.stringify([run.path, run.conclusion, stoppedStage]))
              .digest("hex").slice(0, 24);
            const groupMarker = `<!-- crypto-workflow-group:${signature} -->`;
            const runMarker = `<!-- crypto-workflow-failure:${run.id}:${run.run_attempt} -->`;
            core.setOutput("email_required", "true"); // Issue API failure keeps email as fallback.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", creator: "github-actions[bot]", per_page: 100
            });
            const trusted = issue => !issue.pull_request &&
              issue.user?.login === "github-actions[bot]";
            const sameRun = issues.find(issue => trusted(issue) && (issue.body || "").includes(runMarker));
            if (sameRun) {
              core.setOutput("issue_number", String(sameRun.number));
              core.notice(`Incident already recorded in issue #${sameRun.number}`);
              return;
            }
            const recurring = issues.find(issue => trusted(issue) && (issue.body || "").includes(groupMarker));
            const previousRun = recurring?.body?.match(/<!-- crypto-workflow-latest-run:(\d+) -->/);
            const previousAttempt = recurring?.body?.match(/<!-- crypto-workflow-last-mail-at:([^<>]+) -->/);
            const lastMailAt = previousAttempt ? Date.parse(previousAttempt[1]) : NaN;
            const contiguous = previousRun && Number(previousRun[1]) === run.run_number - 1;
            const shouldEmail = !recurring || !contiguous || !Number.isFinite(lastMailAt) ||
              Date.now() - lastMailAt >= 24 * 60 * 60 * 1000;
            const mailAt = shouldEmail ? new Date().toISOString() : previousAttempt[1];
            const workflowLabel = clean(run.name).replace(/ \| #\d+$/, "");
            const issueTitle = `Crypto Logger: ${workflowLabel} ${run.conclusion} (${stoppedStage})`.slice(0, 240);
            const issueBody = [
              groupMarker, runMarker,
              `<!-- crypto-workflow-latest-run:${run.run_number} -->`,
              `<!-- crypto-workflow-last-mail-at:${mailAt} -->`,
              body,
              "",
              "This issue tracks the latest matching failure. Earlier runs remain in Actions.",
              "Email status is recorded in the separate Workflow Failure Alerts run."
            ].join("\n");
            if (recurring) {
              await github.rest.issues.update({owner, repo, issue_number: recurring.number, title: issueTitle, body: issueBody});
              core.setOutput("issue_number", String(recurring.number));
              core.setOutput("email_required", String(shouldEmail));
              return;
            }
            const created = await github.rest.issues.create({owner, repo,
              title: issueTitle,
              body: issueBody});
            core.setOutput("issue_number", String(created.data.number));

      - name: Checkout trusted default-branch notification code
        if: always() && steps.incident.outputs.required == 'true' && steps.incident.outputs.email_required == 'true'
        id: public_source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the protected notification release pin
        if: always() && steps.public_source.outcome == 'success'
        id: release
        continue-on-error: true
        run: python scripts/validate_release_manifest.py --mode review --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned private email helper
        if: always() && steps.release.outcome == 'success'
        id: private_source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          path: private_notifier
          persist-credentials: false

      - name: Send the workflow failure through the existing Make connection
        if: always() && steps.private_source.outcome == 'success' && steps.incident.outputs.email_required == 'true'
        id: email
        continue-on-error: true
        timeout-minutes: 1
        env:
          ALERT_MAKE_WEBHOOK_URL: ${{ secrets.ALERT_MAKE_WEBHOOK_URL }}
          ALERT_MAKE_API_KEY: ${{ secrets.ALERT_MAKE_API_KEY }}
          FAILED_RUN_ID: ${{ steps.incident.outputs.run_id }}
          FAILED_RUN_ATTEMPT: ${{ steps.incident.outputs.run_attempt }}
          FAILED_RUN_NUMBER: ${{ steps.incident.outputs.run_number }}
          FAILED_WORKFLOW_NAME: ${{ steps.incident.outputs.workflow_name }}
          FAILURE_SUBJECT: ${{ steps.incident.outputs.subject }}
          FAILURE_BODY: ${{ steps.incident.outputs.body }}
        run: timeout --kill-after=5s 45s python scripts/send_workflow_failure.py

      - name: Report notification delivery separately from the failed workflow
        if: always()
        env:
          NOTIFICATION_REQUIRED: ${{ steps.incident.outputs.required }}
          EMAIL_REQUIRED: ${{ steps.incident.outputs.email_required }}
          ISSUE_OUTCOME: ${{ steps.incident.outcome }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.issue_number }}
          ORIGINAL_RUN_ID: ${{ steps.incident.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$NOTIFICATION_REQUIRED" = false ]; then
            echo "This event is outside the configured workflow-failure coverage."
            exit 0
          fi
          {
            echo "## Workflow failure notification"
            echo "- Original run ID: $ORIGINAL_RUN_ID"
            echo "- Incident issue: ${ISSUE_NUMBER:-unavailable}; result: $ISSUE_OUTCOME"
            echo "- Make email result: $EMAIL_OUTCOME"
            echo "- Email success means explicit Make email-module acknowledgment, not verified inbox receipt."
            echo "- Failed/cancelled audits keep their own result; no repair was triggered by this notifier."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EMAIL_REQUIRED" = false ]; then
            echo "Matching outage is already recorded; next email is due on a new incident or after 24 hours."
          elif [ "$EMAIL_OUTCOME" != success ]; then
            echo "::warning::Workflow failure email was not confirmed. Inspect Make connection/scenario history and the notifier setup steps."
          fi
          if [ "$ISSUE_OUTCOME" != success ] && [ "$EMAIL_OUTCOME" != success ]; then
            echo "::error::Both workflow failure reporting channels failed. Review this run and the original failed workflow."
            exit 1
          fi

      - name: Remove the private notifier checkout
        if: always()
        run: rm -rf private_notifier
