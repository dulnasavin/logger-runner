name: "Neon Audit | Weekly"
run-name: "Neon Audit | Weekly | ${{ inputs.operation }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Preview an exact plan or apply one previously previewed plan"
        required: true
        type: choice
        options:
          - preview
          - apply-approved-plan
      approved_plan_id:
        description: "Apply only: paste the exact Plan ID from preview. Leave blank for preview."
        required: false
        type: string
      confirmation:
        description: "Required for apply: APPLY_NEON_RECONCILIATION"
        required: false
        type: string
      change_reason:
        description: "Required non-sensitive reason when applying a plan"
        required: false
        type: string

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data

concurrency:
  group: crypto-runtime-data
  cancel-in-progress: false

jobs:
  reconcile:
    name: Preview or apply an immutable reconciliation plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "01 Validate protected request"
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CHANGE_REASON: ${{ inputs.change_reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$OPERATION" in
            preview) ;;
            apply-approved-plan)
              [[ "$APPROVED_PLAN_ID" =~ ^nrp-v1-[0-9a-f]{64}$ ]] || {
                echo "Apply requires the exact nrp-v1-* ID from preview"
                exit 1
              }
              test "$CONFIRMATION" = "APPLY_NEON_RECONCILIATION"
              test -n "$CHANGE_REASON"
              ;;
            *) echo "Unsupported reconciliation operation"; exit 1 ;;
          esac

      - name: "01.2 Checkout protected public release authority"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "01.3 Validate enabled Neon capability"
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability neon
          --github-output "$GITHUB_OUTPUT"

      - name: "01.4 Validate required secrets"
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN" || { echo "No effective private code-read token is configured"; exit 1; }
          test -n "$PRIVATE_DATA_TOKEN" || { echo "No effective private runtime-data token is configured"; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL is missing"; exit 1; }

      - name: "02 Checkout private runtime data"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 0
          persist-credentials: false

      - name: "03 Verify runtime provenance"
        id: manifest
        env:
          PRIVATE_CODE_SHA: ${{ steps.release.outputs.private_code_sha }}
        run: |
          set -euo pipefail
          test -s private_data/runtime_manifest.json
          SOURCE_SHA="$(jq -r '.source_code_sha // empty' private_data/runtime_manifest.json)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "runtime_manifest.json has no valid source SHA"
            exit 1
          }
          test "$SOURCE_SHA" = "${PRIVATE_CODE_SHA,,}" || {
            echo "Runtime provenance does not match approved PRIVATE_CODE_SHA"
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C private_data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "04 Checkout exact private reconciliation source"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: "04.5 Recover accidental CSV damage before reconciliation"
        run: |
          set -euo pipefail
          INTEGRITY="private_source/Crypto Logger-Private Repo/csv_integrity.py"
          RECOVERY_DIR="${RUNNER_TEMP}/csv-recovery"
          mkdir -p "$RECOVERY_DIR"
          python "private_source/Crypto Logger-Private Repo/manage_csv_file_lifecycle.py" \
            --mode guard-recovery \
            --path private_data/price_log.csv \
            --state-path private_data/csv_state.json
          python "$INTEGRITY" \
            --path private_data/price_log.csv \
            --state-path private_data/csv_state.json \
            --recovery-dir "$RECOVERY_DIR" \
            --missing-policy restore-from-git \
            --git-repository private_data \
            | tee "${RUNNER_TEMP}/csv-preaudit-recovery.txt"

      - name: "05 Assemble immutable reconciliation workspace"
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.manifest.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          for state_file in price_log.csv csv_state.json; do
            test -s "private_data/$state_file"
            cp -- "private_data/$state_file" "private_source/$state_file"
          done
          test -s "private_source/Crypto Logger-Private Repo/requirements.lock"
          test -s "private_source/Crypto Logger-Private Repo/csv_integrity.py"
          test -s "private_source/Neon Weekly Audit/neon_audit.py"
          test -s "private_source/Neon Weekly Audit/neon_persistence.py"

      - name: "06 Set up Python 3.13"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: private_source/Crypto Logger-Private Repo/requirements.lock

      - name: "07 Install and validate hash-locked dependencies"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r "private_source/Crypto Logger-Private Repo/requirements.lock"
          python -m pip check
          python -m py_compile \
            "private_source/Crypto Logger-Private Repo/csv_integrity.py" \
            "private_source/Neon Weekly Audit/neon_audit.py" \
            "private_source/Neon Weekly Audit/neon_persistence.py"

      - name: "08 Reconcile and verify Git persistence before completion"
        id: reconcile
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          OPERATION: ${{ inputs.operation }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id }}
        run: |
          set -euo pipefail
          ASKPASS="${RUNNER_TEMP}/crypto-git-askpass"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PRIVATE_DATA_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          cd private_source
          if test "$OPERATION" = "preview"; then
            python "Neon Weekly Audit/neon_audit.py" --mode preview \
              | tee "${RUNNER_TEMP}/neon-reconciliation-summary.txt"
          else
            python "Neon Weekly Audit/neon_audit.py" --mode apply \
              --approved-plan-id "$APPROVED_PLAN_ID" \
              --runtime-repository "${GITHUB_WORKSPACE}/private_data" \
              | tee "${RUNNER_TEMP}/neon-reconciliation-summary.txt"
          fi

      - name: "10 Publish sanitized reconciliation summary"
        if: always()
        env:
          SOURCE_SHA: ${{ steps.manifest.outputs.source_sha || 'unavailable' }}
          DATA_SHA: ${{ steps.manifest.outputs.data_sha || 'unavailable' }}
          OPERATION: ${{ inputs.operation }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          {
            echo "## Neon Reconciliation Control"
            echo "- Operation: \`$OPERATION\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Starting runtime-data commit: \`$DATA_SHA\`"
            echo "- Apply requires an exact content-addressed plan ID from preview."
            echo "- Reconciliation result: $RECONCILE_OUTCOME"
            echo "- Completion requires a verified remote CSV/state commit."
            echo "- Interrupted persistence remains pending; retry or preview again if the snapshot changed."
            echo "- Same-key conflicts are never auto-overwritten."
            echo "- Neon deletion requires an exact active-generation tombstone."
            if test -s "${RUNNER_TEMP}/neon-reconciliation-summary.txt"; then
              echo "### Sanitized counters"
              grep -E '^(Plan ID|Mode|Dataset generation|Missing in Neon before repair|Inserted into Neon|Missing in CSV before repair|Restored into CSV from Neon|Intentional deletion tombstones|Deleted from Neon|Conflicts|Status|Verified runtime-data commit):' \
                "${RUNNER_TEMP}/neon-reconciliation-summary.txt" || true
            fi
            echo "- Private row contents and raw database logs were not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "11 Cleanup private workspaces"
        if: always()
        run: |
          rm -rf private_data private_source
          rm -f "${RUNNER_TEMP}/crypto-git-askpass"
