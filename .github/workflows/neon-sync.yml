name: "Neon Sync | Manual Catch-up"
run-name: "Neon Sync | Manual Catch-up | #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: dulnasavin/Repository-name-crypto-tracker-Private-Yes
  PRIVATE_DATA_BRANCH: runtime-data

concurrency:
  group: crypto-runtime-data
  cancel-in-progress: false

jobs:
  sync-to-neon:
    name: Sync current runtime data to Neon
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require protected public main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout protected public release authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate enabled Neon capability
        id: release
        run: >-
          python scripts/validate_release_manifest.py
          --mode execute
          --capability neon
          --github-output "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          PRIVATE_CODE_TOKEN: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_CODE_TOKEN" || { echo "No effective private code-read token is configured"; exit 1; }
          test -n "$PRIVATE_DATA_TOKEN" || { echo "No effective private data token is configured"; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL is missing"; exit 1; }

      - name: Checkout current private runtime data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          path: private_data
          fetch-depth: 1
          persist-credentials: false

      - name: Read and validate exact source handoff
        id: manifest
        env:
          PRIVATE_CODE_SHA: ${{ steps.release.outputs.private_code_sha }}
        run: |
          set -euo pipefail
          test -s private_data/runtime_manifest.json
          SOURCE_SHA="$(jq -r '.source_code_sha // empty' private_data/runtime_manifest.json)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "runtime_manifest.json has no valid full source commit SHA"
            exit 1
          }
          test "$SOURCE_SHA" = "${PRIVATE_CODE_SHA,,}" || {
            echo "runtime manifest source is not the approved PRIVATE_CODE_SHA"
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C private_data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact private source from the manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.release.outputs.private_code_sha }}
          path: private_source
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble and validate the catch-up workspace
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.manifest.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private_source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          for required in \
            private_data/price_log.csv \
            private_data/csv_state.json \
            "private_source/Crypto Logger-Private Repo/requirements.lock" \
            "private_source/Crypto Logger-Private Repo/csv_integrity.py" \
            "private_source/Neon Sync/sync_to_neon.py"; do
            test -s "$required" || { echo "Missing required handoff file"; exit 1; }
          done
          cp -- private_data/price_log.csv private_source/price_log.csv
          cp -- private_data/csv_state.json private_source/csv_state.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: private_source/Crypto Logger-Private Repo/requirements.lock

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r "private_source/Crypto Logger-Private Repo/requirements.lock"
          python -m pip check
          python -m py_compile \
            "private_source/Crypto Logger-Private Repo/csv_integrity.py" \
            "private_source/Neon Sync/sync_to_neon.py"

      - name: Run generation-aware catch-up sync
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd private_source
          python "Neon Sync/sync_to_neon.py"

      - name: Add sanitized workflow summary
        if: always()
        env:
          DATA_SHA: ${{ steps.manifest.outputs.data_sha || 'unavailable' }}
          SOURCE_SHA: ${{ steps.manifest.outputs.source_sha || 'unavailable' }}
        run: |
          {
            echo "## Neon manual catch-up"
            echo "- Runtime-data commit: \`$DATA_SHA\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Private CSV row contents were not printed or uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup private checkouts
        if: always()
        run: rm -rf private_data private_source
