name: One-time staging dataset cleanup
on:
  push:
    branches: [staging]
    paths: [.github/workflows/purge_staging_data_20261007.yml]

permissions:
  contents: read

concurrency:
  group: staging-binance-live
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact scoped private cleanup code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: e1e99398f9d7df7e1d52aaaa9477346b64972612
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Delete and verify 200 scoped staging releases and tags
        env:
          PURGE_STAGING_DATA: 'YES'
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/purge_staging_20261007.py
      - name: Remove private source
        if: always()
        run: rm -rf private_source
