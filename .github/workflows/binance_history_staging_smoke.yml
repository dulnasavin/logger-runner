name: Binance History | Staging Read-only Smoke
on:
  push:
    branches: [staging]
    paths: [.github/workflows/binance_history_staging_smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private staging history code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: f160b42a3726a73fea1b9a683b9d414572b9935f
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate staged plan and live spot eligibility
        env:
          HISTORY_MODE: plan
          HISTORY_MAX_FILES: '10000'
          HISTORY_REPORT_PATH: ${{ runner.temp }}/staging-history-plan.json
        run: |
          python private_source/binance_history/run.py
          PYTHONPATH=private_source/binance_history python -c 'import run; run.verify_live_spot(run.selection()); print("Binance spot market eligibility confirmed for all 100 staged pairs.")'
      - name: Remove private source and report
        if: always()
        env:
          HISTORY_REPORT_PATH: ${{ runner.temp }}/staging-history-plan.json
        run: |
          rm -rf private_source
          rm -f "$HISTORY_REPORT_PATH"
