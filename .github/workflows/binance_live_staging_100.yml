name: Binance Live | Staging 100-Market Batch
on:
  push:
    branches: [staging]
    paths: [.github/workflows/binance_live_staging_100.yml]
  workflow_dispatch:
    inputs:
      pair:
        description: Optional one-market staging test; blank checks all 100
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-binance-live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout pinned private staging collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: 886efc69612b0e4443edc99e398b0da7634e4ca1
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check live continuity regression checks
        run: python -m unittest discover -s private_source/binance_history -p test_live.py -q
      - name: Checkpoint closed minutes for selected markets
        env:
          HISTORY_STAGING: '1'
          HISTORY_LIVE_PAIR: ${{ github.event_name == 'push' && 'BTCUSDT' || inputs.pair || '' }}
          HISTORY_LIVE_MAX_MINUTES: '55'
          HISTORY_CODE_SHA: 886efc69612b0e4443edc99e398b0da7634e4ca1
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/live.py
      - name: Remove private source
        if: always()
        run: rm -rf private_source
