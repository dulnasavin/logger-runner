name: Binance Live | Staging 100-Market Batch
on:
  push:
    branches: [staging]
    paths: [.github/workflows/binance_live_staging_100.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-binance-live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout pinned private staging collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dulnasavin/Repository-name-crypto-tracker-Private-Yes
          ref: 7f29cee08a4731e36c9dc42e7f9fff91d0e0b82e
          token: ${{ secrets.PRIVATE_CODE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          path: private_source
          sparse-checkout: binance_history
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Checkpoint closed minutes for all 100 markets
        env:
          HISTORY_STAGING: '1'
          HISTORY_LIVE_MAX_MINUTES: '55'
          HISTORY_CODE_SHA: 7f29cee08a4731e36c9dc42e7f9fff91d0e0b82e
          HISTORY_STORAGE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: python private_source/binance_history/live.py
      - name: Remove private source
        if: always()
        run: rm -rf private_source
