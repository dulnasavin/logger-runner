name: Microsoft Graph Email Alert Test
run-name: "🧪 GRAPH EMAIL TEST | ${{ github.actor }} | ${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-graph-email:
    name: Verify five secrets and send to both recipients
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "01 Validate private repository access"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || { echo "❌ PRIVATE_REPO_TOKEN missing"; exit 1; }
          echo "✅ Private repository access secret is configured"

      - name: "02 Confirm all five Microsoft Graph email secrets"
        env:
          ALERT_MS_CLIENT_ID: ${{ secrets.ALERT_MS_CLIENT_ID }}
          ALERT_MS_REFRESH_TOKEN: ${{ secrets.ALERT_MS_REFRESH_TOKEN }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO_PRIMARY: ${{ secrets.ALERT_EMAIL_TO_PRIMARY }}
          ALERT_EMAIL_TO_SECONDARY: ${{ secrets.ALERT_EMAIL_TO_SECONDARY }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in ALERT_MS_CLIENT_ID ALERT_MS_REFRESH_TOKEN ALERT_EMAIL_FROM ALERT_EMAIL_TO_PRIMARY ALERT_EMAIL_TO_SECONDARY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "❌ ${secret_name} is missing"
              missing=1
            else
              echo "✅ ${secret_name} is configured"
            fi
          done
          test "$missing" -eq 0
          normalized_client_id="$(printf '%s' "$ALERT_MS_CLIENT_ID" | tr -d '[:space:]')"
          test "$normalized_client_id" = "32752538-0b8b-4e8f-a396-158f59ee3475" || { echo "❌ ALERT_MS_CLIENT_ID does not match the Entra Application (client) ID used by the successful local test"; exit 1; }
          echo "✅ ALERT_MS_CLIENT_ID exactly matches the authorized Entra application"

      - name: "03 Clone private main"
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dulnasavin/Repository-name-crypto-tracker-Private-Yes.git" private_logger
          echo "✅ Private alert code cloned"

      - name: "04 Setup Python 3.13"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "05 Compile Microsoft Graph alert code"
        run: |
          set -euo pipefail
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          test -s "$NOTIFIER"
          python -m py_compile "$NOTIFIER"
          echo "✅ Microsoft Graph alert code compiles"

      - name: "06 Send manual GitHub Actions test to both recipients"
        env:
          ALERT_MS_CLIENT_ID: ${{ secrets.ALERT_MS_CLIENT_ID }}
          ALERT_MS_REFRESH_TOKEN: ${{ secrets.ALERT_MS_REFRESH_TOKEN }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO_PRIMARY: ${{ secrets.ALERT_EMAIL_TO_PRIMARY }}
          ALERT_EMAIL_TO_SECONDARY: ${{ secrets.ALERT_EMAIL_TO_SECONDARY }}
          CRYPTO_LOGGER_ENVIRONMENT: PRODUCTION-TEST
        run: |
          set -euo pipefail
          NOTIFIER="private_logger/Crypto Logger-Private Repo/vpn_auth_recovery/alert_email.py"
          SUBJECT="Crypto Tracker GitHub Actions Graph Alert Test | Run #${GITHUB_RUN_NUMBER}"
          BODY="$(printf '%s\n' "Microsoft Graph OAuth2 delivery from GitHub Actions is working." "" "Repository: ${GITHUB_REPOSITORY}" "Workflow: ${GITHUB_WORKFLOW}" "Run ID: ${GITHUB_RUN_ID}" "Run attempt: ${GITHUB_RUN_ATTEMPT}" "UTC time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" "" "This test validates all five Graph/email secrets and delivery to both configured recipients." "No crypto failure occurred.")"
          python "$NOTIFIER" --subject "$SUBJECT" --body "$BODY"

      - name: "07 Publish test summary"
        if: success()
        run: |
          {
            echo "## ✅ Microsoft Graph email test passed"
            echo ""
            echo "- All five Graph/email secrets were present."
            echo "- The private OAuth2 sender compiled."
            echo "- Microsoft Graph accepted one high-priority message for both configured recipients."
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
